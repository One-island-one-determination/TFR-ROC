l_simp_chinese:
 LOADING_TIP_0: "反攻大陸，解救同胞，救中國…\n ——蔣中正"
 LOADING_TIP_1: "我認為台灣失去的會非常少，唯一失去的就是台獨的自由。\n ——黃志賢"
 LOADING_TIP_2: "馬英九憑什麼沒收我的牛，馬英九還我牛\n —— 柯錫海"
 LOADING_TIP_3: "鄉親長輩們，聖戰已經開始了！\n —— 柯建銘"
 LOADING_TIP_4: "再好的木材，遇到大海只能漂浮！\n —— 韓國瑜"
 LOADING_TIP_5: "我就是中華民國最強外掛！\n ——郭台銘"
 LOADING_TIP_6: "台灣吶，要交給你們了\n ——— 李登輝"
 LOADING_TIP_7: "中國歷史沒有拋棄台灣，台灣也不能拋棄中國大陸。\n —— 李登輝"
 LOADING_TIP_8: "中華民國絕不承認兩個中國。\n —— 蔣經國"
 LOADING_TIP_9: "一個戰爭販子，一個民族敗類，你們為什麼要保護他？\n —— 張安樂"
 LOADING_TIP_10: "我身後的總統府，離廣場上的人民，只有幾百公尺的距離，不過，總統府裡面的人，就是聽不到人民的聲音。\n —— 蔡英文"
 LOADING_TIP_11: "和平有兩種，一種是夠強，一種是投降。 \n —— 卓榮泰"
 LOADING_TIP_12: "大家都曉得垃圾也有白色的啊，這個廁所用過的衛生紙就是最髒的白色的垃圾啊。\n —— 丁守中"
 LOADING_TIP_13: "（把鳳梨酥）送給與我建交的國家當禮物，那些國家說不定吃了之後，覺得『很好吃』，就不會跟你斷交了\n —— 吳萼洋"
 LOADING_TIP_14: "「沒有什麼事比夢想熄滅更讓人失望。」\n —— 陳鏞基"
 LOADING_TIP_15: "我就是中華民國最強外掛！\n —— 郭台銘"
 LOADING_TIP_16: "為何凡事都要聽美國人的話？現在是展現我們主權的時候了。\n —— 呂秀蓮"
 LOADING_TIP_17: "在那叫什麼！\n —— 蘇貞昌"
 LOADING_TIP_18: "我們都是中國人\n —— 蔣經國"
 LOADING_TIP_19: "不是表決多數贏就可以，不是哦，不是這樣喔！\n —— 賴清德"
 LOADING_TIP_20: "大陸目前的社會危機唯一的化解之道就是和平民主轉型，而這個任務只有三民主義力量才能完成。\n —— 陳榮利"
 LOADING_TIP_21: "和平、奮鬥、救中國… \n —— 孫文"
