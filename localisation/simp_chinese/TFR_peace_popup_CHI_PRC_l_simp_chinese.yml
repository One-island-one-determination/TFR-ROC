l_simp_chinese:
  TFR_PEACE_POPUP_FLAVOR_CHI_LOSE: "死去元知萬事空，但悲不見九州同。"

  TFR_PEACE_POPUP_FLAVOR_PRC_HUANG_MING: "詔令猶出京師，四海已無應者。"
  TFR_PEACE_POPUP_FLAVOR_PRC_NICK_LAND: "其進銳者，其退速。"

  TFR_PEACE_POPUP_FLAVOR_SIC: "蜀道未窮，舊夢先斷。"
  TFR_PEACE_POPUP_FLAVOR_SIC_SERVANT: "但願蒼生俱飽暖，不辭辛苦出山林。"
  TFR_PEACE_POPUP_FLAVOR_SIC_OVERLORD: "算無遺策，獨漏天命。"

  TFR_PEACE_POPUP_FLAVOR_SIK: "瀚海茫茫，復國何年？"
  TFR_PEACE_POPUP_FLAVOR_TAR: "雪嶺埋征甲，寒雲掩故營。"
  TFR_PEACE_POPUP_FLAVOR_TIB: "經幡猶舞，山河已非。"
  TFR_PEACE_POPUP_FLAVOR_XIN: "宜將剩勇追窮寇，不可沽名學霸王。"
  TFR_PEACE_POPUP_FLAVOR_IMA: "復國之志未酬，陰山之旗先落。"
  TFR_PEACE_POPUP_FLAVOR_MON: "草原無盡處，國祚有窮時。"
  TFR_PEACE_POPUP_FLAVOR_NIS: "祁連山月冷，祈聲入長風。"
  TFR_PEACE_POPUP_FLAVOR_NK2: "故國既亡，孤軍何歸？"

  TFR_PEACE_POPUP_FLAVOR_CNT: "中軍鼓角寂，四野盡秋聲。"
  TFR_PEACE_POPUP_FLAVOR_NTT: "遼海旌旗落，朔風吹故營。"
  TFR_PEACE_POPUP_FLAVOR_ESF: "艨艟千里，竟無容身之港。"
  TFR_PEACE_POPUP_FLAVOR_A74: "嶺海旌旗盡，孤城聽夜潮。"
  TFR_PEACE_POPUP_FLAVOR_A75: "滇南鼓角絕，歸雁過空營。"
  TFR_PEACE_POPUP_FLAVOR_A77: "劍門烽火息，殘甲葬秋山。"
  TFR_PEACE_POPUP_FLAVOR_A78: "關東鐵甲盡，風雪掩軍徽。"
  TFR_PEACE_POPUP_FLAVOR_A81: "朔野征塵盡，孤營對落暉。"
  TFR_PEACE_POPUP_FLAVOR_A83: "中原舊營壘，今日遍蒿萊。"

  TFR_PEACE_POPUP_FLAVOR_CHF: "金陵雖有府，政令不由己。"
  TFR_PEACE_POPUP_FLAVOR_GAN: "關山正飛雪，烽戍斷無煙。"
  TFR_PEACE_POPUP_FLAVOR_GXC: "桂嶺千峰在，孤軍一夕空。"
  TFR_PEACE_POPUP_FLAVOR_YUN: "滇池既復，遺民何之？"
  TFR_PEACE_POPUP_FLAVOR_JIA: "江南煙雨依舊，城頭旌旗已非。"
  TFR_PEACE_POPUP_FLAVOR_HNJ: "漢水依然東去，故營已沒秋聲。"
  TFR_PEACE_POPUP_FLAVOR_UYY: "兩江同赴海，盟誓各隨流。"
  TFR_PEACE_POPUP_FLAVOR_XSM: "金玉滿堂，莫之能守。"
  TFR_PEACE_POPUP_FLAVOR_BDG: "拓荒千里，竟無立錐之地。"
  TFR_PEACE_POPUP_FLAVOR_MST: "耳目遍九州，獨不聞亡聲。"
  TFR_PEACE_POPUP_FLAVOR_NMA: "白山黑水，盡葬他鄉客。"
  TFR_PEACE_POPUP_FLAVOR_INM: "官牘猶存，塞垣已易幟。"
  TFR_PEACE_POPUP_FLAVOR_APF: "迫於飢寒，遂至鋌而走險。"

  TFR_PEACE_POPUP_FLAVOR_SHA: "星火復燃，竟成餘燼。"
  TFR_PEACE_POPUP_FLAVOR_NCM: "滅己以成眾，眾盡而誰存？"
  TFR_PEACE_POPUP_FLAVOR_NLM: "大道未行，湘水先寒。"
  TFR_PEACE_POPUP_FLAVOR_NSF: "欲扶將傾之廈，終埋瓦礫之中。"
  TFR_PEACE_POPUP_FLAVOR_RGT: "斯文未喪，斯人先亡。"
  TFR_PEACE_POPUP_FLAVOR_PST: "田園將蕪，歸去何方？"
  TFR_PEACE_POPUP_FLAVOR_TND: "霹靂驚四野，一朝萬籟寂。"
  TFR_PEACE_POPUP_FLAVOR_MSC: "凡所有相，皆是虛妄。"
  TFR_PEACE_POPUP_FLAVOR_CAG: "末日未至，神國先亡。"
  TFR_PEACE_POPUP_FLAVOR_FAL: "法輪轉盡，劫火猶存。"
  TFR_PEACE_POPUP_FLAVOR_XFT: "食得鹹魚抵得渴，出得嚟行，預咗要還。"
  TFR_PEACE_POPUP_FLAVOR_XIE: "舊時王謝堂前燕，飛入尋常百姓家。"

  TFR_PEACE_POPUP_FLAVOR_PDTO_MANCHURIA: "關東雪未盡，征旆已成塵。"
