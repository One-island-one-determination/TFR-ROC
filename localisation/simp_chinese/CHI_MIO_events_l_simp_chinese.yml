l_simp_chinese:
 CHI.TW.61.t:0 "中科院設施遭到毀滅性空襲"
 CHI.TW.61.d:0 "隨著台海戰火擴大，敵方精準導彈突破了我方防空網，國家中山科學研究院（中科院）總部與核心研發設施遭精準打擊。研發人員傷亡慘重，多項關鍵武器研發計畫被迫中斷。"
 CHI.TW.61.a:0 "這對我們的自主國防是致命的打擊..."
 CHI_ncsist_destroyed:0 "中科院設施癱瘓"
 CHI_ncsist_destroyed_desc:0 "由於中科院核心設施遭到破壞，國防科技研發與軍工生產效率嚴重下降。"
 CHI.TW.63.t:0 "重建國家中山科學研究院"
 CHI.TW.63.d:0 "隨著戰局穩定與資源重新調配，我們正式啟動了中科院設施的重建計畫..."
 CHI.TW.63.a:0 "盡快恢復我們的研發量能！"
 CHI_ncsist_rebuilding:0 "重建中科院"
 CHI_ncsist_rebuilding_desc:0 "我們正在全力重建國家中山科學研究院的設施，投入大量資源以盡快恢復軍工研發與生產量能。"
