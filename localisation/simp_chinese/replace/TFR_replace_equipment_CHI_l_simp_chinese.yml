 ### 步兵輕武器 ###
 CHI_infantry_equipment_1: "T65K2 步槍"
 CHI_infantry_equipment_1_short: "T65K2"
 CHI_infantry_equipment_1_desc: "由聯勤第205廠研製的5.56公釐步槍，改良自T65系列，調整提把與護木隔熱設計，曾長期配發國軍部隊。"
 CHI_infantry_equipment_2: "T91 戰鬥步槍"
 CHI_infantry_equipment_2_short: "T91"
 CHI_infantry_equipment_2_desc: "採用短行程活塞傳動系統的5.56公釐步槍，設有戰術滑軌以安裝瞄具及相關附件，為國軍制式步槍之一。"
 CHI_infantry_equipment_3: "T91K1 戰鬥步槍"
 CHI_infantry_equipment_3_short: "T91K1"
 CHI_infantry_equipment_3_desc: "T91步槍的後續改良型，調整槍身人體工學設計，並改善瞄具及戰術附件的安裝配置。"
 CHI_infantry_equipment_4: "T112 戰鬥步槍"
 CHI_infantry_equipment_4_short: "T112"
 CHI_infantry_equipment_4_desc: "採用人體工學握把、M-LOK戰術導軌及複合材質機匣的步槍，設計上考量不同作戰環境的使用需求。"
 CHI_infantry_equipment_5: "T112K2 戰鬥步槍"
 CHI_infantry_equipment_5_short: "T112K2"
 CHI_infantry_equipment_5_desc: "以T112步槍為基礎的改良型，針對特種作戰及城鎮環境調整槍身配置與附件安裝方式。"
 CHI_infantry_equipment_6: "T115 6.5mm 戰鬥步槍"
 CHI_infantry_equipment_6_short: "T115"
 CHI_infantry_equipment_6_desc: "採用6.5公釐彈藥的步槍，設計著重中遠距離射擊及對具備防護的目標進行射擊。"

 ### 反裝甲武器 ###
 CHI_anti_tank_equipment_1: "66式火箭筒"
 CHI_anti_tank_equipment_1_short: "66式"
 CHI_anti_tank_equipment_1_desc: "參考美製M72 LAW設計的單兵用輕型火箭筒，主要用於攻擊輕裝甲載具與簡易防禦工事。"
 CHI_anti_tank_equipment_2: "紅隼反裝甲火箭"
 CHI_anti_tank_equipment_2_short: "紅隼"
 CHI_anti_tank_equipment_2_desc: "由中科院研製的單兵肩射反裝甲火箭，使用輕量化發射筒，用於攻擊裝甲載具及防禦工事。"
 CHI_anti_tank_equipment_3: "紅隼二型反裝甲火箭"
 CHI_anti_tank_equipment_3_short: "紅隼II"
 CHI_anti_tank_equipment_3_desc: "紅隼反裝甲火箭的後續改良型，調整射程與彈頭設計，以應對配備反應裝甲等附加防護的目標。"
 CHI_anti_tank_equipment_4: "LAGM 雷射導引火箭彈"
 CHI_anti_tank_equipment_4_short: "LAGM"
 CHI_anti_tank_equipment_4_desc: "採用半主動雷射導引的反裝甲火箭系統，透過雷射標定引導彈藥飛向目標，供步兵執行遠距離反裝甲任務。"

 ### 便攜防空武器 ###
 CHI_anti_air_equipment_1: "FIM-92 刺針飛彈"
 CHI_anti_air_equipment_1_short: "FIM-92"
 CHI_anti_air_equipment_1_desc: "美製單兵攜行式防空飛彈，使用紅外線尋標器追蹤目標，主要用於攔截低空飛行的航空器。"
 CHI_anti_air_equipment_2: "91式便攜地對空飛彈"
 CHI_anti_air_equipment_2_short: "91式"
 CHI_anti_air_equipment_2_desc: "引進的單兵攜行式防空飛彈，採用雙重尋標器設計，主要用於接戰低空飛行的固定翼飛機與直升機。"
 CHI_anti_air_equipment_3: "天劍三型防空飛彈"
 CHI_anti_air_equipment_3_short: "天劍三型"
 CHI_anti_air_equipment_3_desc: "由中科院研製的陸基防空飛彈系統，整合雷達導引設備，並以機動部署為設計方向。"

 ### 牽引火砲 ###
 CHI_artillery_equipment_1: "63式 105公釐榴彈砲"
 CHI_artillery_equipment_1_short: "63式"
 CHI_artillery_equipment_1_desc: "參考美製M101A1設計的105公釐牽引榴彈砲，主要為地面部隊提供間接火力支援。"
 CHI_artillery_equipment_2: "86式 105公釐榴彈砲"
 CHI_artillery_equipment_2_short: "86式"
 CHI_artillery_equipment_2_desc: "採用改良砲身與射控配置的105公釐牽引榴彈砲，用於執行地面部隊間接火力支援任務。"
 CHI_artillery_equipment_3: "M777 155公釐超輕型榴彈砲"
 CHI_artillery_equipment_3_short: "M777"
 CHI_artillery_equipment_3_desc: "採用鈦合金等輕量化材料的155公釐牽引榴彈砲，可由符合載重條件的直升機吊掛運輸。"
 CHI_artillery_equipment_4: "T-120 155公釐榴彈砲"
 CHI_artillery_equipment_4_short: "T-120"
 CHI_artillery_equipment_4_desc: "由中科院研製的52倍徑155公釐牽引榴彈砲，配備自動化射控系統，設計著重射程與射擊準備作業。"

 ### 火箭砲 ###
 CHI_rocket_artillery_equipment_1: "工蜂四型多管火箭系統"
 CHI_rocket_artillery_equipment_1_short: "工蜂四型"
 CHI_rocket_artillery_equipment_1_desc: "由中科院研製的早期多管火箭系統，主要用於灘岸火力覆蓋及反登陸防禦。"
 CHI_rocket_artillery_equipment_2: "雷霆2000多管火箭系統"
 CHI_rocket_artillery_equipment_2_short: "雷霆2000"
 CHI_rocket_artillery_equipment_2_desc: "國軍使用的車載多管火箭系統，可發射MK-15、MK-30及MK-45等火箭彈，用於區域火力打擊與灘岸防禦。"

 ### 摩托車化載具 ###
 CHI_motorized_equipment_1: "萬國 7400 重型戰術輪車"
 CHI_motorized_equipment_1_short: "萬國 7400"
 CHI_motorized_equipment_1_desc: "自美國引進的商規重型輪式卡車，供地面部隊執行後勤運輸及機動支援任務。"
 CHI_motorized_equipment_2: "中型戰術輪車 (FMTV)"
 CHI_motorized_equipment_2_short: "FMTV"
 CHI_motorized_equipment_2_desc: "中型戰術輪式卡車，採用模組化貨台配置，主要用於部隊補給、裝備及人員運輸。"
 CHI_motorized_equipment_3: "裕隆 3000 戰術輪車"
 CHI_motorized_equipment_3_short: "裕隆 3000"
 CHI_motorized_equipment_3_desc: "國內製造的軍用輪式運輸車，供部隊執行物資補給、裝備運送及人員機動任務。"

 ### 步兵戰車 (IFV) ###
 CHI_mechanized_equipment_1: "CM-21 步兵戰車"
 CHI_mechanized_equipment_1_short: "CM-21"
 CHI_mechanized_equipment_1_desc: "以美製M113為基礎研製的履帶式裝甲車，採用射擊孔與間隙裝甲設計，主要執行步兵運輸及支援任務。"
 CHI_mechanized_equipment_2: "CM-21A2 步兵戰車"
 CHI_mechanized_equipment_2_short: "CM-21A2"
 CHI_mechanized_equipment_2_desc: "CM-21裝甲車的改良型，更新動力及懸吊系統，以延長車輛服役年限。"
 CHI_mechanized_equipment_3: "CM-34 雲豹步兵戰車"
 CHI_mechanized_equipment_3_short: "CM-34"
 CHI_mechanized_equipment_3_desc: "雲豹系列八輪裝甲車的步兵戰鬥型，搭載Mk 44 30公釐鏈砲，用於機械化步兵運輸與火力支援。"
 CHI_mechanized_equipment_4: "CM-34A1 雲豹步兵戰車"
 CHI_mechanized_equipment_4_short: "CM-34A1"
 CHI_mechanized_equipment_4_desc: "CM-34系列的改良型，延續Mk 44 30公釐鏈砲配置，並調整光電射控設備與附加裝甲。"
 CHI_mechanized_equipment_5: "CM-14A 步兵戰車"
 CHI_mechanized_equipment_5_short: "CM-14A"
 CHI_mechanized_equipment_5_desc: "輕量化履帶式步兵戰車原型，設計著重地面機動、乘員防護及步兵火力支援。"

 ### 裝甲運兵車 (APC) ###
 CHI_light_mechanized_equipment_1: "V-150 裝甲運兵車"
 CHI_light_mechanized_equipment_1_short: "V-150"
 CHI_light_mechanized_equipment_1_desc: "美製四輪裝甲車，具備水上浮渡能力，曾配發國軍機械化部隊與憲兵單位，執行運輸、巡邏及警戒任務。"
 CHI_light_mechanized_equipment_2: "CM-31 六輪裝甲車"
 CHI_light_mechanized_equipment_2_short: "CM-31"
 CHI_light_mechanized_equipment_2_desc: "由聯勤與愛爾蘭廠商合作開發的六輪裝甲車試驗型，其研發經驗為後續雲豹車系提供參考。"
 CHI_light_mechanized_equipment_3: "CM-33 雲豹裝甲運兵車"
 CHI_light_mechanized_equipment_3_short: "CM-33"
 CHI_light_mechanized_equipment_3_desc: "雲豹系列八輪裝甲運兵車，搭載TS-96遙控武器站，配備40公釐榴彈槍與T74機槍。"
 CHI_light_mechanized_equipment_4: "雲豹二代裝甲車"
 CHI_light_mechanized_equipment_4_short: "雲豹二代"
 CHI_light_mechanized_equipment_4_desc: "雲豹八輪裝甲車的後續平台，採用修訂後的車體配置、液壓懸吊、環周影像系統與更新的射控設備。"
 CHI_light_mechanized_equipment_5: "CM-14 裝甲運兵車"
 CHI_light_mechanized_equipment_5_short: "CM-14"
 CHI_light_mechanized_equipment_5_desc: "新型裝甲運兵車平台，車體防護設計著重地雷、簡易爆炸裝置及其他地面威脅。"

 ### 兩棲戰車 ###
 CHI_amphibious_mechanized_equipment_1: "AAV-7A1 兩棲突擊載具"
 CHI_amphibious_mechanized_equipment_1_short: "AAV-7A1"
 CHI_amphibious_mechanized_equipment_1_desc: "履帶式兩棲突擊車，配發海軍陸戰隊，主要用於艦岸間人員與裝備輸送及登陸作戰。"
 CHI_amphibious_mechanized_equipment_2: "CM-14B 兩棲突擊載具"
 CHI_amphibious_mechanized_equipment_2_short: "CM-14B"
 CHI_amphibious_mechanized_equipment_2_desc: "由中科院研製的兩棲突擊載具，採用改良型水上推進系統及複合裝甲配置，用於支援登陸作戰。"

 ### 輕型戰車 / 輪型戰車 ###
 CHI_light_tank_chassis_0: "M41A3 華克猛犬戰車"
 CHI_light_tank_chassis_0_short: "M41A3"
 CHI_light_tank_chassis_0_desc: "美製輕型戰車，搭載76公釐戰車砲，曾用於裝甲部隊偵察、警戒及外島防禦任務。"
 CHI_light_tank_chassis_1: "M41D 猛犬輕戰車"
 CHI_light_tank_chassis_1_short: "M41D"
 CHI_light_tank_chassis_1_desc: "M41系列戰車的國軍改良型，換裝柴油引擎、數位射控系統及CV-90履帶，以延續車輛使用年限。"
 CHI_light_tank_chassis_2: "獵豹 105公釐輪型戰車"
 CHI_light_tank_chassis_2_short: "獵豹 105"
 CHI_light_tank_chassis_2_desc: "以雲豹二代底盤為基礎的105公釐輪型火力支援車，採用低後座力戰車砲，並以D1、D2樣車進行測試。"
 CHI_light_tank_chassis_3: "獵豹改良型輪型戰車"
 CHI_light_tank_chassis_3_short: "獵豹改"
 CHI_light_tank_chassis_3_desc: "獵豹輪型戰車的改良型，調整底盤高度與自動裝填系統，以改善車輛配置及操作方式。"

 ### 主戰坦克 (MBT) ###
 CHI_modern_tank_chassis_1: "CM-11 勇虎式戰車"
 CHI_modern_tank_chassis_1_short: "CM-11"
 CHI_modern_tank_chassis_1_desc: "國軍研製的105公釐主戰戰車，採用M48H底盤、M60A3砲塔及M1系列射控設備。"
 CHI_modern_tank_chassis_2: "M60A3 TTS 戰車"
 CHI_modern_tank_chassis_2_short: "M60A3 TTS"
 CHI_modern_tank_chassis_2_desc: "美製M60系列戰車的TTS型，配備105公釐戰車砲及熱影像瞄準裝置，用於地面防禦與裝甲部隊作戰。"
 CHI_modern_tank_chassis_3: "M1A2T 艾布蘭主戰坦克"
 CHI_modern_tank_chassis_3_short: "M1A2T"
 CHI_modern_tank_chassis_3_desc: "中華民國向美國採購的M1A2系列主戰戰車，配備120公釐滑膛砲、複合裝甲及數位化車載通信設備。"
 CHI_modern_tank_chassis_4: "CM-13 主戰坦克"
 CHI_modern_tank_chassis_4_short: "CM-13"
 CHI_modern_tank_chassis_4_desc: "以M1A2T相關技術為基礎的國產主戰戰車，整合Trophy主動防護系統及相關車載設備。"

