 CHI_tank_destroyer_equipment_2_short: "M1045A2"

 ### 戰鬥機 ###
 CHI_fighter_equipment_1: "F-5E/F 虎II式戰鬥機"
 CHI_fighter_equipment_1_short: "F-5E/F"
 CHI_fighter_equipment_1_desc: "美製輕型超音速戰鬥機，長期服役於中華民國空軍，執行空防、巡邏及飛行訓練等任務。"
 CHI_fighter_equipment_2: "幻象2000-5 EI 戰鬥機"
 CHI_fighter_equipment_2_short: "幻象2000-5"
 CHI_fighter_equipment_2_desc: "法國製三角翼戰鬥機，配備RDY雷達與雲母空對空飛彈，主要用於防空攔截任務。"
 CHI_fighter_equipment_3: "F-16AM/BM 戰鬥機"
 CHI_fighter_equipment_3_short: "F-16AM/BM"
 CHI_fighter_equipment_3_desc: "經鳳展專案升級的F-16戰機，換裝APG-83主動電子掃描陣列雷達，並更新座艙與航電系統。"
 CHI_fighter_equipment_4: "ADF 先進防衛戰機"
 CHI_fighter_equipment_4_short: "ADF"
 CHI_fighter_equipment_4_desc: "由中科院與漢翔研發的多用途匿蹤戰機原型，設計涵蓋空中防禦及對地作戰需求。"

 ### 攻擊機 / 多功能戰機 ###
 CHI_CAS_equipment_1: "XA-3 雷鳴攻擊機"
 CHI_CAS_equipment_1_short: "XA-3"
 CHI_CAS_equipment_1_desc: "以AT-3機體為基礎開發的雙座攻擊機原型，用於研究近接空中支援任務所需的武器配置。"
 CHI_CAS_equipment_2: "F-CK-1 C/D 經國號戰鬥機"
 CHI_CAS_equipment_2_short: "F-CK-1"
 CHI_CAS_equipment_2_desc: "F-CK-1戰鬥機的翔升專案改良型，更新航電及武器整合系統，可攜掛萬劍彈等防區外武器。"
 CHI_CAS_equipment_3: "F-16A/B Block 20 戰鬥機"
 CHI_CAS_equipment_3_short: "F-16A/B"
 CHI_CAS_equipment_3_desc: "美製F-16A/B Block 20多用途戰機，可執行防空攔截與對地攻擊等任務。"
 CHI_CAS_equipment_4: "F-16C/D Block 70 戰鬥機"
 CHI_CAS_equipment_4_short: "F-16C/D"
 CHI_CAS_equipment_4_desc: "F-16 Block 70型戰機，配備更新的航電設備，並整合保形油箱與紅外線搜索追蹤系統。"
 CHI_CAS_equipment_5: "F-35C 閃電II 戰鬥機"
 CHI_CAS_equipment_5_short: "F-35C"
 CHI_CAS_equipment_5_desc: "F-35系列的艦載型匿蹤戰鬥機，具備空對空與對地攻擊能力，可由航空母艦及陸上基地部署。"
 CHI_CAS_equipment_6: "XF-36 次世代隱身戰機"
 CHI_CAS_equipment_6_short: "XF-36"
 CHI_CAS_equipment_6_desc: "具備第六代戰機部分設計特徵的匿蹤戰機，主要規劃執行制空及多用途打擊任務。"

