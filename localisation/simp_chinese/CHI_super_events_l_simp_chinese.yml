 CHI_invasion_of_taiwan_super_title: "台海戰爭"
 CHI_invasion_of_taiwan_super_quote: "「大家要曉得：現代的戰爭，不是單純的軍隊的戰爭，而是整個的組織的戰爭！」\n- 蔣介石"
