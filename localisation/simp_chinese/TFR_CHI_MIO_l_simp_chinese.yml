l_simp_chinese:
 # =============================================
 # 臺灣國際造船股份有限公司 (CSBC Corporation, Taiwan)
 # =============================================
 CHI_CSBC_organization: "臺灣國際造船股份有限公司"
 CHI_CSBC_organization_desc: "臺灣國際造船股份有限公司（Taiwan International Shipbuilding Corporation），為中華民國最大的國家級造船廠，承擔潛艦國造計畫、主力艦及水面作戰艦艇的建造任務。其多元化的生產線同時涵蓋資本艦、護衛艦與潛艦。"

 CHI_CSBC_mio_initial_trait: "高效船廠整合"
 CHI_CSBC_mio_initial_trait_desc: "整合各生產線資源，提升艦艇結構完整性與可靠性，並強化產能分配效率。"

 CHI_CSBC_mio_trait_submarine_hunters: "潛艇殺手"
 CHI_CSBC_mio_trait_submarine_hunters_desc: "針對反潛作戰進行專項設計，強化聲納整合、水下探測模組及深水攻擊系統。"

 CHI_CSBC_mio_trait_efficient_patrolling_scheme: "高效巡邏方案"
 CHI_CSBC_mio_trait_efficient_patrolling_scheme_desc: "優化艦艇巡航效率與通訊協調能力，使艦隊能更有效地覆蓋巡邏海域。"

 CHI_CSBC_mio_trait_advanced_sub_scanners: "先進型潛艇掃描儀"
 CHI_CSBC_mio_trait_advanced_sub_scanners_desc: "整合高靈敏度聲納探測系統，強化水面艦艇對潛艦的探測與追蹤能力。"

 CHI_CSBC_mio_trait_high_altitute_catapult: "高海拔彈射器"
 CHI_CSBC_mio_trait_high_altitute_catapult_desc: "改進水上偵察機的彈射裝置，提供更好的空中視野與早期預警探測。"

 CHI_CSBC_mio_trait_light_armor_piercing_guns: "穿甲炮"
 CHI_CSBC_mio_trait_light_armor_piercing_guns_desc: "為主砲開發高初速穿甲彈藥，提升對敵方艦艇裝甲的貫穿能力。"

 CHI_CSBC_mio_trait_brass_case_reloader: "黃銅裝彈機"
 CHI_CSBC_mio_trait_brass_case_reloader_desc: "使用高強度黃銅彈殼與改進的裝填機構，提升輕型火炮的射速與可靠性。"

 CHI_CSBC_mio_trait_anti_air_defense: "對空防禦"
 CHI_CSBC_mio_trait_anti_air_defense_desc: "導入多層次防空火控系統，提升艦艇對來襲航空目標的攔截與防禦效率。"

 CHI_CSBC_mio_trait_heavy_guns: "重炮"
 CHI_CSBC_mio_trait_heavy_guns_desc: "精進重型火炮的結構設計與火控整合，提升主力艦火力輸出與破壞效能。"

 CHI_CSBC_mio_advanced_periscope: "先進潛望鏡"
 CHI_CSBC_mio_advanced_periscope_desc: "採用更隱蔽的光學與電子偵蒐潛望鏡，降低潛艦在水下探測時的暴露風險。"

 CHI_CSBC_mio_trait_piercing_rounds: "穿甲彈"
 CHI_CSBC_mio_trait_piercing_rounds_desc: "裝備最新型重型穿甲彈，專門針對敵方主力艦的厚重裝甲進行打擊。"

 CHI_CSBC_mio_trait_base_defense: "基礎防禦"
 CHI_CSBC_mio_trait_base_defense_desc: "強化艦體裝甲與基礎防空火力，全面提升艦艇在戰區的生存與防禦能力。"
 
 CHI_CSBC_mio_trait_deck_guns: "甲板炮"
 CHI_CSBC_mio_trait_deck_guns_desc: "在甲板上增設輔助防空火力，進一步提升對低空威脅的攔截效率。"

 CHI_CSBC_mio_trait_state_sponsored_dev: "國家資助發展"
 CHI_CSBC_mio_trait_state_sponsored_dev_desc: "藉由政府專項撥款，擴建船廠基礎設施，穩定軍事艦艇生產線並提升資金積累。"

 CHI_CSBC_mio_trait_state_research_grants: "國家資助科研"
 CHI_CSBC_mio_trait_state_research_grants_desc: "引入政府科研補助，加速艦艇設計的研發週期，縮短新型艦艇從概念至量產的時程。"

 CHI_CSBC_mio_trait_24h_shifts_csbc: "24小時輪班制"
 CHI_CSBC_mio_trait_24h_shifts_csbc_desc: "推行全天候輪班生產制度，大幅提升艦艇建造速率，但相應增加工時管理成本。"

 CHI_CSBC_mio_trait_state_subsidizing_csbc: "國家補貼"
 CHI_CSBC_mio_trait_state_subsidizing_csbc_desc: "透過長期補貼協議降低組織升級門檻，鞏固與政府的戰略合作關係，但設計團隊調配成本略有提升。"

 # =============================================
 # 中信造船集團 (Jong Shyn Shipbuilding Group)
 # =============================================
 CHI_Jong_Shyn_organization: "中信造船集團"
 CHI_Jong_Shyn_organization_desc: "中信造船集團，專注於航空母艦、巡洋艦及驅逐艦等大型任務艦的建造，擅長高速遠洋作戰艦艇的開發，為中華民國打造遠洋戰力投射能力。"

 CHI_Jong_Shyn_mio_initial_trait: "艦隊任務艦設計理念"
 CHI_Jong_Shyn_mio_initial_trait_desc: "以任務艦隊的整合作戰為核心設計理念，強化艦體強度並加速研發進程。"

 CHI_Jong_Shyn_mio_trait_long_range_cruising: "長程巡航"
 CHI_Jong_Shyn_mio_trait_long_range_cruising_desc: "優化燃料配置與艦體水動力設計，大幅延伸艦艇的遠洋作戰航程。"

 CHI_Jong_Shyn_mio_trait_high_speed_cruising: "高速巡航"
 CHI_Jong_Shyn_mio_trait_high_speed_cruising_desc: "採用高功率推進系統與整流化船型，顯著提升艦艇的最大航速，適合快速部署任務。"

 CHI_Jong_Shyn_mio_trait_splinter_protection: "碎片防護"
 CHI_Jong_Shyn_mio_trait_splinter_protection_desc: "強化艦艇上層結構與關鍵艙室的防碎片裝甲，降低爆炸破片對人員與設備的殺傷效果。"

 CHI_Jong_Shyn_mio_trait_transom_stern: "流體力學改進"
 CHI_Jong_Shyn_mio_trait_transom_stern_desc: "採用方形艉結構改善航行效率，降低航行阻力並節省燃料消耗。"

 CHI_Jong_Shyn_mio_trait_underway_replenishment_equipment: "海上補給設備"
 CHI_Jong_Shyn_mio_trait_underway_replenishment_equipment_desc: "整合快速海上補給系統，使艦艇可在不靠港的情況下延伸任務時程。"

 CHI_Jong_Shyn_mio_trait_secondary_fire_director_control: "副武器引導控制"
 CHI_Jong_Shyn_mio_trait_secondary_fire_director_control_desc: "整合射控計算機，提升防空武器與輕型火砲的射擊精度。"

 CHI_Jong_Shyn_mio_trait_primary_fire_director_control: "主武器引導控制"
 CHI_Jong_Shyn_mio_trait_primary_fire_director_control_desc: "針對主砲配置精密射控解算系統，大幅提升重型火砲對海攻擊精度。"

 CHI_Jong_Shyn_mio_trait_flight_deck_edge_aa_mounts: "飛行甲板邊緣防空支架"
 CHI_Jong_Shyn_mio_trait_flight_deck_edge_aa_mounts_desc: "在航母飛行甲板邊緣加裝近防火砲，強化航母自身的低空及末段防空能力。"

 CHI_Jong_Shyn_mio_trait_rapid_fire_guns: "速射炮"
 CHI_Jong_Shyn_mio_trait_rapid_fire_guns_desc: "配備高射速自動砲系統，對低空飛行目標及小型水面目標具有顯著壓制效果。"

 CHI_Jong_Shyn_mio_trait_high_velocity_guns: "高速艦炮"
 CHI_Jong_Shyn_mio_trait_high_velocity_guns_desc: "為主砲開發高初速穿甲彈藥，顯著提升對重型艦艇裝甲的貫穿能力。"

 CHI_Jong_Shyn_mio_trait_advanced_fitting_works: "先進裝配作業"
 CHI_Jong_Shyn_mio_trait_advanced_fitting_works_desc: "精進艦艇建造的組裝流程與品質管制，提升產線生產速率。"

 CHI_Jong_Shyn_mio_trait_gyro_stabilized_mounts: "陀螺儀穩定支架"
 CHI_Jong_Shyn_mio_trait_gyro_stabilized_mounts_desc: "採用陀螺儀補償系統，使炮座在艦艇搖晃時仍能維持穩定瞄準，大幅提升命中率。"

 CHI_Jong_Shyn_mio_trait_carrier_flight_operations_center: "先進型消防泵"
 CHI_Jong_Shyn_mio_trait_carrier_flight_operations_center_desc: "整合高壓消防系統與即時損管回饋網路，提升艦艇在作戰損傷後的生存能力。"

 # =============================================
 # 龍德造船工業股份有限公司 (Lungteh Shipbuilding)
 # =============================================
 CHI_Lungteh_organization: "龍德造船工業股份有限公司"
 CHI_Lungteh_organization_desc: "龍德造船工業股份有限公司，專注於護衛艦、巡邏艦及高速飛彈快艇的建造，以沱江艦為代表的匿蹤艦設計著稱，為臺灣近海防禦提供靈活的海上打擊力量。"

 CHI_Lungteh_mio_initial_trait: "沿海快速作戰艦設計理念"
 CHI_Lungteh_mio_initial_trait_desc: "以高機動性、低造價的近海作戰為核心設計哲學，艦艇天生具備優秀的航速與較低的建造成本。"

 CHI_Lungteh_mio_trait_submarine_hunters: "反潛角色優化"
 CHI_Lungteh_mio_trait_submarine_hunters_desc: "整合拖曳陣列聲納與深水炸彈系統，大幅提升護衛艦的水下目標探測與攻擊能力。"

 CHI_Lungteh_mio_trait_high_speed_mine_hunting: "高速掃雷設備"
 CHI_Lungteh_mio_trait_high_speed_mine_hunting_desc: "優化艦內管路布局與推進系統冷卻設計，提升艦艇進行掃雷任務時的最大航速。"

 CHI_Lungteh_mio_trait_advanced_hydrodynamic_design: "先進流體力學設計"
 CHI_Lungteh_mio_trait_advanced_hydrodynamic_design_desc: "運用風洞與水槽測試資料精進船型，在提升速度的同時降低燃料消耗與建造成本。"

 CHI_Lungteh_mio_trait_fleet_escort: "艦隊護航角色"
 CHI_Lungteh_mio_trait_fleet_escort_desc: "強化艦艇作為海域巡邏主力的多功能定位，提升協同巡邏效率與輕型火力輸出。"

 CHI_Lungteh_mio_trait_anti_air_ship: "防空艦船"
 CHI_Lungteh_mio_trait_anti_air_ship_desc: "賦予艦艇強化防空使命，配置多層次近防火力應對各類空中威脅。"

 CHI_Lungteh_mio_trait_armed_escort: "武裝護航"
 CHI_Lungteh_mio_trait_armed_escort_desc: "強化艦艇火力配置，使其兼具火砲打擊與武裝護航能力，適合高烈度近海作戰。"

 CHI_Lungteh_mio_trait_optimized_aa_arcs: "優化防空砲射擊弧線"
 CHI_Lungteh_mio_trait_optimized_aa_arcs_desc: "改進防空砲的配置與射擊弧線，提升防空攔截效率。"

 CHI_Lungteh_mio_trait_gyro_stabilized_mounts: "陀螺儀穩定支架"
 CHI_Lungteh_mio_trait_gyro_stabilized_mounts_desc: "採用陀螺儀補償系統，使炮座在艦艇搖晃時仍能維持穩定瞄準，大幅提升命中率。"

 CHI_Lungteh_mio_trait_improved_aa_mounts: "改進防空炮裝配"
 CHI_Lungteh_mio_trait_improved_aa_mounts_desc: "改進防空炮座的結構安裝與固定工藝，在降低製造成本的同時提升防空火力輸出效率。"

 CHI_Lungteh_mio_trait_mass_production: "大規模生產"
 CHI_Lungteh_mio_trait_mass_production_desc: "推行標準化設計規範與模組化建造工法，大幅提升護衛艦批量生產的效率並降低單艦造價。"

 CHI_Lungteh_mio_trait_improved_light_gun_mounts: "改進輕型火砲裝配"
 CHI_Lungteh_mio_trait_improved_light_gun_mounts_desc: "精進炮座安裝工序與品管機制，在降低建造成本的同時全面提升防空與對海火力。"

