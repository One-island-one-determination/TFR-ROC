 CHI.BF.100.t: "CM13計畫"
 CHI.BF.100.d: "現今世界局勢之糜爛，於古來從未有現，美國正在經歷內戰，吾等中華民國剛經歷了一場史無前例的戰爭，在戰中，前線官兵不只一次對著上世紀年代老掉牙的坦克發火，雖說戰爭的結果是還算好的，但一時半刻的幸運不可能永久保障我們的國家，現在中科院正在考慮三個方案，\n\n一：\n拆解並分析戰爭中繳獲的解放軍戰車99式96式等，將其口徑與電控等裝置規格改動，使其成為我方的新世代戰車\n\n二：\n從澳大利亞等盟友購入美製主力戰車，同是拆解分析的方法，不過鑑於官兵們更於熟悉美製武器的操作與設計，此種方法無疑是最爲穩妥的選擇\n\n三：\n像日本申請戰車生產授權與設計圖紙，並稍作改進，10式作為日本為丘陵山地與小公路等地形研發的戰車對我們台灣本土山多平原少的情況也不失一個好選擇\n\n以上我們必須慎重考量成本與作戰能力，才能讓我們挺過下一場史無前例的戰爭"
 CHI.BF.100.a: "改造解放軍裝甲車輛"
 CHI.BF.100.b: "解析M1A2戰車"
 CHI.BF.100.c: "申請盟國坦克技術"

 CHI.H2.11.t: "選後之夜"
 CHI.H2.11.d: "今晚的高雄市格外熱鬧，街道上擠滿了慶賀韓國瑜當選的遊街隊伍，從一心路到十全路，紅白藍聚成的河流拱衛著總統，韓導站在發財車上向四周的熱情民眾一一謝票，感謝他們還願意再給他一次機會、感謝大家還願意信任他。\n\n謝票遊行持續到兩三點才結束，韓導拖著沉重的身軀爬回發財車的後座，連續三天從北到南的遊街拜票讓他疲憊不已，年近七旬的身體確實不如從前啦!外頭昏黃的路燈一閃一閃照過他的面龐，內心的苦惱只能向遠方的月亮傾訴，他心裡明白經過戰爭的洗禮，台灣和台灣人已經徹底改變了。\n\n往事如煙消散，現在的韓總仍是掌舵的船長，但他真的能帶領中華民國駛向所有人心中的夢想之地嗎?西方的赤色巨龍只是暫時消退，他們仍然有實力東山再起；遙遠東方的美國消息十分混亂，短時間內也沒有機會重返亞太。舞台已經清空、亂棋必須重下，舊秩序的瓦解意味著的新生，可中華民國準備好了嗎?不知下場表演會在甚麼時候拉開帷幕，他能為中華民國做些甚麼?能給台灣留下甚麼?\n\n車子在左營的一棟灰色大樓前停下，再給司機先生塞了幾張國父後便頭也不回地走向會客大廳，坐在辦公桌前的保全盯著老舊的電視呼呼大睡，裡頭播放正是韓總剛才遊街的新聞報導。外頭的喧囂絲毫沒有影響到這位保全的生活，韓國瑜沉默了。\n\n是啊，改變不是投完票以後就就完成了，造勢活動撲面而來的熱情被現實狠狠的搧了一巴掌，想要從根本上改善台灣的人困境，需要很長很長的時間......一團團思緒湧向大腦，韓總深深地打了個哈欠，得想辦法為中華民國做些甚麼才行，不過未來的時間很長，可以慢慢思考……"
 CHI.H2.11.a: "「韓冰~我回來了!今晚有宵夜嗎?」"

 CHI.H2.41.t: "忒彌斯之劍"
 CHI.H2.41.d: "李輝明坐在候審室的塑膠長椅上，座位的因為年久失修逐漸脫皮，做的不是很舒服，但至少比牢房裡的硬水泥地好不少。他嘗試挪動一下屁股，故作病態咳了好幾聲，嘴裡念念有詞著說些奇怪的話，門外的獄警只是看著他，一動不動----而且也不敢動，手裡握著精神鑑定診斷書的好處就在這裡，沒有任何人敢對你造次一聲，要是一不小心出了甚麼意外......外面虎視眈眈的媒體早就期待能砲轟這些高高在上的公務員了!\n\n庭審的時間到了，法警把他帶到被告席上，法官、法扶律師和檢察官早已就位，這種場面他看過很多次了，今天無非就是打打嘴砲、抗議一下、敲個槌子就又結束，還有時間回味一下他的「偉大功績」!\n\n「被告，43歲的李輝明先生。你涉嫌在公共場合持刀械威脅他人性命，罪刑惡劣且無悔過之意。謀殺罪、妨害公務罪等罪名成立，判處死刑、褫奪公權終身。」話音剛落，剛才押送他的法警扭著李輝明的衣領將之抓起。\n\n「我是無辜的啊!法、法官，我真的不是有意.....」後者慌忙地對著法官哀號，突如其來的死刑判決讓他猝不及防，他的視線飄向一旁的法扶律師，可後者只是拿出其餘被告的如雪花般的鑑定書，連同李輝明的一把扔在他的臉上......"
 CHI.H2.41.a: "當晚，土城看守所的所有保險絲都燒壞了"

 CHI.H2.61.t: "老友相聚"
 CHI.H2.61.d: "昏黃的陽光映襯著高雄市的輪廓，紅色與白色的河流相向而行，他們都生活在這塊土地上，卻各自有著不同的目標與方向，斷斷續續的紅綠燈有序地指引這些車子的動向，什麼時候該前進、什麼時候該停下。\n\n韓國瑜舉起茶杯啜飲一口，這是他最喜歡的三峽龍井，冒著蒸騰熱氣的茶湯消散在空中，映襯眼前兩位爭得面紅耳赤的大人物。\n\n「宋先生，我本人十分尊重您與國民黨對黨派團結的渴望，但您們要求的似乎有點太過份了…….」陳其邁緊緊握著手中的杯子，茶湯撒在手上，握的力度就像是恨不得把它捏碎似的，「就算是民進黨裡最溫和的派系都不可能同意，您這麼做讓我怎麼和其他黨員交代----」\n\n「陳其邁先生，」韓國瑜微微勾起嘴角，「民進黨依然是台灣的一份子，是『我們』的一份子，只是前幾年的的黨派鬥爭太嚴重了。看得我心好痛，好捨不得!」\n\n「韓導，我們都是為台灣未來著想的台灣孩子，不該如此針鋒相對才對。而且我們互相退一步，我也好對選民跟其他人交代」陳其邁抿起嘴唇，眼神緩緩瞥向韓總統的方向。他緩緩放下茶杯，舉起茶壺給自己重新倒滿一杯，試著別讓心裡的緊張暴露出來。總統會同意他的請求嗎?\n\n「嗯……」韓國瑜若有所思的點了點頭，「陳同學說的有道理。不如這樣吧:宋先生您協調一下，幫我們的高雄市多爭取一些中央預算如何?陳同學也幫我們跟基進黨一派的泛綠派系溝通一下，在高雄市議會質詢的時候稍微手下留情一些?」\n\n宋先生很不情願的點頭答應，陳其邁看出他似乎很不滿意這次的協調，但宋先生也沒辦法，畢竟要是在不同意，那麼他的勢力很有可能在未來被徹底邊緣化。在韓國瑜熱情的催促下雙方握手言和，特勤局特工護送兩人離開茶館。正當陳其邁準備開車離開時一名特工跑上前來，手上還提著兩袋禮品。\n\n「這是他給您家女兒的生日禮物，他還讓我給您帶話:『工作之餘也別忘記照顧家庭。』」陳其邁接過禮品，把袋子放在副駕座位上，轉動鑰匙。"
 CHI.H2.61.a: "他發動引擎，隻身沒入耀眼的白色河流之中。"

 CHI.H2.81.t: "自己人"
 CHI.H2.81.d: "在新北市的便利店裏， 張緻遠拿著一筐的速食食品，用日語對便利店的收銀員說到:”麻煩結賬，並給我一包最便宜的煙”.他是一位在日本工作的中國大陸公民，他的公司在臺海戰爭后，開始在台灣開拓業務，他因爲是唯一一個會説中文的被公司派到了台灣，他在抖音和微博，看見那些博主和自媒體都說，戰爭之後台灣人都恨不得把大陸人扒皮抽筋，過去了就會被人霸凌攻擊，還有許多視頻爲證，他對此極爲恐懼，可惜還是無法違逆公司的安排，只能把自己僞裝成一個日本人，他打算接下來就靠這些速食在酒店裏度過，他離開便利店，在街邊看見一些還沒有清理的，看見市政府門前大屏幕上播報的本市死者名單，看見有明顯修繕痕跡寺廟裡大片的戰爭死難者牌位，這都讓他兩股戰戰，在腦中不斷幻想自己是大陸人如果被發現了將會遭受什麼樣的迫害，他抱緊了裝有身份證和護照的公文包，生怕這些東西被人看見，又連忙把自己的華為手機放進公文包的最深處，生怕被人看見。\n\n他終於回到了酒店大堂，正準備回到房間，除了工作再也不出來，就當他放下想著東西，鬆了一口氣時，電梯間跑出來一個少年，他一頭撞上了張緻遠，突然之下，他沒能反應過來，被撞到在地，在他起身的一瞬間，他看見了讓他全身發寒的事情，他的包在撞擊中被打開了，身份證護照華為手機散落了一地，他覺得自己要完蛋了。\n\n就在這時，一隻手伸到了他的面前，是那個撞到他的少年，他下意識的抓住了少年的手，少年將張緻遠扶起來后，不斷道歉並轉身準備替他將東西撿起來，張緻遠連忙想阻止但少年已經拿起了他的護照，就在他覺得少年看見後肯定要態度發生180°大轉變時，少年只是默默的的替他把散落一地的東西收好，將公文包和速食交還給他，少年開口到：「真是對不起，希望你在台灣玩的開心，大家都是自家人」然後便離開了\n\n張緻遠呆呆的站在大廳，直到酒店工作人員來詢問他是否需要幫助，他才如夢初醒般的回過神來，回到房間他看著天花板，口中喃喃到："
 CHI.H2.81.a: "「大家都是自家人嗎……」"

 CHI.H2.82.t: "自家人"
 CHI.H2.82.d: "在臺北的街道上李木生彷徨的走著。他手裏拿著用馬來西亞文，英文，中文三種語言寫的紙條，他根本不知道這上面寫的是什麽地方，他隻身一人來到這裏，尋找自己最後一個親人，在台灣的表叔。他不會漢語，英語也很差，他不敢與人搭話，只能默默的用谷歌地圖的導航，但他在這附近繞了快十分鐘了仍然沒找到這個地方到底在哪，導航也沒有用。無奈之下，他只能鼓起勇氣，開始尋找看起來能幫助他的人，他看上了一位似乎慈祥而且很空閑的阿嫲，他靠上前去，他用生硬的語氣說出了自己會的唯一一句漢語：「你好」，在阿嫲回答之後，不斷指著那張紙，用英語説到：「I go here」，老人家看他緊張的樣子，臉上笑道：原來是海外同胞，接過紙一看，連連招手：「跟我來吧」，李木生連忙跟上，一路上老人家一直在用他聽不懂的語言在說著什麽，但是李木生感覺到了一股溫暖友善的氛圍，是他在馬來西亞人身上沒有感受過的感覺，老人家帶他來到一個小巷中，敲開了104室的窗戶，裏面探出來一個年輕女孩的腦袋，老人家笑著對女孩説道：「阿良，這應該是海外來的同胞，我看他拿著的紙條是寫的這裏502室的李先生，我看他不會說國語，麻煩你這個大學生帶她上去吧」女孩從房間裏出來，用英語與李木生溝通了一會，阿嫲看事情已經走上正軌了，便打算離開，李木生連忙對老人家道謝。女孩帶他來到了502室，敲了幾下房門，房門打開，裏面是一位和李木生有七分相似的中年人，女孩與中年人交流了幾句，中年人轉向李木生，用馬來西亞語說到：「先進來吧」"
 CHI.H2.82.a: "團結海外華人"

 CHI.H2.101.t: "以政府之名"
 CHI.H2.101.d: "夕陽的餘暉指引著疲憊的上班族回家的路，此起彼落的叫賣聲越過馬路飛進一條不起眼的巷弄內，一輛銀灰色廂型車默默的靠在路肩，坐在後座的侯組長食指貼著嘴唇想來一口煙，但想到自己等等要執行的任務，左手便默默把煙盒放回口袋。 「開始行動！」無線電傳出的命令簡潔有力，侯組長使了個眼神，眾人下車後有條不紊地走向嫌疑人的家門口，其中一人提前把的搜查令拿在手上，另一人直接拿出萬能鑰匙準備撬鎖，這不太符合規矩，不過……非常時期非常手段。 「別動！ 特別偵查組！」組長帶著手下魚貫而入，「陳委員，我們奉命調查您的住宅，還請配合本組業務以免造成不必要的困擾。」陳茵微立委端著飯碗滿臉錯愕的看著眼前的黑衣人們，在她說話之前那些人便迅速散開搜查她的住宅。 「侯闇曲，你這是什麼意思？！你們隨意搜查立委的房子是什麼意思！我告訴你，我跟你們的高署長可是老朋友！」立委看著桌上的搜查令對著特偵組大聲怒吼，但侯組長只是拉來一張椅子，隔著熱湯蒸騰的水氣，緩緩坐在陳立委對面。 「小蕭！有找到什麼嗎？」 「有的組長！」小蕭小跑步來到組長身邊，拿出手機遞給侯闇曲，後者接過手機一看嘴角差點沒失守，對桌立委的臉色沉了下來。 「那、那個冰箱不是我的…！是誰把那些錢放進這個冰箱的我完全不———」話音剛落，兩名特偵組幹員把陳茵微委員架離房間，一把塞進廂型車後座，口袋裡的ESTA影印件在街外的煙火氣中緩緩飄落，被路過的機車烙印在滾燙柏油路上。"
 CHI.H2.101.a: "侯局長拿著打火機，面朝外面市場點了根煙。"

 CHI.H2.121.t: "第二碗滷肉飯"
 CHI.H2.121.d: "國民黨某次黨內會議，時任黨主席的韓國瑜上臺，對黨內發表演講，說道：「我不要求滿漢全席，但一定要有一碗滷肉飯。」這是我在選舉高雄市長時無奈的呐喊，當時臺南被黨内視為低回報地區，認為在當地民進黨不可戰勝，認爲這些綠營堡壘堅不可摧，不願意投入競選資源。但我在2018年的勝利打破了這個看法，只要有良好的舉措，願意去和民眾交流，願意放下身段解決民眾的難題，民衆必定能看見選舉人的努力。現在我在提出了未來不在以地區劃分選舉資源的提案，希望在將來：只要有成績，就有資源，不再將資源全部聚焦在北部，要往南部發展，要支持南部黨員的選舉，不要害怕其他黨派看似堅不可摧的堡壘，不要因為害怕失敗所以畏畏縮縮，我自己就證明了這些堡壘并非堅不可摧，南部的黨員有許多有想法、有熱情、有幹勁、有希望的人，卻困於無資源可用，不僅要落敗與其他黨，還因為做不出成績，潛力無法釋放，以至於明珠蒙塵。這對於黨和國家都不是一件好事。所以未來絕對不可以地域劃分競選資源，而是要以成績劃分，讓能者上庸者下，不要在死抱著安全保守的想法，最起碼所有競選者，都起碼要有一碗滷肉飯，一瓶礦泉」\n\n台下爆發出熱烈的掌聲，特別是年輕黨員發出的聲音更大"
 CHI.H2.121.a: "人人有飯吃"

 CHI.H2.141.t: "房間的大象"
 CHI.H2.141.d: "台北市，時代的刀刃在這座古老的首都留下太多傷疤，重建城市的工程隊點的燈照亮整座城市、熙熙攘攘的鬧市供市民在下班後一個好去處，今晚的凱達格蘭大道如此寧靜，角落的路邊攤卻又展現出鮮活的生命力。韓國瑜看著眼前的一切，現在全台人民的人生就擔在他的肩上，台灣人的幸福與成就不可能一蹴而就。韓國瑜搭上專車，他還有很多事情要做。\n\n在一處連建築圖紙上都找不到的地下會議室，總統和他的幕僚們圍著一張大鐵桌坐著，投影幕反射的光源映照出每一副面色凝重的面具，他們自認為了解這些深根於表象之下痼疾，但沒想到這些問題比他們預想的還要複雜。\n\n「那請問，我們該怎麼做呢?」台下的其中一位幕僚發話，「政府貪汙問題人盡皆知、台灣的生育率也長期保持在最低水準，政治惡鬥更是一個完全無解的問題!我們知道問題在哪有任何意義嗎?」\n\n「確實如高教授所言，這些議題在過去的選舉中被反覆用來攻擊執政者，然後呢?自己選上總統後就裝傻!用自己手底下的媒體沖淡民眾對這些問題的印象，然後等下次選舉再被對手拿來攻擊自己。」韓總點頭應和，選民幾乎不在意哪些政治人物真的能解決問題；就算在意，他們的聲量也只會被在野黨利用來攻擊執政者，社會議題成了公民觀賞廝殺娛樂的鬥獸場，觀眾席上的選民為自己的支持者不停的搖旗吶喊，直至其中一方倒下。\n\n整座體制四年如一日的空轉，人們在談判桌前自己的利益與權力爭得面紅耳赤，卻對會議室裡的大象視而不見，政客們不願----也不能戳破這層幻象，但要是總統真的想讓台灣煥然一新，就必須當第一個撕破皇帝新衣的小男孩!\n\n「各位部長…」韓總以冷漠的聲音說道，「我的桌上只允許出現應對方案與各位的辭職信，不接受任何形式的理由與拖延，解散。」\n\n待最後一名幕僚離去，韓國瑜才收好公事包離開建築，即便惡疾深入骨髓，今晚的台北仍是如此耀眼。"
 CHI.H2.141.a: "棘手的問題、棘手的手段"

 CHI.H2.151.t: "黑金風暴"
 CHI.H2.151.d: "周貴發對著前排後照鏡整了下領帶，這算是他平生少數幾次需要穿西裝出門談生意的時刻，在他接到茶會通知時才慌忙在家裡到處翻找，最後不得已只能拿結婚時買的那套西裝來頂一下。建築工程行業近幾年都不好做，台灣地狹人稠，城市開發跟基礎建設基本完備，如果搶不下重劃區跟公共建設的標案就只能看看還有沒有甚麼殘羹剩飯能拿，要是再拿不到……那就只有破產這一條路能走了。\n\n為了拿到政府的訂單剩下的建築商可以說是卯足的全力，送花、送鳥、捐贈政治獻金等等，在需求緊縮跟缺乏競爭的背景下想要活下去就只能乖乖地上繳過路費。周董下車走上茶樓，大家都在包廂裡等他，與會者都是台灣前幾名厲害的營建商，戰爭過後百廢待興，人人都在爭搶桃園機場跟左營軍港翻修的大訂單，高速公路與電力基建也是塊肥肉。坐在角落的林大哥就是搞光電板的，打點好關係後趁著非核家園計畫拿下多筆「種電」方案跟綠能補助，廢棄農田全部改建成太陽能發電廠，政府帳上有漂亮的數字、林總靠著綠能轉型發大財、專員荷包賺滿滿，大家都有美好的未來。\n\n茶會上大家都在討論如何分贓下一款大型工程，周貴發不發一語，他算是整場會中規模最小，也是賄賂最少的營建商。他原以為只要工程做得夠好就能打破這種惡性循環，可他又違背不了自己當年做工程的良心，每一分錢都必須花在建設上。正當眾人相談甚歡之際一群黑衣人闖入包廂，後者集體圍在他們身後。\n\n「我是侯組長，還請各位稍安勿躁，盡請配合我方的調查工作，若是有任何疑問或是不滿的地方，你們有權利打給你們的律師----不過我勸你們別做無用掙扎」侯闇曲朝部下使了個眼色，一一拿出手銬準備控制在場的嫌疑人。\n\n「好啊，沒問題。」林大哥十分配合的舉起雙手，滿臉從容地起身，絲毫不在意自己身後的那名特別偵查組幹員，其他幹員也依次將每個嫌疑人上銬帶走，他們有的像林哥一樣從容，但大部分都十分慌張地跟解釋自己是無辜的，周貴發以為自己也會被帶走，可侯組長在收網後頭就也不回地離開包廂，留下滿臉錯愕的周董。\n\n幾天之後到了競標日，當時在茶會上見到的幾位大老跟公司代表全都不見蹤影，手機上也播放著黑社會跟官商勾結被大力清剿的新聞，周董關掉手機，試著不去回想那天的可怕經歷……"
 CHI.H2.151.a: "常在河邊走，哪有不溼鞋"

 CHI.H2.181.t: "台灣的巴別塔"
 CHI.H2.181.d: "大戰之後的台北雖未恢復往日繁華，但其底蘊深厚，故市內八方通衢之處仍得見昔日繁華蹤影。往來人潮熙熙攘攘，行色匆匆忙忙，車水馬龍中只看出又一場大仗要打的跡象。\n\n蔡英文身著黑色正裝，攜著賴清德穿過壓抑的空氣，跟著在晶華飯店等候多時的導引員一直走到最深處。蔡英文並不清楚韓國瑜打得什麼算盤，但如此大戰過後，如日中天的他竟發來邀請面議政務，也著實給足了她和民進黨面子。\n\n路沒有多遠，深思熟慮也遠不如面見耳聞來得實在。蔡英文落在韓國瑜對面的座位，賴清德後一步跟著她坐在旁邊。韓國瑜滿面春光，他的一旁是蔣萬安，蔣中正的後代，台灣政壇上的一顆新星。\n\n鴻門宴…還是…？\n\n杯影交錯互道問候之後是又一陣沉默。蔡英文眉宇微動，正欲發問，未想韓國瑜先一步打破沉默：\n\n「蔡總統不必多慮，國瑜此番邀約並非攻訐伐異抑或密謀分肥，只是有感危局之後時勢糜爛，特此誠邀蔡總統賜教政事。」\n\n一旁的蔣萬安點頭附和，賴清德面生疑惑，但並未發聲質疑，只是轉過頭看了看蔡英文。蔡英文神色有所舒緩，思慮一陣，接著韓國瑜的話開口：\n\n「韓總統過謙了，若無韓總統，台灣又從何取勝？只是不知韓總統戰後大政方略，英文深望韓總統暢曉大義，萬民所仰，國家所系，切莫重蹈覆轍……」\n\n韓國瑜聽出來這話意思：她害怕自己變成下一個蔣中正。韓國瑜敲了敲桌子，神色坦然，緩緩開口：\n\n「蔡總統放心，國瑜藉史明政，前事不忘後事之師，若要台灣政清人和，必不能阻塞民視民聽，這也是國瑜之所以為政的根本所在。」\n\n韓國瑜語氣誠懇，態度恭讓，又跟蔡英文闡述了一番他理想中的政治願景，這讓蔡英文松下一口氣，凝重的臉色露出一絲疲憊的笑容。\n\n蔡英文又望了望一旁的賴清德和蔣萬安，不曾想這兩位被彼此黨內視為有力後生的政治名人竟然聊得痛快。此時韓國瑜舉杯邀眾人對飲，蔡英文也不再戒備，與韓國瑜等人舉杯共歡。"
 CHI.H2.181.a: "合作愉快！"

 CHI.H2.221.t: "反攻橋頭堡"
 CHI.H2.221.d: "「隨著台海戰役的結束，我國趁著中華人民共和國撤離西沙與南沙群島時成功派遣部隊光復這些地區，部分相關領域專家對此表示擔憂，表明這可能會觸怒中國迎來殘酷的報復，現在本台即將訪問韓總統對此的看法。」\n\n「我覺得這沒什麼嘛，我們都打贏過一次了，如果能順利開發上面的資源，我們就可以用來讓國家發大財，發大財就能研發更好的裝備，我們幹嘛要怕中國報復？」韓國瑜抬起右臂，做出加油的動作鼓舞大眾。\n\n「大家要更有自信一點，只要你們依然信任著我，我就不會讓你們吃虧！」\n\n全場掌聲四起，並不是每個人都接受他的話語，但韓國瑜的語言裡確實帶著某種吸引人的魔力。\n\n「嗶——」\n\n遙控器的按鈕被按下，電視上的新聞播報被立刻切斷。\n\n「真是精彩的回應，總統先生。」\n\n年輕的幕僚盯著黑色的螢幕，慢慢轉頭看向韓國瑜。\n\n「對吧？我想肯定能鼓舞人心。」\n\n幕僚移開視線，猶豫的一會開口詢問。\n\n「總統先生，您確定要這麼做嗎？我們趁機佔領外島已經遭受北京政府的公開譴責了，要是再為海南省復省絕對會被視為嚴重挑釁，那樣......」\n\n還沒說完，韓國瑜打斷了這位年輕小子的話語。\n\n「為什麼不這麼做？我就是希望對岸明白，中華民國不會一直都待在這座島上，如果你發現自己能變強震懾霸凌者，你不會一直這麼躲在角落裡吧？我可不希望我的人民一直被欺負。」\n\n韓國瑜站起身來，走向辦公室的門口，他伸手轉動門上的喇叭鎖。\n\n「而且我也要向大陸居民傳達訊息『台灣人沒有忘記自己的同胞』，就這樣。」\n\n韓國瑜走出門口，趕往下個需要他的地方。\n\n確認韓國瑜走遠後，幕僚長嘆了一口氣。"
 CHI.H2.221.a: "現在該決定新的身分證要用什麼字母了"

 CHI.H2.222.t: "光復的第一步"
 CHI.H2.222.d: "永興島，曾經的「三沙市人民政府」的石碑前，兩位工人正操作巨大的角磨機將上面的字抹去。人民政府的牌匾也被吊車取下，準備挂上「海南省政府」的牌匾。在永興島被中華民國國軍光復后，中華民國政府簽署總統令，重建在民過92年停運的中華民國海南省，政府部門便準備將原「三沙市人民政府」其改造為重新設立的海南省政府。而距離1.5公里的原西沙區人民政府將被改爲三沙市政府。從台灣來的工作人員正在統計留在西沙，中沙，南沙群島的居民，並詢問他們想獲取中華民國身份還是回到大陸。在民國92年總統令將其停運后，中華民國海南省的標志再一次在南海亮相，東沙島與太平島也再一次歸屬海南省政府管理。\n\n李舜的爺爺是一位海南省老兵，他無數次聼爺爺説起海南省大撤退，提起家鄉的椰子樹，甘蔗和留在海南最後失去音訊的親戚。聽聞海南省重設，他買了一張船票，帶上爺爺最喜歡的椰子糖，爺爺一直說這有著家鄉的味道。他來到了永興島的海邊，對著海南島的方向，對著那雖然看不見，但是他能感覺到那就是爺爺魂牽夢繞的地方，他將椰子糖丟進海里，大喊到："
 CHI.H2.222.a: "「爺爺，我們馬上就要回家了！」"

 CHI.H2.251.t: "歷史的輪迴"
 CHI.H2.251.d: "胡元輝雙手交握撐在實木辦公桌上，眼神在桌面和這位不速之客間來回遊移，他吞了口口水，試圖緩解乾澀不已的喉嚨。來者掛著那副標誌性的微笑坐在他面前，這張臉他早在電視機上看過無數次，與當年在菜市場掃街拜票的親民形象別無二致，毫無破綻。\n\n「我想我和我的董事們已經表達得很清楚了，總統先生。媒體自由絕不允許受到干涉!三十年前前輩們好不容易才讓台灣媒體擺脫黨政軍的控制，台灣人也對此欣然接受。您這是明擺著與民眾為敵!」胡元輝對著貴客大聲怒吼道，試圖以這種方式來掩飾自己內心的不安。他心裡清楚，自己和公視已經快要沒有迴旋的餘地了……\n\n「胡先生，」韓國瑜用那親民的嗓音說到，「與大家作對的，難道不是您嗎?表面上標榜中立，實際上卻聽命於執政者，希望能夠從中獲得更多預算。也就是說，公視自始至終都只對政府負責，而不是真正為民眾著想!」\n\n「那也比像這樣親自干涉公視運作還……」胡元輝的已經瀕臨崩潰，好幾個月以來的內部審計與新聞內容調查早就讓他身心俱疲，各種改組方案在辦公桌上疊成一座小山，強硬回擊帶來的卻是更加嚴苛的條款限制。他咬牙切齒地起身，感覺自己就像站在懸崖邊上，他伸出手，難道這就是唯一的退路嗎?\n\n「合作愉快，您終於有時間去陪陪您的家人了，不像我每天都得被政務追著跑」韓總握著胡元輝手笑著說道，「我的助手等等就會拿同意書進來，還請您盡快在上面簽字，麻煩您了!」\n\n韓國瑜帶著微笑走出辦公室，胡元輝卻彷彿是被抽乾了靈魂般無力地躺在皮製座椅上，他看著牆邊擺滿的各類證書，頓然感受到有無數雙眼睛審視著他的所作所為。"
 CHI.H2.251.a: "「胡先生，請簽名吧。」"

 CHI.H2.261.t: "採訪"
 CHI.H2.261.d: "「所以您擔任總統一職到現在，目前有甚麼樣的感想嗎?還是說對未來有什麼樣的期望?」朱可欣身體微微向前傾，一手上拿著本印著公視logo的筆記本、另一手拿著一支原子筆準備記下總統的回覆。她看著那頁寫滿各類提問與註記的那一頁，這些都是部門同事苦思冥想一整夜才勉強擠出來的成果，最開始上交時總共有整整四十個大小問題，最後層層上報，總統府只願意針對其中七個做出答覆。\n\n「喔這樣啊…..我覺得當總統還蠻開心，與當年做高雄市長來比的話，肯定是服務全國人比只服務高雄還要更有成就感啦!至於未來的展望，我們先前已經承受過太多的苦難，我的願望很單純，就是讓大家都能在菜市場買到便宜的蔬菜!」韓國瑜的爽朗笑聲感染了在場的其他人，朱可欣一時也沒守住嘴角，不小心笑出了聲。是啊，這個人就是這麼親民、有魅力，如果你是一個常看電視的人的話，肯定也會這麼覺得。\n\n「總統您還真是親民呢…..」朱記者調整好狀態，她看向坐在桌對面的採訪者，眼睛不小心掠過後者身後的攝影機，紅色的小點不停閃爍，隨時提醒著鏡頭前的兩人:這是一場表演，不是採訪。朱可欣吞了口口水，內心的職業良知在鏡頭下顯得如此蒼白，她趕緊裝作紀錄筆記的樣子奮筆疾書，同時若有所思地點點頭。\n\n朱記者默默闔上筆記本，編導向她使了個眼色，紅色的光點熄滅。現在是中場休息時間，有些工作人員都想趁著個機會親眼見識一下韓導的威風，三步併兩步跑到攝影棚，只有朱記者默默走向應急樓梯口，把那本筆記本扔下樓梯井。"
 CHI.H2.261.a: "最後頭也不回地離開了公視大廈"

 CHI.H2.301.t: "亂！停！"
 CHI.H2.301.d: "又是一個議會討論日，在各個黨派的各位議員召開的緊張又刺激的未來預算討論會上，民進黨的一位老議員，在落入下風后，眼見國民黨提出的預算案馬上就要通過，他做出了一個幾乎本能的動作，他脫下自己的皮鞋，往主席臺上丟去。皮鞋砸到主席臺上發出「啪」的聲音，一瞬間，整座議事廳鴉雀無聲，所有人都盯著老議員看，他馬上反應過來，臉色蒼白，兩股戰戰，口中不斷解釋道: 「不不不，那是皮鞋自己飛出去的，我不是故意的. 」\n\n主席盯著他看了幾秒，開口道: 「立院警察，控制住這位議員。」兩位立院警察立刻上前抓住老議員的胳膊，將他按在座位上，隨後主席開口到：「根據新制定的新《中華民國立院職權行使法》在議事廳進行打架，舉旗，送禮，行為藝術等擾亂秩序，咆哮公堂的議員，將被立即驅逐出議事廳，停權一天，並無視議程當場提案表決投票是否暫停其議員職能兩個月。」\n\n在不斷的按鍵聲中，結果出來了「全票通過，現在請立委警察將李議員帶出國會」啪，法槌重重的落下，老議員低著頭，被兩位立院警察夾著趕出了國會。\n\n在老議員離開后，主席開口到: 「我相信你們也記得之前的國會是什麽樣，比起政府議會更像行爲藝術展示廳和WWE會場，但是!現在新《中華民國立院職權行使法》已經通過了，希望各位能有一位政治人物，一位體面人的自覺，現在預算討論會繼續。各位請保持理性和自覺，進行討論。」"
 CHI.H2.301.a: "民眾沒有WWE台北分會場看了"

 CHI.H2.391.t: "新課本，新時代"
 CHI.H2.391.d: "令人難受的溼熱空氣充斥著教室裡的每一個角落，同學們規規矩矩地坐在自己的位置上，有的抬頭聽講、有的低頭奮筆疾書，生怕錯過下一個期中考考點。大部分同學忍受著這種窒息的氛圍，少部分像蔡芬琪那樣的學生則選擇躲在最後排偷偷聊天，偶爾抬抬頭假裝自己有在認真聽課。\n\n「欸欸，芬琪。你有學姊的歷史考前筆記嗎?借我抄一下。」一位同學用手肘輕輕頂了下蔡芬琪的側腹，後者不耐煩的從書包裡拿出那份書皮皺巴巴的筆記本，在發黃的內頁上翻來覆去，翻到這次期中考的重點後偷偷傳給她。\n\n雖然課綱每十年就會改一次，教科書的內容也時不時就有很大的變化，但她們的學校都只用自編的教材，從國英數到物理化學、公民地理等等皆是如此，歷史科當然也不例外，雖然教育局一直在勸導使用公版教科書，但像她們這種的頂尖高中從來就沒理會過這種勸導，依然只用自編教材上課。所以就算不上課，蔡芬琪她們也能靠學姊的筆記輕鬆過關。\n\n「各位同學請注意一下。」老師突然停下手中的粉筆說到，「鑒於教育部目前發布的課綱要求與指示，期中考的長短篇閱讀、史料判別跟簡答題的比例將大幅增加，同時民國史和四九年後的近代史也是重要考點，所以大家複習的時候一定要多加注意。」\n\n蔡芬琪驚到的下巴都快掉到地板上了，她完全沒想到老師會這麼不按牌理出牌。下課後她才從家裏翻出一開學就被她丟到床底的歷史課本，一邊翻閱課本一邊熬夜在自編教材上做各種筆記。"
 CHI.H2.391.a: "「這些將軍的名字都會考嗎...?」"

 CHI.H2.431.t: "寧可錯殺，不可錯放"
 CHI.H2.431.d: "蘇幹員夾著一根香菸，靠近嘴邊緩緩吸了一口，吐出的裊裊細煙在白熾燈泡下顯得尤為明顯。他的眼神穿透煙霧觀察著一切，一位年輕的幹員正在審問面前的囚犯，後者大聲嘶吼著要找他的律師，換來的卻是一陣陣毒打。\n\n由他親自牽頭的國安局小組與執法部門密切配合，第一時間有任何消息都會送到他們手裡，任何具有嫌疑的嫌疑人都會被他們拘提到案，會由國安局幹員親自審問；至於那些具有重大嫌疑的共產黨同路人，國安局會提供專門的服務等著這些雜種上門。\n\n「說!你的同夥在哪裡?把他們的名字供出來，我可以讓你稍微舒服一點。」話音剛落這名幹員又朝著囚犯的腹部來了一拳，橙色的囚服到處沾滿了咖啡色的嘔吐物。\n\n蘇幹員從桌上那出一片吐司放進嘴裡，前些日子他們「好聲好氣」地給囚犯餵了些白麵包和水，加上連續三天的嚴刑拷打，要是這樣還沒有成果....就得考慮備用方案了。\n\n「我、我說......!拜託別再打了，我什麼都願意說，拜託你們.....」\n\n「放開他。」蘇幹員扔下香菸、踩滅菸頭，從口袋拿出早就準備好的紙筆放在他面前。\n\n「我要你寫下你的金主、同夥跟所有據點的位置，順便在背面寫下自白書。要是你敢跟我們耍小聰明......」蘇幹員朝手下使了個眼色，後者從桌上檔案夾裡抽出三張黑白的大頭照。"
 CHI.H2.431.a: "看看你的妻女，這就是背叛國家的代價。"

 CHI.H2.411.t: "學生的一天"
 CHI.H2.411.d: "雷丹是新北市的一所國際高中的學生。在一個稀鬆平常的新的週一，他剛剛從捷運站拿著早餐到了校門口，發現同學們全部圍在大門前拍照，他擠進去便看見，學校的名字下面多出了一行英文名，在進門之後也發現所有的標牌和路牌都變成了中英雙語，連飲水機上面的文字都被刻上了雙語.雷丹剛剛來到自己的座位放下書包，旁邊的章樹人便向他搭話道: 「學校裏面所有東西都變成雙語了的，上個月韓總統不是才公開講話說要推廣雙語教育嗎?學校的反應可真快啊. 」雷丹回答到: 「對啊，不知道還有沒有別的改變。」他斜眼一看，班上那個在B站和油管發影片，外號Vlog哥的同學正在四處拍攝新的雙語設備，就在這時，班主任提早來到了班級中：「來兩個壯丁，去拿一下新的課本。」雷丹和章樹人對視一眼，兩個人搶先起身跟著老師走了出去，十分鐘後，兩人一人推著一輛板車回到了教室，將課本放在講台上後，雷丹大喊道：「你們想知道新課本有什麼特別的地方嗎？」教室的大家都看著他。他才說到：「我們在回來的路上看了，所有科目的書都變成中英雙語的了。」教室裡面響起一陣討論聲音。\n\n在這時老師推門進來，兩人連忙從講台下去，出門去把板車還回去，老師開口倒：大家按學號上來領新課本。領到書的學生翻開新書一看，不管是國文，數學還是生物，物理，化學，美術的課本上除了文言文之類實在是難以翻譯的內容都變成了中英雙語，英文課本更是變成了純英文。老師拍了拍手：「好了，大家先把課本放下。我來介紹一位新老師。亞力克老師，請進來吧。」門口走進來了一位白人男性，他用有明顯澳大利亞口音的中文開口到：「大家好，我是來自澳大利亞的亞力克-蘇，將在接下來擔任大家的英文老師。」學生們紛紛鼓起掌來，歡迎新的外教老師。\n\n班主任老師拍了拍手對大家說到：「好了好了，新外教老師會在下午的英文課正式給你們上課，接下來我說點別的，你們也快放暑假了，現在新政策有教育部組建的英文夏令營想要參加的今天回去和家長商量商量，明天放學來辦公室報名。還有，你們也是高二學生了，明年就高三了，現在新政策去英文國家留學補助扶持，我接下來發一下去留學補助宣傳單，帶回去給你們家長看看。」\n\n中午，營養午餐到了教室裡，學生們一團一團的聚集在一起，一邊吃飯一遍討論著今天上午的新變化，章樹人拿著手機說到：「看教育局的計劃，未來幾年英文課要實現全英文教學呢，幸好我們上學上的早。」雷丹回到：「是啊，估計班上英文不好的那幾個人現在已經焦頭爛額了吧。」他趁機往教室另一頭看了一下，VLOG哥他正在用帶來的佳能攝像頭拍攝新的課本，估計又要發到B站獲取10w播放了"
 CHI.H2.411.a: "「學貫中西」"

 CHI.H2.161.t: "再無合法賄賂"
 CHI.H2.161.d: "鳥岸污水處理廠是一家在臺南市本地深耕多年的本地企業，他們曾經多次被舉報排污未達到國家標準。但每次環境調查的結果都是純屬無稽之談，鳥岸處理之後的污水都是符合國家排放標準的。\n\n臺南的一間私人會所中，鳥岸污水處理廠的廠長和最大股東兩個人，正滿臉諂媚的笑容，向本地副市長敬酒，廠長説到：「上次的舉報實在是多謝您和環保局局長兩位的努力了，環保局和化學物質管理署來調查成功通過了，我們都是良心商人，正需要您剛正不阿的官員來保障我們的安全。」副市長舉起酒杯説到：那當然，本地正需要你們這樣的優秀企業，來讓市民過上更好的生活，希望明年選舉季之後我們也能合作愉快。」大股東連忙接到：「那當然，我們的一點心意，已經交給您的秘書了，全部是合法渠道，希望對您的競選有幫助，我們明年也要多多合作。」三人相視一笑，推杯換盞好不熱鬧。\n\n「啪」突然包廂的門被人一脚踢開「哎呀，挺熱鬧嘛，我能不能也能參加參加。」副市長站起身來大聲駡道：「靠你娘，你知道這是什麽地方，你知道我是誰嗎。你就這麽闖進來，會所的保安呢?快把這個瘋子趕走！」來人呵呵一笑，掏出來一張證件：「特別偵查組！我是特別偵查組的侯闇曲組長! 」\n\n侯組長環視包廂，露出了一個令三人不寒而慄的笑容「哎呀，沒想到您這麽有官威啊，我還以爲我現在在大陸呢!真是失敬了。不過您還是在臺南，所以，請和我去特偵組坐坐吧，關於您收取不正當政治獻金。幫助違法企業隱瞞違規行爲的事情，我們想聽聽您的辯解，這兩位是鳥岸處理廠的人吧，正好省的我再跑一趟了，來人，帶走他們三個. 」\n\n侯組長身後立馬冲出來六個膀大腰圓的特別偵查組成員，抓住三人，並把們三人往包廂外面帶走，三人此時已經連自己站穩都無法做到，完全靠特別偵查組成員的力量才能站住，面如死灰的被帶出會所。\n\n侯組長拿起桌上的酒，稍微端詳了一下: 「哎喲，還挺齊全，大陸的茅臺、法國的高級紅酒、日本的高級清酒、英國的高級威士忌，這桌光是酒就有我半年工資了。 」\n\n他放下酒，往包廂外走去，心想："
 CHI.H2.161.a: "「這周都抓了六個了，不知道明天能不能再來一個，凑齊一天一個」"

 CHI.H2.231.t: "宣稱正統"
 CHI.H2.231.d: "隨著局勢的發展，曾經遙不可及，被嘲笑為癡心妄想的反攻大陸，光復民國的曙光似乎已經出現在遙遠的地平綫上，台灣，福建，海南三省現已重新開始運行，因此中華民國政府已決定提出廢除《憲法第四次增修》中的臺灣省政府功能業務與組織調整部分並提交議會審核，在審核通過後重建全國省政府與西藏地方政府。蒙古地方政府則暫時擱置。\n\n我國内政部與外交部發言人在聯合記者會上，兩部門發言人共同宣佈了停止省政府的省虛級化、去任務化，省政府將回復運行，開始重新規劃省、縣、鄉（鎮、區）、村（里）、鄰等各級地方官員的選舉與任命機制，各省份百姓戶籍管理制度並開始搭建各省份政府框架，在需要時可以迅速擴充，快速進入運行狀態。以面對未來可能出現的需要。\n\n並且，在本次聯合記者會上，外交部發言人重新提出蔣介石時期的我國為中國唯一合法政權的説法，宣稱由國父孫文先生建立的中華民國為中國唯一正統合法政府，對大陸北平政府僅承認治權，不承認任何法權\n\n陸國臺辦與外交部對此氣急敗壞，不斷在記者會和各種場合宣佈這是侵犯中國唯一合法政府的合法權利。在被我國擊退后，一直待在軍營中的解放軍開始回復對台灣的試探，再次越過海峽中綫侵犯台灣領空臨海。甚至在聯合國大會提出對我方的制裁但無人理會。\n\n在議會審核通過后，政府開始進行各地省政府的重建，政府在恢復運作后的台灣省政府大樓中，劃分出一層安置各地省政府的框架人員，各地省政府將先負責從各自所屬的省份遷移來台的老榮民的關照與跨越海峽前來自由地區的大陸災胞的安置工作並收集各省信息提前做出接管預案。\n\n各地省政府正式開始重新運行那一天，舉辦了一個低調的儀式，韓總統出席了該儀式，他在儀式上說道：「這次呢，不算一個正式的儀式，我們自己隨便搞搞就好，等你們回到各自負責的省份，我們要舉辦一個盛大的慶祝典禮」"
 CHI.H2.231.a: "我們才是真正的中國人"

 CHI.H2.371.t: "中華民國經濟部地質調查及礦業管理中心    函"
 CHI.H2.371.d: "                                                        地址：100005臺北市中正區中華路一段53號\n                                                                                                          承辦人：徐銘宏\n                                                                              電話：(02)23113001    分機001\n                                                                                                 傳真：(02)23112663\n                                                                   電子郵箱：bom001＠gsmma.gov.tw\n\n受文者：韓國瑜總統\n\n發文日期：中華民國1XX年X月X日\n發文字號：經地調字第114514號\n速別：最速件\n密等及解密條件或保密期限：極機密（本件於200年12月31日解密）\n附件：\n\n主旨：陳「全國地質資源調查計畫」第一階段成果，並就我國內可開採戰略\n            礦產及油氣資源以及其潛力提出評估，呈請總統鑒核。\n\n說明：\n\n    一、為因應全球供應鏈重組、地緣政治風險升高及國家安全需求，本部依\n            行政院核定之「全國地質資源調查計畫」，運用高解析度衛星遙測、\n            航空磁力探測、重力測量、三維地震探勘、人工智慧地質建模及深層\n            鑽探等技術，完成臺灣本島及周邊海域第一階段資源普查。\n\n    二、本次調查成果顯示，過去受限於探勘技術及經濟效益評估，部分具有\n            開發潛力之礦體未能完整確認。經重新建模分析後，已掌握數處具戰\n            略價值之礦產與能源蘊藏區。\n\n    三、桃園地區確認存在較既有資料更完整之鐵礦礦體，其規模足以列入國\n            家戰略礦產儲備名單；苗栗地區沈積構造亦發現新增油氣蘊藏潛力，\n            可作為未來能源自主政策之重要基礎。\n\n    四、南海相關海域之地震測勘成果顯示，多處海底盆地具有良好油氣聚集\n            條件，推估可採儲量高於歷年估算值。建議加速後續試鑽、海域調查\n            及相關基礎設施規劃，以維護我國能源安全及海洋權益。\n\n    五、本次成果已完成建檔，並同步納入國家戰略資源資料庫。建議由國家\n            安全會議統籌相關部會，建立平戰轉換機制，確保於緊急狀況下得迅\n            速展開資源開發與生產。\n\n呈請   總統   鑒核。\n\n經濟部   敬呈"
 CHI.H2.371.a: "「不錯，歸檔吧。」"

 CHI.H2.331.t: "能者多勞，能者多賺"
 CHI.H2.331.d: "現行以固定薪級為主的薪資制度，時常被攻擊為「威權時代遺留」，我們承認年資決定待遇，18%優惠存款制度等軍公教待遇，僵化又過時，但仍然是依法任用時約定的一部分.在「不是軍公教太高，而是民間太低」和「世代公平」的思潮下，前任蔡總統時期，就進行過降低退休所得替代率。18%優惠存款逐步歸零等改革.但韓總統認為軍公教待遇是依法任用時約定的一部分，這樣隨意更改不僅破壞既有承諾、損害退休權益也使得民主化時的各階層之間的信任蕩然無存。\n\n但因為民間與軍公教待遇失衡是真實存在的問題，而且前任民進黨政府替現任政府做了得罪人的事情，現任政府正好只要在改革後的基礎上進行修改.經過研究，韓總統決定實行自己在參選總統期間提出的人事制度改革提案之一「軍公教浮動式報酬」，在現有的固定本薪保證軍公教群體生活的基礎上，加入將部分收入改為浮動。根據：工作績效，民眾滿意度，工作難度，工作成果等來決定獎金的多寡，而非和以前一樣完全依靠熬資歷來決定薪資，做得好的軍公教可以領得比以前更多。而不是看著老人坐在辦公室里卻拿走更多的錢。\n\n軍隊部門也會考量戰鬥部隊與非戰鬥部隊差異，外島、高山、艦艇等勤務加給，危險勤務，專業證照，訓練成績，留營率與專業能力等方面，來讓真正的戰士得到實惠，而非讓坐在大樓裡面的將軍拿著高薪。\n\n這些舉措讓待遇更能反映工作風險與專業程度，而不是主要依靠年資來決定。這有助吸引人才留在軍公教體系也能提升行政效率。"
 CHI.H2.331.a: "勞有所得"

 CHI.H2.321.t: "正中靶心"
 CHI.H2.321.d: "韓國瑜總統於 2019 年競選總統期間與國政顧問團共同提出的「勞動三箭」，在當時面臨著朝陽內外對於「財源籌措」與「如何落實」等可行性的廣泛討論，也因此，在韓總統剛剛上台時，未能進行落實。但在我國擊退共產黨入侵，國防壓力下降與經濟上升導致的材質盈餘，讓政府有了實現「勞動三箭」的底氣。\n\n第一箭：修改《就業保險法》\n\n政府正式提出對於《就業保險法》的修改意見，在其中修改就業保險制度，將無薪假納入保障範圍。勞工若不幸面臨無薪假，其損失的薪水將由就業保險支付原投保薪資的 6 成，並根據公司規模和各崗位的區別對放無薪假的時長做出了限制。\n\n衛杰是一家工廠的職工，在他上班的工廠被中共的飛彈炸成一片瓦礫之後，老闆無力大規模重建工廠，只能勉強回復生產線，並以日結結算薪水。他和工友們一直在做兩天歇五天的情況中苦苦掙扎，只能在空閒時間去找些臨時工作一下維持生活。當《就業保險法》的修改通過時，他的儲蓄卡收到第一筆無薪保險時，這個39歲的男人坐在房頂上，手上拿著便利店買來的啤酒，一直坐到了深夜。\n\n第二箭：政府同額補貼低薪青年勞工自提退休金\n\n在以前有高達 93% 勞工未「自願提繳」哪怕1%的退休金，最大原因是誘因對低薪族不夠明顯，他們沒有必要為了免稅而繳納自提退休金，為緩解該情況，韓國瑜總統提出了對等誘因（Matching Reward），即「你存多少、我給多少」，同額補貼低薪青年勞工自提的部分，並直接匯入勞工的個人勞退專戶，藉此保障其未來的老年退休生活。\n\n阿良是一名成功大學的經濟系應屆畢業生，在畢業後沒能找到符合專業的的工作，最後只能找到一份勉強餬口的工作，每個月34000塊的工資，付出房租，水電，吃飯，給摩托車加油等必要支出後，只能留下兩千多新臺幣作為儲備金，根本沒能力再去支付哪怕百分之一的「自願提繳」金額。這個月他看見街上粘貼的同額補貼的宣傳的海報，韓總統在個人的賬號上發佈的宣傳，「你存多少、我給多少」這個簡單易懂的口號，讓他心中一動，雖然他還算年輕，但是也不得不為了老年考慮，他咬咬牙，填了2%的自提額度，這意味著他付出的680塊，會變成1360塊進入他的賬戶，不知道為什麼，明明是幾十年之後的事情，他卻看著計算器上面的1360四個數字有了莫名的安全感。\n\n第三箭：編列 1,000 億元預算撥補勞保基金\n\n在台灣被譽爲亞洲四小龍的年代過去之後，勞保基金收支早已呈現逆差。因此百姓們最害怕的事情，就是勞保基金池枯竭，辛辛苦苦幾十年後拿不到屬於自己的養老金。韓總統在競選時便提出，當選後要在第一年與第二年各撥補 500 億元，合計 1,000 億元，兩年內編列1,000億元預算撥補勞保基金，在當時便被很多人質疑錢從哪裡來，韓總統也確實因為現實原因未能實現兩年內實現該承諾。特別是面對戰爭的破壞，但隨著我國經濟的復甦，政府已經有了足夠的資金，完成這一承諾，經討論，政府決定以每年333億元的預算，在三年內編列 1,000 億元保基金。保證國民退休後的退休金來源，這在全國引起巨大的慶祝之聲。"
 CHI.H2.321.a: "臺灣人發大財"

 CHI.H3.11.t: "剷除隱患"
 CHI.H3.11.d: "在立法院內，100名立法委員緊盯著大螢幕上的投票結果，翠綠色的樹叢中點綴的幾朵刺眼的玫瑰，與會立委中有90名同意這次修憲案，有10名投下反對票，芬才恩就是其中之一。她緊咬下唇，起身和一眾立委一起鼓掌，震耳欲聾的掌聲慢慢抽乾她的勇氣，她做立法委員的理想就是像這樣推崇韓總統的偉大嗎?才恩在心理安慰自己，只要公投門檻沒過也沒事，但經過四年日夜不休的宣傳與執政，這個門檻真能抵擋的了來勢洶洶的民意嗎?\n\n「芬委員，韓總統有事找您…」才恩嚇到差點跳起來。轉頭一看，她的助理不知何時神不知鬼不覺地溜到她身邊，立委故作鎮定地看了眼手表，差不多是該曉琪回家的時候了。她隨時可以再找藉口不去赴約，但這麼做有意義嗎?立法院已經徹底淪為總統和行政機關的附屬品，從系統內撥亂反正的希望渺茫，自己跟其餘還在負嵎頑抗的政治人物遲早都會被清算，今天說不定就是能以立委身分見到韓總統的最後一次機會，說不定只要好言相勸，韓總統就能回心轉意?\n\n芬才恩讓助理帶路，立法院門口停著一輛格外顯眼的黑色轎車，周圍的幾名保鑣替才恩拉開車門，韓國瑜就坐在後座。才恩不安地坐到韓總統身邊，車內的溫度異常寒冷，就連穿著全套正裝的委員也打了個寒顫。\n\n「芬委員，我很能理解您的一些獨特的想法。我也不期望您能理解我現在做的決定。」韓國瑜看著窗外飛馳而過的車流語重心長地說到。\n\n「韓總統，還希望您能再仔細思索幾天。民主制度早已深入每一位台灣人的內心，任何妄圖挑戰這道底線的人沒有一位能全身而退，取消任期限制無異於獨裁，這種開倒車的行為民眾絕不會坐視不管…..」才恩試探性地搬出民意，大部分民粹型領導人成也民意、敗也民意，也許韓總統只是被一時的勝利沖昏頭腦?\n\n恍惚之間，車子已經停下。芬委員瞥了眼窗外的景色，她被眼前的一幕驚得啞口無言，一名衣著休閒的陌生男子正護著曉琪站在幼兒園門口，一看到他們的車停下便立刻拉著小女孩靠近車子。"
 CHI.H3.11.a: "「需要順道載妳們回家嗎?」"

 CHI.H3.111.t: "防空洞"
 CHI.H3.111.d: "洞穴內悶熱的空氣讓王剛殷汗如雨下，他拿著手寫版靠在牆壁邊塗塗改改，牆上微弱的燈光是整個洞穴裡唯二的照明----還有一個是卡車的車頭燈，他調整了下位置，盡量別讓自己的陰影遮住清單的同時避免讓額頭上的汗珠滴到上面。工兵還在嘗試洞內的通風設施，但民國70年老東西的脾氣可沒那麼好惹，壞了修、修了壞，但物資轉運的部分也沒法拖延，所有人只能在這套桑拿房裡做做舉重訓練了。\n\n「這些就是全部了。」其中一位後勤官走向他說到，用手指了指從斜坡上緩緩開下來的重型卡車，柴油混合著幾十人的汗臭讓空氣都凝滯了，剛殷抹了下鼻子，試著適應這種令人窒息的氛圍。\n\n「好極了。」剛殷翻到清單的最後一頁，把最後幾個純白的空格全都打勾。子彈、槍械、軍糧……不知道上頭往這個個頭這麼小的防空洞裡塞這麼多東西幹啥?且不說這些東西能不能給多少部隊用多久，裡面的東西不知道是不是放了幾十年的陳年乾糧。\n\n像他們這樣的防空洞還有好幾十個呢!有的是戰後重新選址新修建的、有的是翻新舊有的地下和山體掩體，體積小的就塞些簡單的輕武器跟食糧補給，也許還有幾桶柴油擺在角落，拿來給坦克補給不太夠看，但給發電機倒是綽綽有餘。\n\n「接下來應該就沒了吧?看你們的卡車都空了……」王剛殷好奇的問道。\n\n「我建議你不要多問，這是機密。」眼前後勤官冷冷地回答道，在王剛殷敬禮前便轉身走開，乘上一輛卡車後迅速離去，留下滿頭大汗的王剛殷跟一臉好奇的其他士兵，前者看著那些剛搬下車的板條箱，箱子旁印著裡面應該要有的內容物:T65步槍十把。"
 CHI.H3.111.a: "最好別好奇裡面裝了甚麼..."

 CHI.H4.1.t: "大亞洲戰爭凱旋!"
 CHI.H4.1.d: "大亞洲戰爭的烈焰席捲東亞各國，平民與他們的一切被迫成為野心家奔向遠方的燃料，在看似無盡的戰火中成為傷亡表格上的又一串數字，無論當初是為了甚麼理想燃盡亞太，一切都結束了。穩中向前的大船最終不敵海狼們的撕咬、智能體團結人類的希望徹底破滅、太平上的強風驟雨澆熄復仇烈焰，上一次的中國折戟台灣，像中共的領導者證明台灣與東亞各國的堅強韌性，解放軍尚能體面地離開台灣，處理海內一團亂麻的局勢；而這一次的失敗則是徹底擊碎中華人民共和國的野心，無論他們想做甚麼，都不是太約的敵人!\n\n不過對台灣而言，今日的勝利還包含另外一層意義。在長久的民主化與本土化運動下，「光復」成了一個略顯陳舊又帶著戒嚴時代沉重包袱的詞彙，巨大的工業與軍事差距也讓當年遷台的老榮民們不得不融入這塊他們從未了解、從未踏足過的土地。可當中共投降的消息傳遍全台灣後，全島為之沸騰，不僅僅是懸在頭上的達摩克里斯之劍碎了一地，更是讓全中華民國第一次嘗到光復的滋味。\n\n自此之後，台灣人再也不需要矽盾、不需要籌碼、不需要看人臉色，我們的實力與地位不證自明，我們終於真正得到了決定我們命運的權利。先讓人們去狂歡吧!重建的事之後再考慮，至於下一步該怎麼走……"
 CHI.H4.1.a: "我們贏了！"
 
 CHI.H4.2.t: "第二次北伐戰爭"
 CHI.H4.2.d: "過去國民革命軍西討陸榮庭、東征陳炯明、北伐孫傳芳與張宗昌，最後在張學良宣告東北易幟時宣告軍閥大戰正式結束。沒人想到時隔多年之後，國民黨政府的軍隊會再次從廣州這塊起始之地進行一場統一戰爭。在共產中國徹底倒台之後，大陸境內各方地頭蛇趁機宣布獨立，沒被剿滅的解放軍將領收攏起當地殘餘部隊擁兵自重，甚至還有殘留在北京的中共黨員趁太約撤軍時聲稱新中國還沒覆滅，這一切都是中華民國沒有能力快速光復整個大陸造就的結果，我們會一步步取回失去的一切，將獨裁專政的陰影掃進歷史的垃圾堆！"
 CHI.H4.2.a: "革命尚未成功，同志仍須努力"

 CHI.H4.3.t: "幹部培訓"
 CHI.H4.3.d: "劉春橋區長盯著面前快速閃過的簡報發呆，理性告訴他最好在筆記本上記下一些重點，可右手無論怎麼樣也抽不出那隻咬在嘴中的原子筆。他舉起水杯喝水緩解心中的焦慮，教室裡出奇地沉默，台上的講師滔滔不絕地講解中華民國憲法的基礎原理跟立法基礎，身邊的同僚們沒有一個偷懶放縱。\n\n他飲盡杯中的最後一口水，有模有樣地抄下其中一頁簡報的重點。十幾年前考公的時候都沒這麼認真嚴肅過，這和寫申論題跟編編官式文章的感覺完全不一樣，也許是他們這批幹部需要特別關照?以半關押半自由來到台灣----應該說「中華民國自由地區」----接受新式的官僚培訓，培訓期間的食衣住行皆由中華民國政府負擔，但只能在規定的區域內自由活動，若是想到其他縣市還需要外出通報全部行程，如果沒在時間內返回可得面臨牢獄之災還有終身吃…褫奪公權的懲罰。\n\n投影布幕上的時鐘滴答作響，下禮拜就是期中考周，他們這群年近半百、小孩都上大學的事務官們還得跟他們的兒女一樣遵守大學式時程安排，差別在於沒有社團、沒有夜生活，只有卷學分跟學期成績的選項。幸好他們偶爾也有機會下到基層，學習他們的具體的工作流程。春橋還記得之前跟一位平時不怎麼喜歡的同事在區公所實習，後者接待民眾不是愛理不理就是踢皮球，最後上頭接到民眾投訴過幾天就被調走了，據說是開除公職並送回大陸。也不知道是受困在這個彈丸之地培訓十周好，還是直接送回家鄉種地好?\n\n下課鐘適時地迴盪在整間教室內，春橋收起筆記本，跟著三四十名同學魚貫而出，午飯過後還有行政法的課得修。穿過鬱鬱蔥蔥的樹林大道，今天的天氣萬里無雲，不知道遠在廣東的老母親怎麼樣了，現在大陸的局勢一團亂麻，希望早些時日寄的信和一些乾糧能順利送到她手上吧……"
 CHI.H4.3.a: "「先去食堂吃個飯好了。」"

 CHI.H4.4.t: "漫漫長路"
 CHI.H4.4.d: "「蓋章的時候為甚麼不能用我自己的印章啊?這樣誰知道是我投的票!」一位年過六旬的老爺爺舉起右手發問，台下的一眾相同歲數的爺爺奶奶們也跟著七嘴八舌地討論。台上劉川羽擺出手勢讓大家稍安勿躁，連續開了三天的民主投票座談會讓他和他的同事疲憊不已，雖然他能理解這些大陸移民對西方直接民主制的選舉流程感到困惑，但要是給這幾十位長輩講解投票都如此困難，等到時候重新在大陸開放全民普選不知道會是一番怎樣的混亂場景。\n\n「投票的時候投票亭裡會有選舉委員會事先放好的印章…」川羽把簡報往回調了幾頁，「拿起印章，在各自候選人的蓋章欄上蓋好印章，如果沒有按照圖示在欄位裡蓋章或使用非委員會提供之印章蓋印、簽字等等，選票直接作廢。同樣的要是在投票亭內公開亮票也是違反規定的，選票一樣作廢」剛一說完台下聽眾更躁動不安，有越來越多人舉起手想發表意見。川羽輕輕嘆了口氣，看來座談會還得再開幾天……\n\n而在另外一邊，多位教育部官員也正為了選舉的事在煩惱，只不過他們面對的是小學生、中學生跟大學生，這些有志青年也將是未來中華民國的重要骨幹，讓他們理解並實際參與中華民國的政治運作才是長久之計。但就現階段而言想要依靠教材「訓政」恐怕得等到十幾年之後才能初見成效，最好的方式就是直接安排老師或專員進入學校，將舊有的班級職位體系替換成台灣的，並替換掉所有政治課改為公民課，抽空讓讓所有學生選出班長、副班長、衛生股長等職位，雖然這麼做並不一定能直接把學生們變成一個民主社會中的合格公民。"
 CHI.H4.4.a: "一步步慢慢來吧..."

 CHI.H4.5.t: "旅途之終末"
 CHI.H4.5.d: "隨著荒漠，高原與草原的硝煙散盡，中華民國已經控制了先前中共所控制的所有地區，回復了我國對憲法中規定的主權地區的控制權與治理權。\n\n現今中國各地，已經開始進行重建工作與民主訓練，各地政府機構在逐漸回復功能，警察與軍隊也把秩序維持的很好，我們終於可以向世界宣佈，中華民國已經光復祖國，重獲新生。\n\n韓總統已經宣佈，政府部門將回到法定首都-南京，在搬遷當天，將舉辦盛大的慶典與閱兵儀式，他將親自帶領各部門官員前往紫金山拜祭中山陵，告慰國父、告慰蔡鍔將軍、告慰兩位蔣總統，告慰歷史上無數為中華民國、為中國的民主與自由、為反抗暴政而死的人們，並在當日同步舉行蔣先總統中正先生的遺訓，將其父子二人的棺槨從慈湖移葬至紫金山。\n\n自1912年國父孫文在南京就任中華民國臨時大總統以來，中華民國經歷袁世凱亂政、北洋軍閥混戰、寧漢分裂、日本侵略、中共奪取大陸撤退來臺、在臺灣的民主化這一系列的路程，終於回到了南京。\n\n在中華大地無數的混亂和獨裁之後，中國人終於可以驕傲的抬起頭，宣佈自己是一個享有民主，民生，民權的自由的人。"
 CHI.H4.5.a: "漫漫長路歸鄉"

 CHI.H4.6.t: "民主意識速成班"
 CHI.H4.6.d: "在中華民國回到大陸之後，最大的問題就是如何讓13億7000萬人民加入民主的社會，如果不讓大陸人民學會民主就直接讓他們進行選舉，只會出現麵包與馬戲的戲碼.他們無法理解選票代表什麼，不知道這是他們的武器，讓富人和政客用一些小恩小惠就讓他們乖乖的交出手裡的選票，這只會讓我們的選舉和古羅馬一樣變成一個賄選遍地，腐敗無比的選舉，所以必須先對大陸人民進行民主訓練。\n\n但臺灣的民主訓練是持續幾十年，即使是在戒嚴時期，也維持著基層民主，人民對於民主的認識一直在或快或慢的推進，而大陸不僅人數極多，而且因為共產黨的獨裁統治，僅僅只有一部分超一線城市，如上海，深圳，廣州的人民對民主有著基礎的認識.這讓我們無法用和臺灣一樣的方法來培養人民的民主意識，這需要花費大量的時間、人力、資源，龐大的財務支出在完成訓政之前會先拖垮國家。更何況我們也沒有這麼多的時間。\n\n幸好，即使是中共也不敢公開宣佈民主是壞東西，也要以「民主集中制」來粉飾太平。這讓我們的工作不至於從零開始。也幸好中國有著三個地區的人民有著實際的民主經驗，我們將以臺灣，香港，澳門，三地的人民作為引導，動用一切手段，甚至包括一些強制手段，將民主經驗強行快速塞進大陸人民的腦子裡面，不求他們有多好的民主意識，只要有基礎的民主素質就好，起碼不能為了幾百塊把自己的選票賣出去。"
 CHI.H4.6.a: "總之先把知識塞進去"

 CHI.H4.7.t: "深夜快車"
 CHI.H4.7.d: "漆黑的夜，路邊只有幾盞忽明忽暗路燈陪伴旅人回家。韓國瑜坐在加長型的黑色禮車內，昏昏欲睡的他習慣性地解下領帶，他和他的總統車隊剛從北京馬不停蹄地沿著高速公路南下，上海、南京、廣州、福建……中華民國好不容易重歸一統，他這位來自台灣的總統現在正被數十億雙眼睛審視著，期待他能給中國人民帶來期待已久的光復。\n\n「總統先生，您要不歇一會兒吧?我給您帶了些安眠藥過來…..」坐在眼前的保鑣流暢地從口袋掏出藥盒，銀色的包裝上只剩下兩粒。韓國瑜接過藥盒，最近幾天都在各大城市連軸轉，接連在各地視察重建進度，以韓總的體力在台灣保持親民形象還能勉強撐得過去，但要是每天都得跟上千人握手、拍照、舉辦座談會，就算精神上應付的了，這副已過古稀之年的軀體也支撐不住。\n\n韓總統將安眠藥扔向身旁的坐椅上，他太累了，當年的他怎麼想也想不到居然會走到今天這種程度，從統領一個彈丸之地變成整個秋海棠，人們愛戴他、擁護他，認可他是中華民國無可取代的總統，是他們對韓導的信任支撐他一步步走到現在。\n\n望著窗外不停變換的路燈……韓國瑜心裡清楚，人們對「韓導」的熱情終究會消散，再下一次、下下一次、下下下一次，會有越來越多人模仿他的風格參與競選，他們更年輕、更有吸引力，韓總統贏不了他們的。韓總統也曾經想過扶持繼承人，但這就是韓導想留給中華民國的遺產嗎?\n\n人們在不停的激情中循環往復，如果外界沒了更加強大的敵人，中國人會不會再一次將槍口對向自己的同胞?"
 CHI.H4.7.a: "願中國終成自由！"

 CHI.H4.91.t: "蒙古問題"
 CHI.H4.91.d: "一望無際的草原飛馳而過，各色馬兒在人跡罕至的原野上無憂地生活著，它們有的奔跑、有的嬉戲，不過大部分都選擇躺下休息。偶爾有一兩個牧羊人趕著一團團雲朵前進，好似乘著觔斗雲。\n\n陳秋盛闔上牛皮筆記本，今天紀錄的所見所聞足夠多了，他敲了下僵硬不已的後背，那是年輕時奮鬥後留下的後遺症，當年背著老闆的東西滿世界亂跑，現在自己當了老闆，但也沒感覺輕鬆多少。原本的安排是從桃園機場起飛，經停北京首都機場後再直飛成吉思汗機場，但總統和幕僚們討論過後認為現在的中國情勢還不安定，尤其國界的安全問題尚未得到妥善解決，於是臨時決定在北京落地後轉乘外交專列抵達前往蒙古首都，可由於蒙古方面自同意外交談判後就一直沒有回應我方的任何問題，也不同意我方列車的入境申請，只能讓陳秋盛帶頭的外交團隊在呼和浩特下車，改乘車隊前往烏蘭巴托。\n\n十二個小時過去，陳秋盛不是在審閱談判條款就是在寫筆記，後者很好的緩解了他的焦慮跟失眠的老毛病，但醜媳婦總是要見公婆，他緊緊攥這手中這份長達一百多頁的歸順條款，從主權到領土，交通、郵政、教育、經濟等方面，沒有特別行政區或民族自治區，而是全面合併入中華民國的中央體系，這種在現代來看無異於賣國的條款他們真的會接受嗎？\n\n「老闆，我們快到了。」助理拍了拍他的肩膀，指著遠處寫著蒙古文的路牌說到。\n\n「蒙古方面聯繫我們了嗎？」陳秋盛將條款副本收入公文包，看著前方的車輛，整支車隊共有六輛搭載保鑣的SUV隨行，陳老闆搭的這輛據說是承平年代大陸官員最喜歡的紅旗牌轎車，後座空間確實寬敞，不過就算能舒服的伸伸腿也沒辦法緩解他的焦慮。他是帶著使命前來，他們背負著中華民國的未來之夢，可對蒙古來說是一個幾乎必輸的賭局，如果他們真的打算魚死網破，僅靠這些隨行人員是擋不住正規軍的襲擊的……\n\n車隊停在十字路口處，站哨的值班長官上前和司機打招呼，指了指兩旁的猛虎裝甲車，口譯人員跟外交官們解釋士兵們是奉蒙古政府之命在此等候我們，是「護送」使團進入烏蘭巴托的護衛。"
 CHI.H4.91.a: "希望能夠和平解決!"

 CHI.H4.92.t: "五族共和，缺一不可！"
 CHI.H4.92.d: "車隊跟著領頭的軍車駛入烏蘭巴托，老實說陳秋盛原以為蒙古首都應該只有幾座高層建築，剩下的不是平房就是蒙古包，繁華的程度可能也只能跟十年前的台北與新北比吧。他們現在正在高速公路上狂奔，十幾輛SUV和軍車浩浩蕩蕩進入市中心，沿街都有交警負責管制閘道與十字路口。車子開在相當平穩，即便儀表時速已經飆上一百多公里了也沒有明顯晃動，陳老闆心裡確實佩服中共的基建水準。決定中蒙兩國命運的人，在中共建設的高速公路狂飆…….\n\n沒過多久，他們就抵達了今晚的下榻之處：烏蘭巴托飯店。隨行的軍車停在大門外，等外交車隊全部駛入飯店內的車道後才離去。車隊停下，前後車的保鑣先行下車，確認安全後才打開車門讓使團們下車，陳秋盛微微吞了口口水，紅毯、禮賓人員、還有來自中蒙俄三國的媒體擠在四周，被紅龍隔開在紅毯兩側，他們出人意料的相當克制，周圍只有無盡的閃光燈與快門聲。陳秋盛向兩側的媒體點頭致意，快步走入國賓館大堂，蒙古外長在裡面等他。\n\n「我最親愛的朋友！」外長張雙臂抱住陳秋盛，後者背著突如其來的熱情驚了一下，不過很快就回抱回去，在禮賓人員的引導下雙方都帶著各自的使團官員進入會議室。陳秋盛跟蒙古外長一同落座，前者拿出印著繁體中文與公章的協議副本、後者則是吩咐助理拿出印著蒙古文的協議版本，雙方在這裡進行最後最後的細節磋商——不過前期該協商的問題都已經取得共識，今晚的會議只是確認部分細節與檢查錯漏字。\n\n隔天早上，陳秋盛乘著專車前往蘇赫巴托廣場，兩旁的道路上擠滿了熱情的民眾，他們高高舉起手中的中華民國和蒙古的旗幟、牌子上用中文跟蒙古文寫著「中蒙友誼共長久」，就連總統府前的蘇赫巴托廣場也都被人潮佔滿，整個首都的警力幾乎都被派駐到這裡維持秩序，交警努力幫陳秋盛的車隊開路，讓他們盡快抵達總統府。\n\n今日早上11點12分，陳秋盛和蒙古總統在眾目睽睽下在外交文件簽字，在實質上蒙古已經成為中華民國的一部分，但由於目前大陸局勢尚不穩定，因此就由中方代表陳秋盛簽字，等[CHI.GetLeader]的政務告一段落後再由雙方領導人舉辦正式儀式，完成法理的交接。"
 CHI.H4.92.a: "秋海棠重歸一統。"

 CHI.H4.93.t: "成吉思汗的子孫永不屈服！"
 CHI.H4.93.d: "車隊跟著面前的軍車駛向烏蘭巴托，頭車開下高速公路進入城區，十多輛SUV在首都車滿為患的街道上徐徐前進。車子停在路口等待紅燈，車流快速穿越、行人幾乎都低著頭穿過路口，偶爾有幾個抬起頭看向車隊，前車搖下車窗嚴令喝斥後才匆匆離去。\n\n車隊繼續往目的地前進，可他們卻離總統府和國賓館越來越遠，陳秋盛內心微微升起一股不安，胃酸在肚裡來回翻攪，他讓助理幫他拿出他的水壺。喝了幾口，陳秋盛的餘光瞥見外頭的情況，街上的人潮越來越多，他們朝著車隊大聲叫罵、試圖突破周圍軍警的封鎖、警察拿著防暴盾牌努力控制這些憤怒的群眾。車隊越往前走，情況就越發嚴重，推擠和謾罵聲穿透玻璃進到車裡，沒有人能聽清它們在說什麼，陳秋盛瞟了眼隨行的翻譯，他沒有說話。\n\n過了十多分鐘，他們才穿透層層障礙抵達目的地，今晚的談判地點選在軍營，外頭的憤怒群眾已經把營區大門堵得水泄不通，哨兵配合警方一起控制人群，但雙手還是緊緊握著步槍。車停下，陳秋盛趕忙跳下車，他的直覺告訴他在這裡越久越危險，士兵帶著他走向營區深處，使團也匆匆忙忙的跟在老大後頭。一頂軍綠色帳篷、兩張鐵桌、十張折疊椅，配上幾位蒙古代表，這就是今晚商討國家大事的地方？\n\n「您好，我是中華民國的使團代表陳秋盛。」他握住蒙古代表的手，熟練地掛著合適的微笑。外頭的聲音越來越大，陳秋盛拉出一張折疊椅坐下，打算儘早開始就條款內容進行細部磋商，不過雙方只談了十幾分鐘，幾名全副武裝的保鑣大口喘著粗氣闖進會議室。\n\n「怎麼了？發生什麼事了？」陳秋盛從座位上站起來問到，但他心裡已經有了答案……\n\n「老闆，外面的情況已經完全失控了！我們必須立刻——」話音未落，一塊磚頭砸破帳篷掉在桌上，隨後群眾的怒吼聲掩蓋一切。顧不上外交禮儀，陳秋盛一把抓起公文包跑出會議室，身後的保鑣們護送使團衝向車隊，想要在情況徹底失控之前離開烏蘭巴托。\n\n但一切都為時已晚，他們剛關上車門就遭到暴民的圍攻，木棒鐵管憤怒的砸向車窗，暴民們把陳秋盛的車包圍起來，司機嘗試踩下油門衝出重圍，但屢屢都被暴民攔下。眼看著車窗已經碎成蜘蛛網狀，陳秋盛瞥向附近的蒙古士兵期望他們幫忙解圍，但他們好像不為所動，只是任凭暴民攻擊使團的車…..。"
 CHI.H4.93.a: "看來成吉思汗是不會就這樣臣服的。"

 CHI.H4.94.t: "我們該不該同意合併？"
 CHI.H4.94.d: "阿阿阿寶寶你是一個叛徒、特務、大軍閥、反黨分子、野心家、走資派、投降派、修正主義、大惡霸、黑線人物、不革命、黑秀才、黑手、黑幫兇、經驗主義、民主派、中庸之道、變色龍。"
 CHI.H4.94.a: "喵?(同意合併)"
 CHI.H4.94.b: "哈!!(不同意合併)"

 CHI.201.t: "中華民國再臨大陸"
 CHI.201.d: "中華民國南京總統府於今日召開全球記者會，宣布隨著中國大陸最後一支軍閥勢力無條件投降，曠日廢時的內戰正式結束。\n\n「大亞洲戰爭」結束後，中國大陸原有政治秩序瓦解，各地武裝勢力相繼割據。中華民國政府隨後以廣東等地為基地展開「第二次北伐戰爭」，並在太平洋防禦條約組織盟國提供的軍事及後勤支援下，逐步擊敗各地軍閥，最終重新控制中國大陸主要地區。\n\n有分析人士指出，中華民國自2023年台海戰爭慘勝後，到如今跨越海峽成為中國大陸的主導力量，南京政府重新建立對中國大陸的控制，將對東亞安全局勢及今後的國際秩序產生重大影響。"
 CHI.201.a: "事功者一時之榮，志節者萬世之業"
 CHI.201.b: "東亞巨龍再臨"

 CHI.202.t: "西藏重歸中原"
 CHI.202.d: "老實說，陳豪人從來沒想到自己的天賦居然能在這裡展現出來，他端著步槍、揹著深綠色背包沿山脊線巡邏。跟自己一起執行任務的是個20來歲的年輕人，看著他才出營10分鐘就有點喘不上氣了，體力還不如一個40多歲的老陳，幸好背包裡裝了軍方配給的壓縮氧氣瓶，每次巡邏都是配給兩人60分鐘的量。\n\n陳豪人帶著同伴找到一處比較平緩的地方歇息，放下背包後他拿出兩瓶氧氣，一瓶給他、另一瓶給自己。陳豪人只簡單吸了幾口後便收起氧氣瓶，過去在部落裡長大的他很習慣這種高原低氧的極端環境，體能訓練、負重訓練與作戰操演等高強度活動的表現遠比其他同袍優秀，不過在四川整訓時他還是得重新適應高原環境。\n\n豪人望向遠方的拉薩市中心，遠處的布達拉宮依舊挺立，國軍和印度軍隊為了爭奪這塊戰略要地發射了數萬枚砲彈，現在的拉薩早就沒了原先的那種寧靜、祥和，取而代之的是哭喊與鮮血，各種古蹟也在激烈的戰鬥中盡數損毀。\n\n不過好消息是政府已經跟印方達成和解，答應撤出西藏地區並交還藏南等所有爭議領土，聽到這個消息時大部分同袍的喜悅溢於言表，慶祝西藏重歸中華民國!\n\n陳豪人心裡更多的是一種釋然，畢竟在距離老家3000公里外的西藏駐防三個月可一點也輕鬆不了，印軍的邊防部隊依然會時不時越界滲透，不打起十二萬分的精神納下一個死的肯定是自己。幸好，今天是最後一天。\n\n陳豪人帶著同伴走完剩下的巡邏路線，傍晚他們和全旅弟兄集中在拉薩火車站跟其他部隊換防，陳豪人跟著綠壓壓的隊伍有序上車，接下來他們得連續乘坐30多小時的火車前往成都，最後再從成都的軍用機場轉乘C130返回台灣，享受他們應有的休假。"
 CHI.202.a: "國土沒有售價，硬座直達拉薩！"

 CHI.H4.100.t: "中國與中華民國"
 CHI.H4.100.d: "有人說，中國的近代史就是一部中國人民的受難史。\n\n1840年，鴉片戰爭撬開了清朝閉鎖幾十年的對外口岸，也開啟了西方列強殖民中國人民的慘痛歷史，清廷在數不清的戰爭與條約中失去大量領土，本屬於中國人的利益也被外國資本家恣意吸血、掠奪。\n\n1912年元旦，孫中山先生在南京宣誓就任臨時大總統，中華民國正式成立，溥儀也在2月12日頒布退位詔書，中國成功地從舊時代帝制走向共和制政府。可處處漏風的共和體制、袁世凱和北洋軍閥們相互的爭權奪利，民國初年的中國沒有一丁點民主的痕跡，有的只有革命者的鮮血與流離失所的難民。\n\n此時的中國如摔在地上的瓷器，四分五裂。\n\n1928年12月29日，東北易幟。中華民國終於完成了統一大業，雖然這種統一是形式上的，國民黨內部各派互鬥、中共伺機流竄潛伏、民生環境極其惡劣。但對於南京政府來說，能夠完成這些大事已經是長足的進步了，日本虎視眈眈地盯著東北，想要將他乃至整個中國都納入所謂的「大東亞共榮圈」之中，而歷史，只給了中國人不到十年喘息的機會……。\n\n1945年8月15日，日本宣布無條件投降，八年抗戰慘勝。3500萬中國軍民以血肉之軀鑄起一道道阻擋軍國主義的紅色長城，國民黨的陣前作戰配合共產的游擊襲擾，齊心協力驅趕入侵者。可戰後國民黨和共產黨的矛盾再度被揚到檯面上，雙方再次撕破臉，各自發誓必須剷除傷害國家的國賊!\n\n1949年10月1日，毛澤東在北京正式宣布中華人民共和國成立，三大會戰的慘敗讓蔣介石不得不找尋新的根據地繼續反抗共產黨，於是台灣就這麼成了國軍撤退的下一站，這一走，就是70年。\n\n近200年的戰火洗禮，多少革命者的抱著一腔熱血投筆從戎，又有多少家庭失去他們的孩子?多少野心家視人民如草芥，又有多少理想主義者把地獄帶回人間?\n\n幸好，這一切的一切將在此刻終結，南至西沙、北至蒙古；西至新疆、東至東海，中華民國徹底打敗那些妄圖推翻中國的野心家，民眾歡欣鼓舞，自己再也不用為了生活所苦。他們也不必因陷入身分認同困境而操心。\n\n因為，這個世界上只有一個中國，它叫做「中華民國」。"
 CHI.H4.100.a: "中國萬歲！"

 CHI.H4.101.t: "向日本提出領土移交交涉"
 CHI.H4.101.d: "今日稍早，[CHI.GetLeader]在南京總統府舉辦慶賀中國統一的記者招待會，中華民國終於完成了自己一百多年的夢想，讓中國人民歸於青天白日滿地紅之下，不過實際情況卻有些……特殊。\n\n在大亞洲戰爭結束後，太約部隊撤離中國全境，在中共政權崩潰後又以「保護當地僑民與資產」為由派駐軍隊進入大陸。在當時全面混亂的背景下這種軍事干預與佔領確實有其道理存在，在我方收復故土期間有盟友負責管理並維持當地秩序，替我們分擔了不少管理壓力。\n\n雖然名義上是共同管理，但主要還是由日方負責維持當地秩序，日統區內的居民對此相當不滿，過往日本對中國造成的傷害讓日治區的民眾無法對日本駐軍視而不見。每當日軍軍營想升起日本國旗，過沒幾天就會有「熱心群眾」扯下旗幟扔在地上；一些軍紀較差的日軍士兵也時常被發現死在某些小鎮深處的巷弄內；在我方的協調下海軍自衛隊的軍艦靠港時都必須暫時收起艦上的旭日旗，但還是有大批民眾對著裝卸貨的日籍船隻破口大罵，甚至有港口工人嘗試將自製炸藥混入彈藥箱中，試圖破壞海自在大陸港口內的臨時彈藥庫。\n\n雖然在大城市內的軍民關係還算穩固，但兩者之間的衝突並未真正弭平，只要一顆火星，隨時有可能演變成一場暴力衝突。\n\n此次記者招待會就是為了解決這一問題召集而成，總統府發言人與外交部相關負責人輪番發言，表示目前正在跟日本方面磋商，商談佔領區的轉交事宜與駐軍撤離情況。為照顧大陸居民的感情與保障日方人員的安全，以上協商皆在台灣的台北市舉行，由我方保障日方這段時間的食宿出行與安全保障，直到雙方取得共識。"
 CHI.H4.101.a: "台灣來電..."

 CHI.H4.104.t: "是否同意交出我方在陸佔領區?"
 CHI.H4.104.d: "我隨便寫寫的應該沒人會看......吧?反正就是要不要交還在陸佔領區，看你怎麼選。"
 CHI.H4.104.a: "喵?(同意交還)。"
 CHI.H4.104.b: "哈!!(不同意交還)"

 CHI.H4.102.t: "日本歸還全部在華領地與港口"
 CHI.H4.102.d: "今日，日本外交代表團已於稍早驅車離開圓山大飯店，車隊低調地以最快速度趕往總統府。凱達格蘭大道上聚集著滿滿的人潮，他們大多是日佔區的大陸同胞，自談判伊始就有大批大批的居民越過邊境線進入南京訴願，表示日軍對統治區居民有多麼多麼慘忍、不希望日本國旗再度飄揚在國土上。\n\n由於有太多項目需要協商與確認，致使談判時間拖得越來越長，有些居民遲遲等不到結果乾脆搭乘小三通前往台北抗議，他們聚集在總統府和圓山大飯店附近，他們代表表示「日軍一天不撤，我們就一天不走!」。\n\n來台灣的人數從最開始的1000多人迅速翻漲，高峰時一度近萬人在總統府前抗議，周遭交通嚴重堵塞，日方的外交車隊一度被擠在重慶南路上動彈不得，抗議人群在此期間不停朝日方車隊投擲雜物，雞蛋、鞋子與磚頭不停砸向專車，十多分鐘後在台北與新北交警的聯合掩護下，日方車隊才順利突破封鎖進入總統府。\n\n與此同時，大批新聞記者也齊聚台北市隨時跟進談判進展。記者同時也頻繁採訪總統府外的抗議居民，他們的意見無形中給我們帶來龐大的壓力，但就電視上日方代表團愁眉苦臉的表情來看，顯然他們承受的壓力比我們更大。\n\n終於，今天早上雙方正式簽訂協議，所有日方在陸佔領區全權移交中華民國管理，日統區行政資料與公共資產由中華民國政府接收，駐軍也會在30天內逐步撤離。為安撫大陸地區居民的，日本駐軍撤離時將由國軍在旁全權監督，車隊、港口全都有國軍士兵站崗監視，直到日軍最後一位士兵登上撤離船隻為止。\n\n不過，上海的情況尤為特殊，日方似乎不怎麼願意放棄這塊肥美的經貿口岸與金融重鎮，他們以「當地情況複雜，無法立即撤離」為由阻撓國軍與我方本地官員接收，有關上海的複雜態勢，需另訂時日談判後才能確定。"
 CHI.H4.102.a: "中華民國萬歲！"

 CHI.H4.103.t: "日本拒絕歸還在華領地！"
 CHI.H4.103.d: "東京方面悍然拒絕了我國關於歸還東北及沿海租借港口的正當要求。看來和平交涉已無可能，中華民國將不得不訴諸最後的軍事手段！"
 CHI.H4.103.a: "啊？"

 CHI.CT.12.t: "李登輝逝世"
 CHI.CT.12.d: "台北榮民總醫院今日正式對外宣布，前總統李登輝多重器官衰竭病故身亡，重症醫學部主任林永煬表示李前總統離世前家人接陪伴在側，這位台灣民主化先驅最終在自然狀態下走向生命的終點。回顧李登輝先生的一生，出生在日治時代的他先後在京都帝國大學、台灣大學就讀並於美國康乃爾大學攻讀農經博士，返台後被時任行政院長蔣經國延攬為政務委員，主管農經。並逐步踏入國民黨核心領導層，最終在蔣經國逝世後正式接任中華民國總統一職。\n\n關於他三十年前各種政績和改革的評價是複雜的，不過在終止動員戡亂抑或是廢除懲治叛亂條例這兩件事上，毫無疑問李前總統確實讓台灣在民主化改革的道路上跨了一大步，但在外交立場上他又提出較為獨特的論調。身為國民黨員卻主張「台獨」和親日，同時李登輝將兩岸關係定性為特殊國與國關係，嚴重打擊了90年代時的兩岸合作，間接導致1996年台海導彈危機的發生。\n\n李登輝先生這數十年來的執政方向無論是在台灣內外都引發劇烈爭議，或直接或間接地影響二十一世紀前二十年的兩岸互動與政治論調，李前總統的去世象徵著一個時代的結束。時代的車輪滾滾向前，而有的人知道能把它駛向何方……"
 CHI.CT.12.a: "好好休息吧，李前總統"
 CHI.CT.12.b: "這黑道頭子終於死了"

 CHI.CT.13.t: "君為我畫眉"
 CHI.CT.13.d: "均鑑親啟：\n\n前日來信我均收，知你近來軍中事務安好，甚慰。家中事情無恙，依舊照常，無須憂心。\n\n昨日母親來電問我近況，零落閒碎，記憶你尤在時，一句三嘆。黯然神傷時，偶見咖啡館時合照，你穿一身白色大號短襯衫，戴一頂我們在美國時買的紀念品鴨舌帽，挽著我手，望著我笑，光景依稀可觸。咖啡館上月已由店主告示關閉，惟今剩一片圍起來的施工地。我上月去，追念往日，可惜祇我一人，不能見你那般痴痴的笑，便覺失落愴惘。\n\n阿竹上週已過一歲生日，牙牙學語，不覺間竟會說「媽媽」兩字，闔家欣慰，惟你不在，我告訴他一定不要學爸爸，竟然與我離得那麼遠，讓我好不憂慮。母親寬慰我，可不能見你面，只憑你字跡知你近況，實在單調。你來信說手機壞掉，只得憑郵通信，真是倒楣！來信幾番，不見你照片樣子，只是信上道安，好壞！好壞！這次去信後，下番來信務必附照。母親也說想你，夜裡來電與我說你小時事情，我雖未同你經歷過，仍歷歷在目。\n\n我們看海，不知你還記得？夏至時候駕車去蘇澳海灘看海，離家不遠，後備箱並非必備東西，我能拾許多石頭放進裡面。記得有一次我們在那邊散完步後吃紅豆冰沙，你說太甜，全推給我，我用木柄小勺餵你吃時你才張口，吃完還說我淘氣，逼迫你吃。你才淘氣！你才淘氣！現在想過來，你是存心逗我來玩。那時我正懷孕，腦容量都被阿竹吃盡，這才不能反應！我整理家務，在你舊衣翻到那時寫真，你笑得還是那樣痴，像個快樂的傻子。可我嫁給你，你這個天真的傻子，我要問問你，我又什麼是呢？不許說我也是傻子！\n\n想到現在這個社會，資訊橫流的日子包圍著我們，其實放下螢幕和你在這張薄薄的紙上互訴衷腸，感覺也不錯？想起來木心的那首詩：從前的日色變得慢／車，馬，郵件都慢／一生祇夠愛一個人。從前讀詩，只是興趣使然，略略翻過，看到有意思的句子便摘抄下來，並不深究其中意味。今天寫信倒是清楚明白了。我必須感嘆，生在這樣的時代裡，我們能夠在人潮裡相遇，相識，相知，喜結連理，真是我們的幸運。\n\n最近我在學著看星星，宜蘭的霓虹燈紛繁，如果從天上往下看，會分不清哪邊才是星河。我想我一定是大熊座，你在小熊座，我們就在这里靜靜地漫遊，天亮也不停下來，直到下一次日落，我們靠在月亮上，靜靜觀賞從天燒到海的夕照。對了，日落，阿竹昨晚和我出門散步，他指著太陽張口，又蹦蹦跳跳、手舞足蹈，那大概是他學說話後第一次見到夕陽。回家在紙上塗塗畫畫，花了許多張落日，這次去信給你附寄去，讓你看看你兒子的傑作，哈哈哈！\n\n還有阿竹近照，一併寄去。\n\賓宜\n四月二十二號"
 CHI.CT.13.a: "我是如此愛你，不願與你分離"

 CHI.CT.14.t: "我為君作炊"
 CHI.CT.14.d: "賓宜親啟：\n\n近來你連發信，我現均已收。營團事務紛繁，條例蕪雜，不能及時回筆，實是公務在身，推託誤大事。我身安好，所部上級同輩弟兄都與我交好，吃住無虞，無須憂心。\n\n昨夜值班夜巡，月明星稀，思你信中所筆，宜蘭夜景似星河，想來宜蘭水天相接處定是如此，如是更覺感慨，不能與你一起觀賞，可惜，可惜。你所說確實不錯。我們就像那些天上璀璨的星座們，漫遊在無垠的宇宙裡，或許，你我之間的心更要比太陽熱一千倍。\n\n近來我常趁閒時去看海，粼粼的波浪中湧出許多星點，隱約間我看到你的影子，你淺藍色的裙擺遊曳在蘇澳海灘上，我們沿海灘一直走，你呆呆地笑，從黑黢黢的亂石堆裡拿出你蠶絲一樣的手拾著那些形態各異被你視為珍寶的石頭，還拉著我一起鑒賞。我記得有一次，你在灘上找到一塊近乎純白的石頭，激動得像個五六歲的孩子，邀功似得要我領你去吃紅豆冰沙。那天你說，這次紅豆冰沙好吃到頂，我想多看看你的傻樣子，就把自己的那一份推給你吃，哪知道你竟然要「強迫」餵我吃，我只好從命。誰讓軍人的本性就是執行命令呢？哈哈哈！我本以為不會發現我的想法，未想只過一年你就反應過來，可真是我聰慧的小寶貝哟！看來全怪阿竹，他吃了你近一年的腦子，想來也要有你這樣的「聰慧」了！哈哈哈！\n\n說到阿竹，你信中相片我均已收好，阿竹看著真是好精神，笑時有你幾分樣子。白駒過隙，時間匆匆，未想阿竹也有一歲了。全賴你和母親照顧，我這個父親沒有盡到責任，深感慚愧。離家甚遠，生死一線，更念當年，時光青蔥，好像取之無限，可國家大事，螟蛉之子又怎麼能夠置身事外？是先報國家之恩，後謹父親遺命，你我兒女情長只好忍淚割捨。我萬知你深處閨閣，身單多惱，可我也並無萬全之策，只是苦了你和母親，深夜多夢我。我不是一個好丈夫，也不是一個好兒子。\n\n你來信說，我們常去的那家咖啡館也已閉店，只是不知那店主人還可聯繫到？我有他幾次陳年舊賬，人在營中不能親自還清，還託你幫我聯繫那位店主人，如果取得聯繫，務必替我還清。我與他相識已有多年，你且清楚的。物是人非如此之速，著實未料！思緒萬千，不知從何說起。\n\n你所說不錯，這個資訊橫流的社會裡，我們就好像兩葉飄泊的小舟，因緣複雜，大千之內，我們彼此相識、相知、喜結連理，共同築起我們兩個小小的避風港，真是不容易！不容易！那些書裡面文人騷客、英雄美人们委婉、蕪雜的浮光掠影，好像和我們並不相差多少。或許我們就是那些人，而這都從那句「我愛你」始發，真是幸運啊！\n\n夜已深，閒話到此就好。你無需擔憂我，手機一事已報所部，不用心急。\n\n回信附寄營中相片，勿深念。\n\n均鑑\n四月三十號"
 CHI.CT.14.a: "天上明星照著我們彼此的心"

 CHI.CT.15.t: "電告與獎狀"
 CHI.CT.15.d: "夏宋氏賓宜女士，尊前：\n驚悉貴府主人夏諱均鑑於台海戰役中，不幸壯烈成仁，忠勇殉國，聞訊震悼，殊深軫惜。\n\n查夏諱均鑑生前係榮民烈屬，忠貞愛國，英勇犧牲，足資矜式。本部已呈奉上峰明令追晉陸軍少尉，並頒授褒揚令，以彰忠烈。\n\n對於英烈家屬痛失長支，本部謹表最深之哀悼與慰問。有關各項撫卹及後續喪葬事宜，已派專員全權協助家屬辦理，務求優卹周到，以慰英靈。\n\n\n中華民國金門防衛指揮部\n\n中華民國一百一十二年五月四日"
 CHI.CT.15.a: "茲有殉職陸軍少尉夏均鑑......"

 CHI.CT.16.t: "白鴿長飛"
 CHI.CT.16.d: "烈士陵園一如往常，初夏的陽光熱烈得近乎殘忍。這時還沒有到正午，婆娑的樹影中流出絲絲清涼的風，挽起宋賓宜淺藍如天空的裙擺。就像走在夏日的蘇澳海灘上一樣，她捧著夏均鑑的相片，步履輕盈。相片上的夏均鑑眼神堅定，嘴角勾起微微笑容，軍裝在身更顯英氣。夏母緊緊跟在宋賓宜身後，她穿著一身黑色長裙，神態放鬆，好像只是在處理一件小事。兩個身著軍禮服的士兵護送披著國旗的夏均鑑的骨灰盒跟在她們後邊，他們的神色肅穆、悲傷、一絲不苟。四下靜悄悄，偶有幾聲遠遠的鳥鳴隨風飄來，又被士兵們整齊而沉穩的正步聲擋開。路並不遠，他們在斑駁的光線裡穿過小徑與樹影，腳下的落葉發出細碎的聲響，彷彿在低語著什麼，最終到了夏均鑑的墓前。\n\n下葬儀式極其簡單，沒有盛大的軍樂隊，也沒有讓人眼花繚亂的記者鏡頭，只有風聲掠過松林的低吟，和幾個兵士們肅穆的神情。陽光透過樹葉的縫隙灑在墓碑上，映出淡淡的光暈，彷彿是某種無聲的告慰。儀式結束了，宋賓宜依依不捨地把照片放在他的墓前。他笑著，好像對著她笑。母親看著自己兒子的黑白相框，終於沒有撐下來，傷心欲絕到昏厥，如果沒有那兩個攙著她的兵士，她早已倒地不起。宋賓宜回過神來時，陸伯伯已經到了。雖然八十有餘，但他身形健碩，齒白髮黑，老當益壯。陸伯伯和夏父是老戰友，兩人是有過命的交情，一起從大陸退到臺灣來，到夏父去世時也有聯繫。\n\n陸伯伯卸下軍帽，走近宋賓宜噓寒問暖幾句，談到夏均鑑卻喉頭一哽，沉默一陣，緩緩張口：「瞞著你們均鑑犧牲的消息，是我的決定，老夏去世還沒有多長時間，如果再讓你們知道均鑑犧牲的消息，我怕你們承受不住。」他的聲音低沉而沙啞，像是被歲月磨礪過的砂紙，每一個字都帶著沉甸甸的重量。\n\n宋賓宜看著陸伯伯的眼睛，神色淡然。陸伯伯的手緊捏帽簷，繼續說到：「均鑑的遺體我們找了很久，前後花了有半年時間……他是個好孩子，是個好戰士！他和他的父親一樣，都是烈士！」說到這裡，他的眼眶微微泛紅，卻始終沒有讓淚水落下，只是用力地眨了眨眼，彷彿在壓抑著某種深埋已久的情緒。\n\n宋賓宜聽著陸伯伯追憶夏均鑑在軍中的表現和日常，思緒隨風飄遠。恍惚間，她看見夏均鑑的身影，在夏日的蘇澳海灘上，正朝著她走過來。他提著編織袋，袋子裡是稀奇古怪的鵝卵石，海風吹過他的髮絲，洋溢著紅豆冰沙的氣味。那是一個燦爛的夏天，海浪聲中有著孩子們的歡呼和雀躍，她的裙擺已經被海浪打濕，深藍色中倒映出她淚眼盈盈的臉。夏均鑑伸出手，為她拂去淚痕，在她的臉上留下一個淡淡的吻，轉身向大海深處走去。\n\n只留下宋賓宜在紅豆冰沙味的海風中黯然神傷。\n\n風從遠處吹來，帶著一絲鹹濕的氣息，彷彿真的從那片海灘吹到了這座寂靜的陵園。她站在原地，久久沒有動，直到陸伯伯輕輕拍了拍她的肩膀，才緩緩回過神來。墓碑上的照片依舊在笑，彷彿從未離開。\n\n她蹲下身，伸出手，指尖輕輕觸碰那冰冷的石碑。指腹下的粗糙與涼意，像極了那個夏天，他指尖擦過她臉頰時，留下的最後一點溫度。\n\n「均鑑……」她低聲喚他，聲音輕得像一聲嘆息，被風一吹就散了。\n\n沒有眼淚。\n\n她只是靜靜地看著那張照片，看著他永遠定格在二十二歲的臉。他不會再老了，不會再皺眉，不會再因為她哭而手足無措地擦她的眼淚。他永遠停在了那個吻之後，停在了轉身走向大海的那一步。\n\n而她，還要繼續往前走。\n\n宋賓宜站起身，拍了拍裙擺上的塵土。她沒有再回頭，只是將那張照片輕輕壓在墓碑下，用一塊從蘇澳海灘帶回來的鵝卵石壓住。\n\n石頭被曬得溫熱，像他還在。\n\n她轉身，走進那片斑駁的光影裡，腳步依舊輕盈，彷彿只是赴一場遲到的約會。\n\n風起，白鴿掠過陵園上空，翅膀劃破藍天，沒有留下任何痕跡。\n\n就像他從未離開，也從未回來。"
 CHI.CT.16.a: "親愛的，往前走，不要因我回頭"

 CHI.H4.111.t: "圖瓦問題"
 CHI.H4.111.d: "圖瓦共和國，如果你對歷史不太熟悉可能不知道這個國家，雖然它的領土比盧森堡要大得多，但夾在中俄兩國之間的它在歷史上沒什麼名氣，一般人很難注意到中亞地帶有這麼一個小國存在。\n\n現今的圖瓦共和國曾是唐朝時被稱為都波府的藩屬國，往後曾經被多個突厥國家與清朝掌控。辛亥革命後帝俄就嘗試在圖瓦策動獨立，在20世紀早期幾經易手，最後圖瓦共和國被併入蘇聯，蘇俄崩潰後成為俄聯邦的其中一個部分。\n\n圖瓦共和國本就是俄國趁著中華民國虛弱之際攫取而來的戰利品，現在復國之願近在眼前，我們必須趁著勢頭收回我們的舊有領土。\n\n好消息是，我方情報人員已經順利越過邊境進入圖瓦共和國境內，目前也已經與政界警界的內應接洽。只要我方下令，圖瓦當地武警便可立即控制政府與當地[tuva_old_owner.GetName]駐軍。\n\n不過我們北方的友好領居肯定不會就這麼善罷甘休，待我們完全控制圖瓦共和國後國軍必須迅速換防接替原來駐軍的防務工作，若是沒能擋住鄰居的軍事入侵，其後果不堪設想......"
 CHI.H4.111.a: "要謹慎的選擇時機才行"

 CHI.H4.112.t: "圖瓦衝突"
 CHI.H4.112.d: "現實從來不會留給我們一點喘息的時間，正當我軍正與圖瓦共和國的國防力量換防與接管軍事資產之際，來自北方的北極熊正虎視眈眈的盯著我們。雖然我們的間諜出奇不易地成功控制圖瓦共和國的軍政大權，但根基尚未完全穩固，那些反對中國統治圖瓦的異議分子還沒被完全控制起來，每多放縱他們一秒、我們的處境就多一分危險。\n從邊境上的騷動來看，他們確實透過某些我們不知道的管道聯繫上了援軍。剛剛開入圖瓦境內的車隊立刻改變方向直衝邊境，尚在整備後備援軍也馬上解除後勤任務進入戰備狀態。\n全圖瓦國境內立刻進入戒嚴狀態，現在邊防情況尚不明朗，也許對方只是單純的襲擾表達抗議也說不定?不過我們不能冒險，如果我們在這場邊經衝突中佔了下風，其後果將難以預測。"
 CHI.H4.112.a: "全軍進入最高戰備狀態！"

 CHI.H4.113.t: "圖瓦共和國是我們的了"
 CHI.H4.113.d: "當邊境的戰火停歇、當國軍戰士走出工事，他們看到的是一片白茫茫的雪景，鮮血與卡其色制服點綴著雪原，我們勝利了!士兵們從一箱箱補給品中翻出幾副國旗，在陣地周圍草草支起一座臨時旗桿把國旗掛上去，這些旗幟原本是拿來掛在圖瓦政府大樓跟軍事基地上的。\n在後方得知邊境安全後，國軍迅速解除戒嚴狀態並重新開放各級市政單位，圖瓦人民終於能鬆一口氣，專心慶祝來之不易的和平與統一。"
 CHI.H4.113.a: "中華秋海棠逐歸一統"

 CHI.H4.114.t: "圖瓦保衛戰失敗"
 CHI.H4.114.d: "失敗了，我們失敗了。當邊境的戰火停歇，當國軍戰士走出工事，迎著而來的只有同袍的遺體與滿地的瘡痍。我們失敗了，[CHI.GetLeader]總統過度自負地認為我們能夠對抗唐努圖瓦的控制者[tuva_old_owner.GetName]。\n在後方得知我國與[tuva_old_owner.GetName]停戰後，國軍默默地將同袍的遺體，連同其裝備，草草地裝上了卡車，準備運回國境之內。也許我們應該感謝[tuva_old_owner.GetName]的仁慈，願意讓我們替國軍士兵收屍。\n也許唐努烏梁海，或者說圖瓦的人民、土地，終究不能屬於中華民國。"
 CHI.H4.114.a: "丟人現眼"

 CHI.H4.115.t: "雙方停火"
 CHI.H4.115.d: "經過山地隘口中連續數日的鏖戰後，靠著國軍弟兄的浴血奮戰，那些準備不足、補給告急的[tuva_old_owner.GetName]軍隊隨著惡化的山區天氣，最終被迫從邊境河谷中撤退。而在蒙受大量損失後，我方前線也終於獲得寶貴的窗口期，得以在這片暫時平靜的盆地中率領餘軍後撤，重整殘部。\n\n儘管圖瓦情勢如今轉危為安，但考慮到暫時撤離的[tuva_old_owner.GetName]軍隊隨時可能反撲，我方仍須謹慎戒備前哨形勢，一刻不得鬆懈..."
 CHI.H4.115.a: "厲兵秣馬，枕戈待旦..."

 CHI.TW.21.t: "港澳的要求"
 CHI.TW.21.d: "在我國重新控制大陸南方地區後，香港和澳門的領袖人士，如香港的黎智英先生，梁家傑先生，何俊仁先生，澳門的何一誠先生等意見領袖人士，向中華民國政府提出了希望能成為自治市的請求。\n\n在進行研討後，[CHI.GetLeader]總統拍板道：「我國是一個民主的國家，地方自治在民主社會中早有先例，我國也有原住民自治的經驗。我們不能像是獨裁政權一樣完全忽視當地民意，香港和澳門有他們自己獨特的歷史文化地位，強行與中國融合會怎麼樣，共產黨已經給我們做過了演示。當然，如果香港和澳門想和盧森堡，聖馬力諾一樣獨立是絕對不可能的，但是我們可以給予他們和歷史上的歐洲自由市一樣的地位。當然，我們是民主的社會，一切還是要以民眾的想法為主，在兩地各舉行一場公投活動吧，如果當地民眾都如此希望，我們也不會拒絕。」\n\n在[CHI.GetLeader]總統拍板後，很快在兩座城市舉辦了各一場投票活動。"
 CHI.TW.21.a: "靜候佳音。"
 
 CHI.TW.211.t: "民主自治"
 CHI.TW.211.d: "香港以67%通過了自治權的請求。澳門更是達到了99%，這被分析人士認為是澳門的賭場城市生態位讓澳門人更加渴望自治。\n\n隨後立法院和[CHI.GetLeader]總統很快通過了香港和澳門提交的自治請求，讓兩市成立自己的管理機構與議會，這讓港澳民眾深刻感受到了我國與中共的不同，對中華民國的認同感更加深厚。"
 CHI.TW.211.a: "民主萬歲！"

 CHI.H4.93_news.t: "中華民國入侵蒙古"
 CHI.H4.93_news.d: "就在今日稍早，中華民國軍隊無預警打擊蒙古境內多處軍事與民用設施，位於邊境的裝甲部隊無視警告，迅速推進越境。與此同時，中華民國政府各部會首長緊急召開聯合記者會，並於電視、YouTube 和 Bilibili 等多媒體平台上同步直播。會中外交部官員聲稱：「為了光復中華民國，蒙方必須歸還自民國建國以來非法侵占的領土」；國防部發言人則表示，只要蒙古政府願意和平移交遭侵占之領土，中華民國將立即停止一切軍事行動。\n\n各國對此軍事入侵行為表示強烈不滿。日本與韓國外交部在第一時間分別召開記者會，嚴厲斥責中華民國對主權國家的侵犯，但目前尚未得知日、韓等國是否會採取進一步的反制措施。\n\n目前各國政府已無法聯繫位於蒙古首都烏蘭巴托的外交使團，多家新聞媒體仍在想方設法聯繫派駐當地的特派記者。有學者擔憂，此次入侵行動恐是中華民國對外擴張的首次試探……"
 CHI.H4.93_news.a: "中國從來都沒有變"

 CHI.H4.xizang_war_news.t: "中印戰爭爆發"
 CHI.H4.xizang_war_news.d: "大亞洲的戰火沒過多久，在南亞又點燃了一場新的烈焰。先前通力合作擊敗中共的中華民國與印度又因西藏地區的領土爭端陷入衝突，我們尚未得知是哪一方先開的火，中印雙方的發言人均指責對方才是首先開火的入侵者，自己只不過是為了保護領土而做的正當防衛。\n\n太約嘗試呼籲雙方立即停火，但中印兩方均未對此做出回應。這場牽涉超過30億人口的全面戰爭，沒人知道會走向何方。"
 CHI.H4.xizang_war_news.a: "新仇舊恨算不完呀..."

 CHI.TW.1.t: "無言傾訴的遺憾"
 CHI.TW.1.d: "夕陽西下，斜斜的陽光照舊灑落在這塊小小的彈丸之地上，此時通常是高中生放學的時候，三三兩兩的情侶手牽手，襯衫包裹青澀的情感與愛意。朱敏宣永遠記得那個男生的手，每次鐘聲一響，她總是一把抓起書包衝向校門，為的就是能夠第一時間找到他。\n\n敏宣總是盼著能跟他永遠逃離這個考卷跟課本構成的囚籠，她放下沙包，舉起袖子擦了擦汗，當年白色的學生服成了綠白相間的野戰軍服。敏宣以一種令她怎麼想也沒想到的的方式回到她的母校，當年學測失利的她被家人送入軍校入伍，那位男生北上讀書去了，相隔兩地過後兩人很少再聯絡，不知道他過的怎麼樣？\n\n她在學校各個出入口堆好大量沙包，奉連長之命清出剩餘教室的課桌椅，一部分搬到臨時連指揮部、剩下的當作街壘扔到路上充當路障。天色漸漸黯淡，最後一間教室終於整理完了！敏宣長舒一口氣，餘光卻在桌椅堆瞥到一抹異樣的白，在微弱的路燈下是如此顯眼。她撿起那個東西，是一封信，上面只寫了三個歪歪扭扭的大字：給敏宣\n\n敏宣知道自己不應該在備戰之時閱讀書信，但她還是忍不住拆開信封，裡面是熟悉的字跡，每次抄作業時她都沒少抱怨過這種瀟灑的「文筆」。\n\n讀到一半，敏宣發現大半信件早已濕透，淚水和汗水混雜著情感在此刻宣洩而出，當年來不及表達的情感現在才被發現⋯⋯\n\n導彈落地的爆炸將她狠狠甩到牆上，她無力地攤在地上、手中信件滑落、視野染上一層暗紅、敏宣的意識逐漸模糊……過去因為害羞而不敢坦承的愛意...可能也永遠無法得到兌現"
 CHI.TW.1.a: "時代的灰塵，是一個人頭上的一座山"

 CHI.TW.2.t: "青天濁"
 CHI.TW.2.d: "黃先任眼神複雜的看著螢幕上傳來的倖存國軍將士們登上撤離載具的畫面。他知道，這一天終於是到來了，看來他不得不離開金門，這片他守護了不知歲月的國土，中華民國長達七十餘年的統治即將結束，對於金門國民的撤離已經先一步完成，還有部門國民不願離開故土，拒絕撤離，願與金門共存亡。\n\n\"報告，金門留守國民，他們自發……\"\n\n\"自發什麼？\"黃先任轉過頭來看著負責撤離的將官前來報告。\n\n\"他們自發舉行了升旗儀式，並手舉國旗送別國軍同志們。\"\n\n\"讓他們送吧，金門經歷了共軍登陸，八二三砲戰，一直作為反共第一線，金門的歷史是曲折但光榮的，也許，這一次……\"\n\n黃先任終是沒有說出口，也許這次撤離，是永別金門，中華民國也許自此與大陸完全劃分開來，血緣親情為紐帶的兩岸關係，已經隨共軍的炮火硝煙中化為無限的仇恨。\n\n\"他們，他們把國旗倒掛過來了！\"\n\n\"什麼？！\""
 CHI.TW.2.a: "白日降…"

 CHI.TW.3.t: "共軍襲來"
 CHI.TW.3.d: "清晨尚未完全破曉，警報聲已劃破寧靜。雷達顯示異常活動，隨後而來的是接連不斷的飛彈預警與通訊干擾。短短數分鐘內，各地防空系統全面啟動，軍事基地進入最高戒備狀態。\n\n對岸部隊開始大規模行動，空中與海上力量同步推進，戰爭不再只是推測，而是已經發生的現實。\n\n沿海與外島率先承受壓力。通訊回報斷斷續續，部分前線據點已與指揮體系失去聯繫。港口與機場進入緊急運作模式，民航全面停擺，交通節點迅速轉為軍事優先。\n\n城市之中，防空警報此起彼落。民眾湧入避難設施，學校停課、企業停工，整個社會在極短時間內轉入戰時節奏。資訊混亂與不確定性蔓延，人們試圖從零碎消息中拼湊局勢發展。\n\n國家已進入戰時狀態，所有相關單位全面動員，呼籲民眾保持冷靜並配合指示。\n\n日本與澳大利亞開始啟動協同防衛機制，區域內的軍事與外交活動急遽升溫。太平洋防禦條約（PDTO）面臨成立以來最嚴峻的考驗。\n\n多年來的準備與預想，終於在此刻接受檢驗。\n\n無論結果如何，這一天都將改變這座島嶼的未來。"
 CHI.TW.3.a: "海峽沸騰"

 CHI.TW.4.t: "非常時刻的團結"
 CHI.TW.4.d: "隨著臺海局勢急遽惡化，戰爭陰影籠罩全島，原本在國會與街頭激烈對立的各主要政黨，逐漸意識到這場危機已超越日常政治競爭的範疇。\n\n在外部威脅步步逼近之際，長期的內部分歧開始顯得不合時宜。無論是執政黨還是在野勢力，彼此之間雖仍存在理念差異與歷史積怨，但面對可能到來的全面衝突，分裂只會削弱整體防衛能力。\n\n在多方斡旋與壓力之下，各黨領袖終於坐上談判桌。經過數日協商，政府宣布成立「戰時聯合政府」，部分在野人士將進入決策與監督體系，共同參與國防、經濟與民生相關政策的制定。\n\n街頭氣氛開始出現微妙變化，原本在評論區吵得不可開交的各黨支持者漸漸將彼此的矛盾放下，去對抗真正的敵人。民眾對政黨願意放下對立表示肯定，認為這是成熟民主在危機中的展現。\n\n當外在威脅逼近，各黨的分歧已不再重要。"
 CHI.TW.4.a: "聯合各黨..."

 CHI.TW.6.t: "動員預備役"
 CHI.TW.6.d: "警報來得毫無預兆。\n\n在短時間內，大量飛彈自對岸升空，精準打擊港口、機場、鐵路樞紐與主要工業設施。爆炸與停電幾乎同時席捲全島，交通網絡陷入癱瘓，部分地區通訊中斷，工廠被迫停擺。\n\n這是一場經過精心計算的「先制癱瘓」。敵方意圖在戰爭正式爆發前，削弱我方動員能力與後勤運作，使國家在最關鍵的時刻失去反應速度。\n\n面對突如其來的打擊，政府在召開緊急會議後宣布:\n\n全面啟動預備役動員機制。\n\n全國各地的後備軍人陸續接獲通知。有人正在工作崗位上，有人剛回到家中，也有人還未從第一波爆炸的震撼中回過神來——手機訊息、廣播與地方單位通知同時發出，要求其依指示前往指定集結地點報到。\n\n動員並不順利，道路中斷、鐵路停駛、部分地區油料短缺，使集結過程比預期更加困難。地方政府與軍方緊急協調替代路線，動用一切可用資源，試圖將人員送往仍能運作的基地與臨時集結點。\n\n恐慌與不安在初期蔓延，但也有越來越多人意識到，這不再是單純的威嚇行動。街頭出現協助指引交通的志工，企業開始配合政府調度，民間力量自發填補制度尚未恢復的空隙。\n\n盟友方面亦密切關注局勢。情報交換頻率顯著提升，區域內軍事動態急遽升溫。所有跡象都顯示，這場衝突正朝著無法逆轉的方向發展。\n\n中國的行動已經遠遠超出了軍事演習的範圍，現在全臺灣無論誰都知道:\n\n戰爭已經不遠了"
 CHI.TW.6.a: "風暴將至..."

 CHI.TW.9.t: "復興中華"
 CHI.TW.9.d: "中華民國終於贏得了台海戰爭的勝利，我們已將中共企圖染指台海的魔爪砍斷，雖然中共會在接下來捲土重來，但是我們已經贏得了暫時喘息時間，我們已成功給中共的統治以沉重的一擊。國軍凱旋，國民歡慶，台灣的民主自由在這一刻無比堅固，而海峽對岸的共軍只能默默吃下戰敗的苦果。在戰爭得勝的佳音降臨時，我們的國際地位已經提高，中華民國在聯合國被中共替代的恥辱已然雪恥。\n\n日本國即日起宣布與中華民國建交，澳大利亞和紐西蘭等我們忠實的朋友也緊隨其後承認中華民國為獨立主權國家的國際地位，雖然要爭奪中國的合法代表權仍然困難，但是中華民國已經在國際社會邁出了一大步！"
 CHI.TW.9.a: "從今以後，南韓北韓，南華北華"

 CHI.TW.10.t: "真正的中國"
 CHI.TW.10.d: "我國即日起承認中華民國的主權國家的獨立地位，承認中華民國擁有中國唯二合法的代表權，支持中華民國以觀察成員國身份加入聯合國，支持中華民國恢復自1971年失去的部分權利……」\n\n「抱歉，我要打斷一下，不是加入聯合國，而是恢復中華民國在聯合國地位，我們本就為聯合國常任理事國及被寫進《聯合國憲章》的創始會員國之一，中華民國自1912年起，就為中國的合法代表，且一直都是」"
 CHI.TW.10.a: "「真正的中國」"

 CHI.TW.11.t: "可靠的盟友"
 CHI.TW.11.d: "中國解放軍已經搶占了金門，對台灣的攻擊已經勢在必得，無可避免了，我們做好了一切準備，在這最危急的時候，我們的盟友，提供了最强而有力的支持，日本自衛隊已經來到了台灣，與國軍一同進入防禦陣地，澳大利亞的軍隊雖然還未到來，但是民用物質和軍火在源源不斷的來到台灣，在這危機的關頭，盟友的幫助，仿佛為台灣注入了一支强心針，堅定了台灣的信念。"
 CHI.TW.11.a: "太平洋友誼萬歲"

 CHI.TW.13.t: "撕裂的社會"
 CHI.TW.13.d: "戰爭結束了，但仇恨卻絲毫沒有消停。\n\n在長期戰爭與經濟蕭條的影響下，社會中累積的敵意開始尋找出口。部分情緒激烈的群體，將矛頭指向在台生活的陸籍配偶與其家庭。他們被懷疑、被標籤，甚至被視為潛在的「內部威脅」。\n\n零星衝突最初只是言語對立與騷擾，但很快升級為更嚴重的暴力事件。街頭攻擊、財產破壞、網路上的人肉搜索與仇恨言論接連出現，部分地區甚至出現有組織的排斥行動。對許多原本只是普通家庭成員的陸配而言，戰爭結束後的生活反而變得更加危險與不確定。\n\n執法單位開始加強巡邏與干預，並對涉及暴力的行為展開調查與逮捕。官方呼籲社會冷靜，強調任何形式的私刑與集體仇視都不被允許。然而，部分輿論仍持續煽動，質疑政府是否過於寬鬆。\n\n社會輿論出現明顯分裂，有人主張應該採取更嚴格的審查與限制措施，以防範潛在風險；也有人強調，將整個群體視為敵人只會重複戰爭邏輯，並侵蝕社會原有的價值基礎。\n\n國際社會亦在關注相關發展，人權組織呼籲政府應保護弱勢群體，避免報復性行為擴大；日澳盟友則關注這類事件是否會影響戰後重建與政治穩定。"
 CHI.TW.13.a: "民族主義者就不能消停一會嗎!"

 CHI.TW.8.t: "再一次踏上世界舞臺"
 CHI.TW.8.d: "戰後的臺北街道上，一片廢墟中，在原來的中山北路三段的路段上，兩座新建成的莊園正在一片廢墟中聳立著，這正是重新設立的日本國駐中華民國大使館和澳大利亞駐中華民國大使館。在臺海戰爭開始后，兩國與中華民國重新設立了大使級外交關係，原來的日台交流協會和澳大利亞辦事處人員被任命為大使館外交人員。在戰後的修復計劃中，政府部門決定優先在1972年斷交以前的大使館原位上重建大使館，這將代表我們擺脫了中共的外交封鎖，再一次踏上世界的外交舞臺。兩國的大使在同一天一同舉辦了一場盛大的儀式，慶祝大使館的正式成立與運行，總統也出席了該儀式，表明了太約國家的友誼與團結，感謝兩國在戰爭和恢復中的幫助。\n\n在這兩座大使館旁邊，傳統友邦巴拉圭的大使館也在緊鑼密鼓的進行重建，中山北路，將再一次成爲臺北的外交街區。"
 CHI.TW.8.a: "中華民國再一次踏上世界舞臺"

 CHI.TW.18.t: "少子化危機加劇"
 CHI.TW.18.d: "戰爭結束了，但它留下的影響遠比我們想像的嚴重。\n\n在漫長的臺海戰爭中，大量人口傷亡、家庭離散與經濟停滯，使原本便已嚴重的少子化問題進一步惡化。許多正值生育年齡的年輕人不是奔赴戰場，就是在戰火中失去家園與穩定的生活；戰後的重建壓力與高昂生活成本，更使無數家庭將生育計畫一再延後。\n\n曾經人口稠密的城鎮開始出現空置住宅，偏鄉地區更面臨學校裁撤與醫療資源不足的困境。戰爭造成的人口損失與移民流動，使臺灣的人口結構出現更加嚴重的斷層，未來數十年內，能夠進入勞動市場的年輕人口將大幅減少。\n\n若不盡快遏制這一趨勢，台灣社會恐怕會在下次危機到來前就土崩瓦解。"
 CHI.TW.18.a: "國家在流血..."

 CHI.TW.22.t: "控制南海諸島"
 CHI.TW.22.d: "隨著臺海戰爭以中國戰敗告終，中國軍隊開始倉促撤離台澎金馬。原本部署於沿海地區的攻台部隊正在重新調度，大量軍事資源被調往其他地區，以控制住國內混亂的局勢。\n\n然而，戰敗帶來的影響不止軍事上的失利，中國國內政局陷入前所未有的動盪，各派勢力爭奪權力，中央政府對地方與海外領土的控制能力急劇下降。曾經看似牢不可破的防線，如今正隨著政局混亂而逐漸虛弱。\n\n太約的決策者們很快注意到了這一點，南海諸島的控制權將使太約能夠進一步掌握南海航線和牽制中國在南海的軍事活動，因此太約不打算錯過這不可多得的時機。\n\n在行動開始前，太約艦隊已經對島上軍事設施展開長時間的密集砲擊，猛烈的艦砲火力摧毀了多處防禦陣地與通訊設施，使島上守軍難以組織有效抵抗。\n\n隨後，國軍部隊在日澳海空力量掩護下展開登陸。與臺海戰爭中的慘烈戰況相比，這次行動幾乎可以稱得上順利。失去中央支援的中國守軍無力組織大規模反擊，部分部隊選擇撤退，另一些則在抵抗失敗後放下武器。\n\n北京方面則因為注意力放在穩定政局與鎮壓西部叛亂而無暇顧及南海諸島，除了進行簡單的譴責外並無其他動作。"
 CHI.TW.22.a: "時隔七十三年，我們終於回來了"

 CHI.TW.23.t: "山雨欲來風滿樓"
 CHI.TW.23.d: "北京，第二十次全國代表大會正式召開。\n\n全世界都在等待一個答案，經歷多年緊張的臺海局勢、日益升高的軍事對峙，以及國際社會不斷增加的警告，仍有人相信，或許兩岸仍存在一條和平解決的道路。只要權力結構出現變化，只要新一代領導人願意重新思考兩岸關係，這場危機或許仍有機會在最後一刻被化解。\n\n然而，會議結果很快給出了答案，習近平以壓倒性的票數再次獲得最高領導地位，打破過去長期存在的政治慣例，而中國的政治方向也變得更加明確。\n\n對台灣而言，這意味著什麼已經不言而喻。過去幾年，中國不斷增加軍事壓力，對台灣的外交空間進行打壓。如今，隨著最高權力結構完成重新整合，任何期待中國透過政治轉型而改變對台政策的希望徹底幻滅，習近平毫無疑問將會趁第一島鏈最為虛弱的時候嘗試完成他的「中華民族偉大復興」。\n\n長達七十年的兩岸局勢已經邁入了最後階段。\n\n無論如何，戰爭已不可避免。"
 CHI.TW.23.a: "風暴將至..."

 CHI.TW.24.t: "嚴密防空"
 CHI.TW.24.d: "總統閣下，我國在近日遭到共產黨飛彈襲擊，解放軍火箭軍部隊對我國的指揮部，軍工廠，軍事機場，交通樞紐等關鍵地區進行了飛彈轟炸。但近日投入特別資金進行的重點地區防空網強化起了效果，飛彈打擊效果被極大削弱，想必是沒有達到共產黨的預計目標"
 CHI.TW.24.a: "「天佑臺灣」"

 CHI.TW.25.t: "北京，還是北平?"
 CHI.TW.25.d: "北京終於回到了我們的手中。\n\n在漫長的戰爭與動盪之後，這座古老的城市再次迎來新的政權。街道上的旗幟被重新掛起，曾經緊閉的商店陸續開門，人們小心翼翼地走上街頭，試圖適應這個嶄新的時代。\n\n然而，一個看似簡單的問題，卻引起了民間的爭論。\n\n這座城市，究竟應該繼續叫「北京」，還是恢復「北平」？\n\n支持改名的人認為，「北京」這個名稱與中共政權有著太深的聯繫，恢復「北平」象徵著這座城市告別過去，重新成為一座屬於人民的都市。\n\n但並非所有北京市民都支持改名。\n\n「我從小就在北京長大。」\n\n「對我們來說，這裡就是北京。改了名字，難道我們的記憶也要跟著改嗎？」\n\n一名老人在接受採訪時說道。\n\n年輕人之間也出現類似的爭論。有人認為改名「北平」能徹底與過去告別，也有人認為，名稱本身並不能象徵共黨政權。\n\n地方政府因此陷入兩難。\n\n改名可以成為新時代的象徵，卻也可能讓部分居民感到自己的生活記憶遭到否定；維持「北京」則意味著延續一個已經充滿政治象徵的名稱。\n\n最終，中央政府在收集各方意見和民意調查後決定——"
 CHI.TW.25.a: "改名「北平」，邁向新時代"
 CHI.TW.25.b: "原名，尊重歷史傳承"

 CHI.TW.27.t: "美國撤僑 - 機場故事"
 CHI.TW.27.d: "美國大洛杉磯地區，本地的蒙特利公園地區，鑽石吧以及羅蘭崗是西海岸主要的臺灣華人聚集地。在國會拒絕交涉，美國內部各團體公然分裂後，各國便開始了撤僑行動，我國當然也不例外。\n\n但我國雖然在美國有諸多航班與船運，但我國在美國沒有像其他各國使館武裝部隊那樣可用的武裝力量，我國海軍也無法前往美國進行護航，所以我國只能使用民用船隻與航班來進行初步撤僑，並與日韓甚至大陸商量與他們的撤僑部隊一同前往美國的事宜。\n\n安大略國際機場，兩架中華航空的班機上，機長張威武正拿著扳手從座位的底下卸下固定螺絲，機上的每一位男性都在做著同樣的事情。當座位可以被搬走後，兩位空姐便過來，將座位搬到機艙口直接丟下去。而每一次座位砸到地上，都會發出一片微小的歡呼的聲音，這是留在機場的臺灣僑民發出的聲音。他們知道，每拆下一個座位，就代表兩個人可以登上飛機。終於，機長發出了可以登機的指令，機組人員和幾位自願幫忙維持秩序的膀大腰圓的當地華人黑幫成員協助僑民登機，雖然有發生如想帶著自己全部身家登機的，鬧著要把自己的電腦機箱帶上飛機的，站不起來只能躺在擔架上一個人佔三個人的地方的老人的等諸多麻煩人物，但絕大多數人還是以一個井然有序的狀態登上了飛機。"
 CHI.TW.27.a: "歡迎回家"

 CHI.TW.28.t: "美國撤僑 - 港口故事"
 CHI.TW.28.d: "洛杉磯港和長灘港。這倆座洛杉磯最繁忙的港口，有著極多臺灣長榮公司的貨運船隻和MSC地中海郵輪等有著臺灣航線的郵輪公司，所以這倆座港口自然成為了包括我國在內世界上許多國家海上運輸撤僑的重要據點。但是正是因為如此在洛杉磯大亂後瘸幫和血幫這兩個本地幫派早已盯上了這個地方。有著各國使館武裝部隊保護的地區還好，我國在美國沒有武裝部隊只能以持槍的退伍老兵和政府緊急僱佣的本地僱傭兵來保護撤僑區。\n\n老威今年正好60，實際上昨天應該是他的六十大壽，他是一位經驗豐富的退役老軍官，在退役來美國投奔女兒，在美國大亂後，他的六十歲生日宴會也大了水漂，他和女兒外孫來到撤離區，發現當地雖然有些退伍老兵和僱傭兵拿著武器維持秩序與阻擋黑幫，但毫無秩序和記錄可言。而且老兵和僱傭兵之間還互相看不順眼。他不畏老的站了出來，先以自己的資歷和能力折服了老兵群體，然後又和僱傭兵的隊長達成了協議，雙方終於達成協議一起保衛撤離區。這一週以來已經有七八艘船離開了海岸，但是這裡仍然有著一萬多名華人在這。老威站在圍牆邊上，望著被黑幫摧殘的城市，重重的嘆了口氣，也許是為了自己呆了快十年的這座城市。\n\n老威低下頭，準備掏出煙盒抽支菸，突然他感到頭頂一疼，然後才聽見了槍聲。他立馬反應過來剛剛一顆子彈搽著自己的頭皮過去了，如果沒有恰到好處的低頭，他恐怕已經死了，他立馬往旁邊的水泥牆後面爬去。他爬到牆後周圍早就開始槍聲大作，他顧不上頭頂流下的鮮血探出頭一看，似乎是血幫對這片撤離區發起了攻擊。他們早就盯上這片有大量富裕華人停留，然後又沒有正規武裝力量保護的撤離區，他們這次居然安排了狙擊手和攜帶了榴彈發射器，恐怕他們應該是攻破了警局或者國民警衛隊的軍火庫。\n\n老威他們只有輕武器，最重的火力是一支老舊的M60輕機槍，而且備彈也不多，老兵和僱傭兵們一個個倒下，原本有六十多人的撤離區護衛隊只剩下最後24個人。而血幫又一次準備發起進攻，正在稍遠處集結。\n\n就當老威他們準備決一死戰之時，天空中傳來螺旋槳的聲音，一架S-70C直升機從地平線飛來,過了一分鐘從地平線傳來轟隆聲，幾發艦炮炮彈將集結中的幫派分子炸的七零八落，其他運氣好沒死的人也嚇得一哄而散。老威雖然老了，但是眼神還行，他似乎在直升機的尾翼上看見了熟悉的旗幟。他想起敦睦遠航訓練支隊好像最近正在馬紹爾群島共和國，如果政府收到美國分裂的情況立馬下令後似乎確實差不多這個時候趕到。\n\n當飛機飛離的幾分鐘後，地平線上出現了一支龐大的船隊，這支由十幾艘各式船隻組成的足以帶走所有人的艦隊在三艘掛著青天白日旗的驅逐艦護衛下向著海灣駛來，撤離區的碼頭上爆發出如雷的歡呼之聲。"
 CHI.TW.28.a: "向港口保衛者致敬"

 CHI.TW.29.t: "非國民問題"
 CHI.TW.29.d: "總統閣下，我們已經將我國國民全部裝載上撤離船隊，將沿著洛杉磯-夏威夷-日本-臺灣的路徑回國，但我們的撤離船隊的等候人群中，有大量非我國國民的華人也在其中，希望能一起撤離，裡面包括大陸人香港人澳門人甚至已經持有美國國籍的海外華人。撤離艦隊詢問是否要將其他華人一起撤離？如果將一些物資丟下海，並縮減人均空間或許船隊可以將所有人一起撤離。"
 CHI.TW.29.a: "別管護照顏色了，大家都是同胞。"
 CHI.TW.29.b: "救臺灣人就好"

 CHI.TW.30.t: "台北戰鬥報告"
 CHI.TW.30.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\n致：國防部暨參謀本部\n\n今日淩晨，共軍在大規模炮火與無人機壓制下，對台北市區發動全面攻勢。敵方主力自淡水河口及新莊方向突破外圍防線，並對關渡、社子一帶實施強渡行動。市區通信與電力設施接連遭到打擊，松山機場與周邊陣地陷入持續火力覆蓋。日本自衛隊協同我方裝甲與機步部隊，在士林、內湖一線組織反擊；韓國志願部隊則固守中山、萬華街區，掩護民眾撤離。\n\n盡管各部頑強抵抗，多處橋梁與交通樞紐已依計劃實施破壞，然敵軍兵力與火力優勢明顯，逐步切斷城區之間的聯系。我軍指揮體系在密集打擊下受到嚴重幹擾，補給線亦遭分割。至傍晚時分，市政核心區與總統府周邊陣地相繼失守，殘餘部隊向陽明山及南港丘陵地帶轉進，準備依托山區繼續抵抗。\n\n基上所述目前台北市區已告失陷。各參戰單位正重整編制，以待後續作戰命令。"
 CHI.TW.30.a: "轉進山區，繼續抗敵"
 CHI_taibei_invade2_tt: "§R預計台北遭受以下損失§!"

 CHI.TW.31.t: "台中戰鬥報告"
 CHI.TW.31.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\n致：國防部暨參謀本部\n\n自昨夜起，共軍集中遠程火力與空中突擊力量，對台中地區實施持續壓制，並自海線與大甲溪方向展開穿插推進。敵軍迅速奪取清泉崗機場外圍陣地，隨後以裝甲與機步部隊沿市區高架幹道南壓，意圖分割我方防御體系。日本自衛隊分遣隊協同我軍守備部隊固守港區與工業區核心設施，澳大利亞國防軍則在大肚山一線構築反裝甲陣地，掩護主力調整部署。\n\n交戰期間，市區通信頻繁中斷，部分橋梁與交流道依計劃爆破，以遲滯敵軍推進。然而敵方火力優勢顯著，多路並進逐步壓縮我軍防御縱深。清泉崗機場與港區設施相繼失守，市政核心區在持續炮擊下陷入混亂。至傍晚，敵軍完成對城區的合圍，我軍指揮鏈受損嚴重，補給線被切斷。\n\n基上所述目前台中市區已告失陷。各參戰單位正向大雪山與中央山脈西麓轉進，依托山地地形重整戰力同時與友軍保持協同，以待後續作戰指示。"
 CHI.TW.31.a: "存人失地，人地皆存在"
 CHI_taizhong_invade2_tt: "§R預計台中遭受以下損失§!"

 CHI.TW.32.t: "高雄戰鬥報告"
 CHI.TW.32.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\n致：國防部暨參謀本部\n\n今晨，共軍在遠程火力與海空兵力協同下，對高雄地區展開總攻。敵艦於外海實施壓制射擊，無人機與導彈持續打擊港區油庫、通信節點及左營周邊陣地。我軍與澳大利亞國防軍聯合部隊依托港區倉儲設施、城市幹道與壽山高地構築防御，試圖以縱深陣地消耗敵軍兵力，並掩護重要設備轉移。\n\n交戰數小時後，敵軍裝甲與機步部隊自楠梓、鳳山方向穿插推進，逐步切斷城區聯系。港區多處設施在炮火中起火，跨港橋梁依預案爆破，然仍難阻敵軍持續壓迫。澳軍分隊在大寮一線實施反裝甲阻擊，我軍守備部隊則於市政核心區展開巷戰，戰況激烈，傷亡持續增加。\n\n至傍晚，敵軍完成對高雄港及市區主要行政設施的控制，我軍補給線全面中斷，指揮系統受損嚴重。\n\n基上所述目前高雄市區已告失陷。各單位正向旗山及中央山脈南段轉進，依托山地地形重整戰力同時與友軍保持協同，以待後續作戰指示。"
 CHI.TW.32.a: "大不了我們打遊擊去"
 CHI_gaoxiong_invade2_tt: "§R預計高雄遭受以下損失§!"

 CHI.TW.33.t: "花蓮戰鬥報告"
 CHI.TW.33.d: "\n\n\n                                              £GFX_MND_event_texticon3   \n\n\n\n\n致：國防部暨參謀本部\n\n今日清晨，共軍沿蘇花公路與海岸線方向實施多路突擊，並以遠程火力持續壓制花蓮港與機場設施。敵軍借助空中優勢與無人機偵察，對我方指揮節點與補給線進行精確打擊，戰場通信多次中斷。我軍守備部隊協同澳大利亞國防軍與日本自衛隊分遣隊，於港區、機場周邊及美侖山一線構築防御陣地，掩護市區民眾撤離，並嘗試遲滯敵軍推進節奏。\n\n隨著敵裝甲部隊突破北側防線，花蓮港主要泊位及機場跑道相繼失守。蘇花沿線多處橋隧在交戰中受損，交通體系全面癱瘓。日澳友軍於太魯閣方向實施掩護性撤退，我軍則在市區展開巷戰以爭取時間，然在持續火力壓制與兵力劣勢下，防線逐步被壓縮。\n\n基上所述至傍晚時分目前花蓮市區及關鍵設施已被敵軍控制。殘餘部隊正向中央山脈深處轉進，依托山地地形重整戰力同時與友軍保持協同，以待後續作戰指示。"
 CHI.TW.33.a: "守住就有辦法"

 CHI_hualian_invade2_tt: "§R預計花蓮遭受以下損失§!"
 CHI_hualian_invade3_tt: "§R行政院預估日後該地區重建將十分困難§!"
 CHI_hualian_invade4_tt: "§R政治局預估日後該地區重建將十分困難§!"

 CHI.TW.34.t: "三井倉庫"
 CHI.TW.34.d: "今日仍舊是烏雲密布的一天，照理來說，這時候的台灣應當是豔陽高照才對。汪銳金少校坐在自己的行軍床上看向窗外，手伸向床頭櫃那本軍綠色封皮的筆記本，順著書中紅線找到昨天寫的那一頁，入伍以前的他根本沒有寫日記的習慣，畢竟生活中能玩的東西多了去了，哪有那個美國時間寫日記呢?直到進入之後閒得發慌的他才開始學著寫日記。\n\n想到，這個偶然的習慣已經伴隨著自己走過十多年的軍旅生涯，在營中有甚麼樂的、好玩的他都有記下來，但大部分時候書頁裡承擔的都是委屈與痛苦，在今天也是如此。汪銳金拿出壓在枕頭下的那支鉛筆，距離解放軍進攻台灣已過數周，他帶領127旅第16步兵營奉命在前沿海灘附近的城區與工業區阻擊敵軍，最後收到的指示是上個禮拜旅部派發過來的堅守命令，他和他剩下的100多名弟兄集中在八輕工業區最邊緣的廢舊倉庫之中，數條聯外道路不是被灘頭部隊攻占、就是處在無人機的火力打擊範圍內，根本沒辦法輸送任何補給與傷員。\n\n汪銳金深吸一口氣、闔上筆記本，像是下定了某種決心，邊下樓邊思索該怎麼給剩餘的弟兄們鼓舞士氣，軍糧飲水見底、無線電的電池也是勉勉強強用到現在⋯⋯。三三兩兩躺在樓梯上的傷兵勉強擡起右手敬禮，在軍隊裡大夥有福同享有難同當，現在正是考驗信念的時刻，可嚴峻的戰損和缺乏補給讓汪銳金實在沒有臉面對他的部下。他微微點頭回禮，走到一樓倉庫，那些沒有站崗的士兵全都在這裡休息，彈藥箱和個人物品雜亂無章地散落在倉庫各處，只有一小塊區域用簾子簡單遮擋----那裏是參謀室。倖存的連長和排長都在這裡集合，少校站在桌前和軍官們商討戰略，其實走到這一部他們也沒有多少選擇:要嘛抵抗到底、要嘛放下武器投降。一開始的討論還算溫和，大家都盡可能地保持克制，不想讓基層士兵發現自己的長官內鬨導致士氣更為低落，但到後來兩方還是都沒能忍住破口大罵，髒話和排泄物迴盪在整座倉庫間，直到有位班長走進參謀室請示自己的佈防位置，他們才慢慢冷靜下來。\n\n「先生們......」少校在送走班長後才終於開口，「你們聽說過八百壯士的故事嗎?松滬會戰期間，謝晉元中校率領著餘下四百多名官兵堅守四行倉庫，與日軍激戰數日，國軍將士們在此多次抵擋日寇的瘋狂進攻，有位烈士甚至抱著手榴彈從倉庫一躍而下，與準備炸開大門的日軍同歸而盡。」\n\n所有人都沈默不語。「想想看，如果我們今天投降了，歷史會怎麼評價我們?後人會如何看待我們?!」汪銳金少校的斥責迴盪在倉庫裡，「我不知道你們是徵召來的還是志願服役，但在此時此刻，我們的土地正在被敵人無情地蹂躪著，難道你們願意在台灣最艱難的時刻選擇成為戰俘袖手旁觀，放棄抵抗嗎?!」\n\n汪銳金掀開參謀室角落的彈藥箱，裡面還存放著一些雷管和C4，「管他還剩多少人，就算只剩我一人!也得叫那些該死的共匪有去無回!讓他們知道，中華民國從來就沒有滅亡!你們要投降的隨你們去吧，我不會攔著，但要是你們願意為台灣獻出一切......」少校掃視著參謀室內的所有人，他們全都直勾勾地盯著他，全員的寂靜震耳欲聾\n\n一簇黑色的煙圈冉冉升起蒙在月亮上。那天晚上，混雜著解放軍撕心裂肺吼叫的，是視死如歸的黃埔將士們的坦然。"
 CHI.TW.34.a: "家書伴著北風飛向天堂；將士抱著敵人墜入地獄"

 CHI.TW.35.t: "黑夜"
 CHI.TW.35.d: "臺中的夜空被撕開，導彈飽和打擊過後，港區成了一片燃燒的廢墟。濃煙隨海風翻湧，刺鼻氣味壓得人幾乎無法呼吸。陳浩然從倒塌的貨櫃後撐起身子，耳中仍在嗡鳴，他擡頭望去，遠處機群尚未散去，引擎低吼在夜裡迴盪。\n\n張凱倫握著焦黑的步槍，手臂被彈片劃開，血沿著槍身滴落。「海軍陸戰隊撐不住了……直升機已經進內港。」她的聲音乾裂。\n\n李欣怡跌跌撞撞地跑來，懷裡的通訊機只剩雜音：「指揮部失聯，民防隊也散了。」她擡頭，眼裡既驚惶又倔強。\n\n忽然，空中傳來刺耳的呼嘯。白色傘花在火光映照下接連綻開，像從黑暗中墜落的影子。許子豪躲在斷牆後，盯著那些緩慢下沈的身影：「他們直接空降進市區了。」聲音壓得很低。\n\n街角的翻覆計程車旁，楊芷萱抱著受傷的母親躲進陰影，呼吸顫抖卻不敢出聲。她握緊手中的鐵管，指節發白。\n\n另一側，王承恩帶著幾名後備役守在炸毀的橋墩後，彈匣所剩無幾，呼吸急促。「再退一步，臺中就守不住了。」他低聲說，語氣幾乎逼近失控。\n\n降落傘接連落地，靴聲與槍聲同時響起。火舌撕開黑暗，街道深處傳來爆炸與崩塌的回響。\n\n「不能讓他們站穩！」陳浩然猛然起身，扣下扳機。槍火在黑夜中閃動，他的視線死死鎖住空中一個尚未落地的身影。子彈劃過夜色，那人影在空中失衡，直墜進燃燒的港區。"
 CHI.TW.35.a: "正被烈焰吞噬"

 CHI.TW.36.t: "迷惘"
 CHI.TW.36.d: "高雄港外圍，一處被炸塌一半的倉儲區，鋼骨裸露在夜色裡。火還在遠處燒，橘紅的光時明時滅，把整片廢墟照得忽暗忽亮。海風吹進來，帶著鹹味，也帶著焦味。\n\n三排九班縮在斷牆後休整。班長劉承業把步槍立在身旁，手指在彈匣上來回敲著，像在確認還剩多少子彈；列兵趙子昂坐在地上，背靠水泥塊，盯著自己靴子上的血跡發楞，那血不是他的。通訊員何嘉豪蹲在一旁，反覆調整電台旋鈕，耳機裡卻只剩斷續的雜音。\n\n「連部還沒回？」劉承業沒有擡頭。\n\n何嘉豪搖了搖頭：「只聽到幾段斷訊，說要繼續推進，之後就沒了。」\n\n趙子昂忽然開口，聲音發乾：「班長，我們今天到底拿下了哪裡？」他頓了一下，又補了一句，「白天那條街，我們走過去，又退回來……人卻少了一半。」\n\n劉承業沒有立刻回答。他看著遠處還在燃燒的貨櫃區，過了幾秒才說：「任務是清理港區阻力，打通通道。」語氣平直，像在背條令。\n\n趙子昂笑了一下，笑得很短：「可我只記得誰倒在我旁邊。」他低頭看手，「他們說這是統一，是必要的，可這裡的人也在拼命。」\n\n何嘉豪把耳機摘下，壓低聲音：「宣教裡說得很簡單，落地才知道不是那回事。」他看向兩人，「我們甚至不知道前面還有沒有自己人。」\n\n遠處突然傳來幾聲槍響，三人本能地壓低身子。沈默重新落下來。劉承業終於坐下，背靠斷牆，語氣比剛才更低：「命令沒有變，我們還得往前。」\n\n趙子昂沒有再問，只是把頭埋進臂彎。何嘉豪把電台關掉，省下一點電。\n\n黑暗裡只剩火光閃動。過了很久，劉承業低聲說了一句，像是在問別人，又像是在問自己：「如果前面什麼都沒有，我們還要走多久？」"
 CHI.TW.36.a: "繼續推進"

 CHI.TW.37.t: "花蓮"
 CHI.TW.37.d: "陸軍花蓮防衛指揮部第203旅殘部，代號『鐵拳』，現在只剩不到兩百人，散在七星潭到秀林的斷崖與廢墟間。我是連長林志偉，三十四歲，原駐佳山基地，如今那裡已成火海。\n\n清晨，兩棲登陸艇衝上沙灘，直升機自海面壓來。075型兩棲攻擊艦在外海開火，艦砲如雨落入市區。防空飛彈打掉幾架，但更多還是壓下來；空降兵直接落在機場跑道，我們的M109還沒轉向就被火箭彈擊毀。\n\n『守住七星潭！』旅長最後一聲命令後，無線電只剩靜電。\n\n戰鬥五小時後，沙灘滿是焦黑殘骸與屍體。我躲在一間被炸毀的飯店地下停車場，身邊是日澳混編小隊——日本中尉高橋翔負傷在牆角，彈藥見底；澳洲軍士長麥可·雷恩轉著最後一枚手榴彈，苦笑著問我們還能撐多久。我沒有回答，只盯著手機裡淩晨那句：『爸媽在地下室，保重。』\n\n敵軍再度推進，步兵戰車碾過沙灘。我們僅存的火箭筒擊毀一輛，爆炸碎片卻也帶走兩名弟兄。\n\n我下令撤退，但已無路可退。高橋翔單手舉槍衝出，很快倒下；麥可拉開拉環，也衝進火線，爆炸聲隨後傳來。\n\n剩下十幾人，有人哭，有人發呆。直升機低空掃射，入口坍塌，我們被困在塵土與碎石中。無線電沈默，只剩斷續慘叫。\n\n子彈打光後，我丟下步槍，握著戰術刀坐在牆邊。外頭腳步逼近，喊話器反覆命令投降。我閉上眼，想起家人、台北夜市，還有那片曾經明亮的花蓮天空，如今只剩煙火與灰燼。" 
 CHI.TW.37.a: "恍惚間想起了家人" 

 CHI.TW.38.t: "逆行"
 CHI.TW.38.d: "台北的街區已經失去原本的秩序。警報聲斷續響起，遠處傳來爆炸的回音，煙霧沿著樓宇之間蔓延。路口的臨時防線被壓得節節後退，幾名國軍士兵躲在翻覆的車輛後方，子彈打在鋼板上發出刺耳的聲響。\n\n「彈藥不多了！」林志遠壓低聲音，手指快速換上最後一個彈匣。\n\n一旁的陳奕廷探頭看了一眼街角，立刻縮回來：「他們在包過來，再撐不住就要斷線了！」\n\n就在火力最密集的時候，遠處忽然傳來引擎聲。幾輛車強行衝進街區，剎車聲劃破空氣。車門一開，一隊人迅速下車展開隊形。\n\n最前面的那人穿著防彈背心，沒有多餘的裝備，卻站得筆直。\n\n「援軍到了！」有人喊出聲。韓國瑜大步走進火線，沒有停下。他掃了一眼四周的陣地，語氣直接：「防線別散，火力往兩側拉開！」\n\n林志遠楞了一瞬，隨即回過神，立刻照做。原本混亂的射擊開始有了節奏，幾個關鍵位置重新被壓住。\n\n敵方火力還在逼近。韓國瑜沒有退到後方，而是直接蹲下，接過一把步槍，對著街口連續射擊。槍聲清晰而穩定，壓住了對面一瞬的動作。陳奕廷忍不住看了他一眼：「你——」\n\n「現在沒什麼你我。」韓國瑜沒有回頭，只是簡短地說了一句，「站穩。」\n\n他換彈、再射擊，動作並不花俏，但沒有停頓。周圍的士兵逐漸穩住呼吸，跟著節奏壓制火力。\n\n街道另一端的敵人開始後退，原本被逼近的距離重新被拉開。煙霧之中，視線仍然模糊，但槍聲已經不再混亂。韓國瑜站起身，掃了一眼四周，聲音不高，卻傳得很清楚：「記住，現在我是你們的將軍。」\n\n林志遠重新握緊步槍，與身邊的人對視一眼，然後一起把火力壓向前方。"
 CHI.TW.38.a: "撐住防線"

 CHI.TW.39.t: "迷失"
 CHI.TW.39.d: "幾個月過去，台灣戰火沒有完全消失，只是被拉得很遠。偶爾傳來的爆炸聲隔著山谷回蕩，像遲來的雷。\n\n趙子昂躲在一間勉強修補過的山中木屋裡，屋頂用鐵皮與木板拼接，牆縫仍透著冷風。桌上放著一碗泡麵，早已沒有熱氣。他沒有動，只是看著那層凝住的油光。\n\n這裡不是他該在的地方。\n\n幾個月前，他還在高雄港的斷牆後，和三排九班一起等命令。現在，那些聲音全都消失了。連隊、呼號、位置，一個個斷開，最後只剩空白。\n\n屋子裡只有他一個人。白天，他會沿著山徑找水、找能吃的東西，把門板釘緊，把破掉的地方補起來。偶爾會遠遠看到其他人影，但沒有誰停下來說話。\n\n夜裡更安靜。風穿過林間，帶著濕氣與土味，偶爾夾著遠方傳來的悶響。他很少真正睡著，任何聲音都能把他拉醒。\n\n他低頭看著自己的手，傷口已經結痂，卻留下深色的痕。那天的畫面時不時浮現——港區的火光、槍聲，還有劉承業最後那句話。\n\n山那頭忽然閃過一抹紅光，幾秒後，悶響傳來，在山谷間層層回蕩。木屋微微震了一下，灰塵落在桌面。\n\n趙子昂沒有擡頭。\n\n他只是把手慢慢放在桌上，盯著那碗冷掉的麵，聲音低得幾乎聽不見。"
 CHI.TW.39.a: "只剩我一人了啊"

 CHI.TW.40.t: "緊急動員"
 CHI.TW.40.d: "西線的火光尚未熄滅，戰線卻已被撕開數道缺口。沿海登陸與內陸穿插同時推進，使原本尚能維持的防禦體系迅速變得支離破碎。就在這種幾近崩塌的邊緣，零星而急促的集結開始出現。 \n\n一支由各地臨時編組的志願民兵，從被轟毀的鄉道與田野間趕來。帶隊的是周嶺，她臉上沾著未乾的煙灰，背包裡除了急救物資，只剩下零散彈藥。趙聞川緊跟其後，步伐略顯急促，卻始終沒有回頭。他們沒有統一的裝備，也沒有完整的編制，更多時候只能依靠口頭指示與彼此默契維持隊形。 \n\n「前面就是斷線的位置。」週嶺壓低聲音，指向遠處被炮火削平的堤岸。那裡原本是防線的一段，現在只剩下斷裂的混凝土與翻覆的鐵絲網。幾名守軍殘部正在撤離，神情麻木而疲憊。 \n\n沒有交接，也沒有多餘的說明，志工們直接接替了陣地。趙聞川將僅有的彈匣分送出去，又把水壺遞給一名還在發抖的新兵。沈知夏蹲在破損的掩體後，用簡陋電台重新建立聯絡，一段斷續的回音在耳機裡反覆跳動。當她報出座標時，聲音有一瞬間的遲滯，卻很快恢復穩定。 \n\n顧承野則在陣地間來回穿梭，把零散的人員重新組織成幾個火力點。他的動作不算熟練，卻帶著一種近乎固執的專注，像是在強行把混亂壓回秩序之中。 \n\n遠處傳來履帶碾壓的低沈聲響。還未完全冷卻的地面再次震動，煙霧中隱約浮現推進的裝甲輪廓。林語棠伏在壕溝邊緣，呼吸貼著泥土，她沒有等待命令，只是微微調整姿勢，將槍口對準側翼最薄弱的部分。 \n\n第一聲槍響之後，陣地迅速被拉回戰鬥節奏。簡易機槍斷斷續續壓制前方推進路線，手雷在殘牆間爆開，掀起碎石與泥土。補員並未改變火力對比，卻讓原本即將崩潰的防線重新有了「形」。 \n\n砲火再度覆蓋下來，壕溝泥水四濺。有人被震得耳鳴失聲，也有人在黑暗中死死抓住身邊同伴的衣袖。週嶺靠在土壁上，短暫閉上眼睛，又很快睜開，重新舉起手臂示意分散。 \n\n當第二輪衝擊逼近，陣地已經不再完整，卻仍然存在。那些倉促拼湊起來的人影，在煙塵與火光之間穩住了位置，像一條被不斷撕裂卻始終未斷的線。"
 CHI.TW.40.a: "補上去，哪怕只多撐一分鐘"

 CHI.TW.41.t: "山海之間的盟友"
 CHI.TW.41.d: "今夜的台灣東海岸，海風裹著潮濕的鹹味，從花蓮的港口一路吹到臨時陣地。月光很亮，照得海面發白，如果不是遠處偶爾閃過的炮火，這一切幾乎像是和平年代的夜晚。\n\n我和佐藤誠政務官一起吃著野戰口糧。說是吃飯，其實只是靠在一輛裝甲車旁將壓縮幹糧掰碎塞進嘴里。他已經四十多歲了，臉上帶著長期熬夜留下的疲憊。他說帶這樣一支聯合部隊，比打仗本身更難。自衛隊志願隊、我們國軍，還有臨時編入的地方守備隊，指揮體系像一團亂麻。\n\n遠處的掩體旁，有人點起小小的篝火。士兵們低聲哼著歌，混雜的旋律，帶著不同的情緒，有人唱著《梅花》，也有人用生澀的日語跟著哼唱君之代的調子。語言混亂，卻奇妙地沒有沖突。\n\n佐藤盯著那邊看了很久，忽然問我：\"你們真的相信能守住嗎？\"他的語氣不帶挑釁，更像是在確認什麼。我沒有立刻回答，只是看著火光旁的人影——一個台南來的年輕兵正教一名日本士兵用閩南語說\"兄弟\"，兩個人笑得前仰後合。\n\n我知道他在擔心什麼。不同的國家，不同的人，甚至是曾被侵略國。如今卻被在同一條戰線上。對他來說，這種並肩本身就充滿矛盾。\n\n明天我們要往北推進，支援台北外圍防線。我得休息了。只是合上記錄本時，海風里還夾著斷斷續續的歌聲："
 CHI.TW.41.a: "とまるもゆくも、かぎりとて（無論留下或離開，一切終有結束之時)"

 CHI.TW.42.t: "敵襲"
 CHI.TW.42.d: "陰天，不確定是在基隆外緣，還是更靠近海岸的某段陣地。\n\n手還是抖。\n\n陳志遠，那個台南新兵的血已經幹在袖口，顏色發暗，怎麼搓都下不去。他才十九歲，很多事情還沒來得及經歷，就停在了今天早上。\n\n最初見到他是在後送點。他替傷兵處理傷口，動作細得不像在戰場上。我當時偏過頭，對旁邊的人說，這樣的人，大概撐不了幾天。\n\n清晨的海面先是安靜得異常，隨後整片天空像被撕開一樣。來自解放軍的火力壓了下來——遠處艦炮的悶響一下一下砸進地面，火箭彈拖著尾焰掠過頭頂，爆炸把陣地前沿掀成一片翻滾的泥土和碎石。無線電里一片雜音，根本聽不清指令。\n\n就在這樣的混亂里，是他先發現側翼的空隙。\n\n他看過來，沒有解釋，也沒有遲疑。\n\n\"我去。\"聲音不高，卻很穩，\"他們會先注意我。\"\n\n我還沒開口，他已經翻出掩體。\n\n他沿著被炸塌的掩體邊緣移動，借著煙塵和彈坑一點點向前。火力果然被吸引過去，我們才有機會重新組織陣形。但下一瞬間，一發爆炸在他附近掀起，他整個人被氣浪拋開，重重摔在地上。\n\n等我趕到，他已經說不出話。血不斷從喉嚨里湧出來，他卻執意把一件東西塞進我手里。\n\n現在陣地安靜下來，風聲蓋過了一切。\n\n我把他的遺物收整好：青天白日、一本寫滿急救記錄的手冊，還有那張前些日子的合影。照片上的他笑得很松弛，像完全不屬於這里。背面那行字寫得很認真——等結束以後，要一起開一家診所。"
 CHI.TW.42.a: "那句話，我還是沒來得及說出口"

 CHI.TW.43.t: "海峽盡頭的火光"
 CHI.TW.43.d: "海風從台灣海峽方向壓過來，帶著鹽味，也帶著燃燒後的焦糊氣息。傍晚的天色本該溫和，卻被火光撕開——港區在燃，堆疊的貨櫃一排排塌陷，油料庫爆炸後升起的黑煙直沖雲層，把整片天空染成暗紅。\n\n遠處的碼頭上，一面青天白日旗仍掛在殘破的旗桿上。旗面被沖擊波撕裂，邊緣卷曲發黑，卻還在風里頑強地展開。橋面和岸邊的混凝土滿是彈坑，碎片散得到處都是，像被反覆碾碎過。\n\n幾名登陸的中國人民解放軍士兵已經推進到港區邊緣，他們順著斷裂的護欄往高處爬，動作急促而謹慎。下方的部隊在廢墟間展開，有人用手勢催促，有人架起機槍警戒，更多的人只是擡頭盯著那面旗。\n\n在港區外側的高地上，國軍軍官林振國伏在破碎的掩體後，看著這一切。腳下的泥土還在微微震動，像是剛剛那輪炮擊留下的餘波。身後傳來腳步聲，日方聯絡官佐藤誠沿著被炸開的斜坡爬上來，呼吸略顯急促。\n\n兩人沒有立刻說話。\n\n港區那邊，有人已經開始切斷旗索。動作很慢，風很大，旗幟被拉扯得不斷翻卷。金屬摩擦聲斷斷續續傳過來，在爆炸後的寂靜里顯得格外清晰。\n\n\"你在看那個？\"佐藤最終開口。\n\n林振國點了點頭，沒有移開視線。\n\n\"現在不開火？\"佐藤壓低聲音。\n\n林振國沒有回答。\n\n瞄準鏡里，那兩個人已經固定好身體，開始切割旗索。風很大，動作被不斷打斷，鋼索在刀具下發出斷續的摩擦聲。\n\n\"再等。\"他只說了兩個字。\n\n時間被拉得很長。\n\n就在旗索出現明顯松動的一瞬間，林振國的手指壓下去。\n\n第一聲槍響幾乎和風聲重疊。\n\n高處的其中一人猛地一頓，整個人向後仰去，失去支點後直接從結構邊緣墜落。第二個人還沒反應過來，第二發子彈已經打在他肩側，他試圖抓住什麼，卻只抓到空氣。\n\n幾乎同時，掩體後的火力全部展開。機槍、步槍沿著預先標定的角度壓向港區，高處和下方瞬間被交叉火力覆蓋。剛剛還在觀望的士兵被迫散開，原本準備完成的動作被徹底打斷。\n\n那面旗沒有被割斷。\n\n它在風里劇烈抖動，半斷未斷，像被拉扯著懸在那里。林振國重新拉動槍機，目光仍停在瞄準鏡里："
 CHI.TW.43.a: "「別讓他們只記住廢墟。」"

 CHI.TW.44.t: "北京光復"
 CHI.TW.44.d: "當我方的坦克部隊推進到北京市郊時，一副地獄般的景象就出現在他們眼前，路上堆得高高的街壘門戶大開、建築牆上的彈痕無聲地哭訴它的遭遇、繁華的商業街成了難民與逃兵最後的庇護所，這一切很難讓人想像十年前這裡竟是中國的萬都之首。這座有著數百年輝煌歷史的古都捱過清兵入關、革命軍北伐、日寇入侵，可飽經風霜的它在現代武器前卻顯得如此渺小，數千枚砲彈砸碎了解放軍的防線，也擊潰了當地居民的希望。\n\n每推進一公里，就有數百名難民朝著我們的部隊蜂擁而上，街道上偶爾還有零星的共軍勢力嘗試組織反抗，有的基於自身良知不對難民開槍選擇投降、有的依托建築廢墟甚至古蹟和我軍負嵎頑抗。無論如何，北京市都已經看不到任何成建制敵軍部隊在此區域活動。\n\n數萬名難民和游擊戰給我們帶來沉重的負擔，但這還不是最嚴重的。北京城內的各種文物建築在各方砲火洗禮下也同樣受到嚴重損壞，太約和我方的文物考察團焦急地向政府請願暫停敵對行動，讓他們有能力進到北京清點文物損失，但考量到周遭的軍事部署與城內極其嚴峻的治安情況，恐怕至少得等到兩三個月後城內狀況才能初步穩定。\n\n五星紅旗飄揚在天安門城門上空，自「新中國」成立後這片紅旗從發誓會永遠庇佑十多億的子民度過他們的一生，而這場騙局僅維持了八十多年。無雲的湛藍天空讓今天的白日格外耀眼，映襯漆著軍綠色迷彩的M60徐徐駛過天安門前，一群士兵繞開屍體滿布的廣場，帶著中華民國國旗爬上城牆，扯下那滿面焦黑、破敗不堪的「國旗」，青天白日滿地紅再次飄揚在北京的上空。"
 CHI.TW.44.a: "永遠無法抹去的傷疤"

 CHI.TW.45.t: "四國聯軍聚天津"
 CHI.TW.45.d: "十幾天前，英勇的海軍陸戰隊在艦砲跟空軍的掩護下順利在濱海工業區建立橋頭堡。現在，陸軍部隊也順著濱海公路與高速公路快速挺進，沿線的殘存解放軍根本無法組織起任何能有效抵擋中華民國部隊的堅固防線。任何活動的敵軍皆在太約與我方空軍基地的打擊範圍內，首都防空圈早就名存實亡，日韓澳台組成的聯合空軍在華北平原上空組織起一片二十四小時全天候有著戰鬥機和轟炸機中隊組成的巡邏單位盤旋待命，只要有任何支援需求火力支援最短能在十五分鐘內投送火力。\n\n我方部隊正以塘沽機場為後勤重鎮給前線部隊送上源源不斷的彈藥油料，目前前線回報他們正朝著天津市中心快速推進，預計兩天後便能控制天津站、一周後便能確保周遭交通要道跟城市政經中心的安全，作為進攻首都或周遭城市的跳板。但考慮到目前中國大陸如此複雜的割據態勢，想要完全控制天津市還需要一至兩個月的時間，這段時間我方會逐屋清掃殘存的中共軍隊和民兵游擊隊，才能確保我方與太約部隊能在此地安全無虞的活動。"
 CHI.TW.45.a: "清理工作越快越好"

 CHI.TW.46.t: "東北之心"
 CHI.TW.46.d: "隨著國軍將殘餘軍閥勢力逐出哈爾濱，拿下全東北只是時間問題，由於國軍部隊長期以來側重熱帶嶼亞熱帶環境的作戰訓練，考量到未來可能在長白山等高海拔高緯度的山區進行掃蕩作戰，當前最重要的是讓士兵適應東北的環境與氣候。日韓等國也對我方的軍事進展表達關切，並表示願意派駐一部份步兵、特戰與空軍教官進入哈爾濱，以協助我軍能更快的適應雪地作戰。\n\n其餘的作戰裝備根據不同的需要也正緊鑼密鼓地進行雪地改裝，台灣本土的工廠正加緊趕工，將士兵缺乏的大衣、雪地作戰靴與毛毯源源不斷地送到哈爾濱，太約各國也相繼來電表示願意開放機場與港口，供我方的運輸機與運輸船使用。\n\n除此之外，本地居民的安置問題也相當頭疼，長時間的持續作戰讓數十萬難民流離失所，總統府已聯絡紅十字會等民間人道組織一起北上哈爾濱展開人道救援活動，但目前城內的難民們只能依靠前線部隊負責收容。食物、飲用水和藥品仍相當緊缺，能夠安全安置難民的場地有限，工兵部隊目前尚在沿街清理埋放的地雷和未爆彈。在處理完之前，各部只能盡可能收容更多的難民……\n\n東三省之大，大的能把鄉愁裝下，時隔近百年，青天白日滿地紅最終還是回到了松花江上。中原大戰過後張學良改旗易幟，中國終於完成的形式上的一統。可在日本的野心逼得少帥不得不帶著東北軍撤入關內，抗戰過後東北又被共軍奪走，最後只能跟著中央軍敗走台灣。這一走，就是五十年。\n\n我們很難想像當年張學良來台時的心情，也無法得知他歸鄉的願望是否在時代的滾滾長河下被沖淡，我們唯一能做的，就是帶著他們的遺志重返故土，為他們的靈魂照亮回家的路。"
 CHI.TW.46.a: "松花江上我的家"

 CHI.TW.47.t: "烏魯木齊"
 CHI.TW.47.d: "自西漢張騫「鑿空」西域以來，兩千年裏，駝鈴與商隊越過一片片綠洲、沙漠和人煙，自此東往中原，留下無數光怪陸離卻又美麗動人的傳說。光緒二年，前清名臣左公宗棠率軍抬棺出征，打敗帝國主義與分裂主義分子，徹底鞏固並建省「新疆」，在國際與國內的法理上正式宣告這片廣袤而豐饒的土地屬於中國。民國三十八年，國軍在大陸上的軍事行動節節敗退，機會主義者叛逃前中共政府，我們於新疆合乎法理與情理的統治自此結束，在神州陸外嗟吁嘆息。\n\n今日凌晨四點，國軍新疆所部攻入烏魯木齊城內，經過約半日時間的激烈巷戰，目前烏魯木齊城區已完全由國軍控制，城內民族分裂主義分子與前中共抵抗分子大部已完全被清剿，小部向我軍投降，原烏魯木齊市政府機關駐地現已升起中華民國國旗，而該前政府駐地也作為國軍新疆所部維持秩序與指揮全疆剩餘地區作戰的司令部。\n\n城內巷戰戰鬥激烈，烏魯木齊除市中心外大部建築已被炮火摧毀，不少平民被磚石瓦礫掩埋，城內剩餘難民在國軍的引導下陸續進入難民營，並依據意願編入重建志願隊中協助國軍開展戰後重建工作，烏魯木齊的秩序暫時得以維持。\n\n自國府重回大陸、揮師北進取得無數輝煌的戰果之後，青天白日滿地紅旗終於在大陸的西端高高飄揚，我們將重新收拾這片染上恐怖與鮮血的土地，讓它與它之上的國民們重得以發展與繁榮。"
 CHI.TW.47.a: "恐怖分子我甘霖釀！"

 CHI.TW.48.t: "重歸南京舊都"
 CHI.TW.48.d: "隨著塗裝青天白日的戰車開入市區，南京市正式宣告由中華民國控制，身穿迷彩服的國軍將士再次走入這個他們只聞其名不見其物的前首都。\n\n上世紀隨著日本的進發與中共的持續推進，南京這個位置微妙的首都經常被中華民國政府暫時放棄，如今80多年過去，我們終於回到這個已然陌生的城市。城市內的百姓們害怕的注視行進的軍隊，大亞洲戰爭的陰影還盤踞在他們的心底，他們害怕緩慢前行的國軍會做出毀損城市的行為。但很快他們便意識到自己多慮了，當人們看到其中一名路過的士兵將自己身上攜帶的糖果分享給小朋友時，他們意識到自己的的家園被和平接管。他們再也不用害怕中共的高壓統治、忍受南京臨時政府雜亂無章的運作，他們回歸到「真正的中國」了。\n\n戰爭期間第一隻衝進南京市內的聯兵營再度回到此處，部隊裡國軍的將士們忍不住放緩步調四處多看戰時走馬看花的城市。士兵裡包含了不少1949年蔣介石委員長帶來台灣的大軍後代，時間跨越的長度足以沖散家族對中國大陸的情感，但他們或多或少還記得爸爸、爺爺偶而提到爺爺、曾祖父那輩的人對故鄉的念想。南京光復宣告反攻大陸的第一步已然踏穩，雖然離全部光復還有一段距離，如果最後能活著回家的話，總算有事情能對長輩們說說了。"
 CHI.TW.48.a: "家祭勿忘告乃翁"

 CHI.TW.49.t: "再臨魔都"
 CHI.TW.49.d: "在國軍的部隊進入上海這座大城市時，街頭巷尾充斥的民眾的歡呼聲，這可能是國軍在光復大陸的行動中第一次這麼受到歡迎。\n\n在大亞洲戰爭宣告結束之時，日本宣布佔領了上海的消息引起當地人的強烈不滿，儘管已經時隔近百年，淞滬會戰的歷史注定讓當地人對前來佔領的日軍沒有什麼好臉色，尤其當南京臨時政府通電全國宣布正式歸順中國唯一合法政府——中華民國時，城市內發生了大規模的反日遊行，但也僅是如此。戰爭的陰霾尚未散去，上海市民與日軍不敢引發更大規模的衝突，中華民國政府決定開始與日方談判上海控制權轉交事宜，最終敲定日商能夠首先進入上海從事經濟貿易換取上海回歸中華民國。\n\n此次順利的和平談判為我國在中國大陸其餘地區獲取了大量的聲望，也促成後續日佔區轉交事宜進行。魔力之都——上海，我們回來了！"
 CHI.TW.49.a: "不愧是經濟火車頭，都會區比台北大上好多"

 CHI.TW.50.t: "革命聖地之結末"
 CHI.TW.50.d: "在國軍擊退盤踞與陝西的軍閥與解放軍殘部後，國軍第二次踏入了延安，這座中共官方正式定義的「革命的聖地，新中國的搖籃」。\n\n當地居民深受共產黨的「宣傳熏陶」，我軍在此處與在南京附近遇到的情況截然不同，最友善的也只是閉門不出，遭遇的遊擊與暗殺的情況更是多了好幾倍。當地的解放軍殘部也拼死阻止國軍向此地進軍，但國軍最終還是踏入了這座城市。\n\n國軍在1946年的內戰期間曾經占領了該地，逼得中共高層不得不緊急出逃，但這種輝煌轉瞬即逝。直到今日，我們再一次踏入了這座城市，占領了這座「革命聖地」。\n\n這座城市有著中共官方設立的「革命紀念館」，「楊家嶺革命舊址」，「棗院革命舊址」等紅色教育基地。總統府在之前就發出指示，要求國軍不得故意破壞這些地方。後面都要改造成共產黨統治時代紀念館，國共內戰紀念碑與民主教育公園等。因此工兵部隊在進入當地後，即刻開始拆毀各地遺留的宣傳標語和將旗杆上的五星紅旗換為青天白日旗並對在戰火中受損的各個紅色景點進行修復，以免後續的改造還沒開始這些地方就倒塌了。\n\n國軍光復延安的消息傳出後，各地共產黨殘部對這座革命聖地的淪陷都大為悲切，這極大打擊了各地共產黨和解放軍殘餘的士氣。也使得我軍的士氣更加昂揚"
 CHI.TW.50.a: "革命精神該消逝了"

 CHI.TW.51.t: "抗戰的堡壘"
 CHI.TW.51.d: "重慶，巴蜀之地，四面環山的四川盆地庇佑著那些住在這裡的人們。這裡氣候宜人、地勢險要，外來者若是想要打擊龜縮此處的敵人，在入川之前都必須先脫一層皮。若是不願正面入侵想打消耗戰，天府之國肥沃的土地能源源不斷地為本地人提供充足的糧食。因此外來者若是想入川，最好的方式只有等待川內勢力主動臣服，不然就是等待川內政權內亂後趁虛而入。\n\n三國時期是如此、民國初年是如此，重慶與四川盆地在歷史上的重要性為後人所熟知。蔣介石剿匪期間若不是中共流竄至四川地帶，嚴重威脅到當地川軍的生存，中央系的部隊恐怕就沒辦法那麼輕鬆地就控制四川盆地。抗戰期間沿海多個重要城市與交通樞紐盡數淪陷，為保障政權的存續，中央政府舉國搬遷至重慶，隨著東部戰線的穩固，中華民國也成功地保住了革命的最後火種。\n\n但現在，四川盆地卻成了我們光復中華民國最大的阻礙，軍閥間的激烈內戰嚴重破壞了從東部入川的交通要道，高速公路、橋梁、隧道、鐵路線無一倖免，加上四周多山的地形，國軍在此處的推進速度明顯慢了許多。\n\n當印著青天白日國徽的雲豹甲車出現在重慶時，百姓簞食壺漿以迎王師。自中共崩潰後四川陷入軍閥混戰，直到國軍控制了四川，所幸一切都結束了，百姓奔走相告爭相目睹王師風采，四川滿是飢腸轆轆的民眾，他們衣不蔽體、滿面蠟黃，但至少他們不必再為戰火擔憂了。當年的解放軍自稱解放重慶，時隔將近90年，我們又回來了!\n\n清理與盤點工作還在有序進行中，根據情報人員蒐集到的資料指出，重慶大學的地下室似乎埋藏著一些不為人所知的秘密，據說是由中共中央直接管轄，保密程度極高。目前國軍第173裝甲旅已經進駐並嚴格封鎖整座校園，校內師生被統一轉移至學生宿舍統一管理，各界專家目前已從桃園機場落地工兵剛剛修建完畢的戰備機場，必須在第一時間挖出裡面的祕密才行!"
 CHI.TW.51.a: "重慶，非去不可!"

 CHI.TW.52.t: "辛亥乃光"
 CHI.TW.52.d: "自西元1911年，即民國元年，武漢作為推翻封建專政，建成民主共和革命的首義城市在中華大地上神采飛揚。七十多年前，由於軍事上的失敗，我們不得不攜著民主的精神輾轉流亡於陸外，這座城市也隨之蒙塵於赤色橫禍之下。\n\n而在今日，隨著國軍徹底掃除了武漢市內冥頑不化、妄圖以巷道戰術阻滯國軍步伐的抵抗分子後，這座于我們中華民國而言具有重要意義的城市終於重光我手。這同樣也標誌我軍在華中方面取得了重大戰略成果，距離完全光復華中也只剩下了時間問題。\n\n同時，在光復武漢後，武漢方面國軍也對戰後難民迅速展開救災行動。我們的戰線由地圖上的線轉變成了難民營前的警戒線，當地與國軍有直接接觸的居民們對我們的態度也在走向積極，甚至已有部分人主動幫助國軍推進救災任務、重建當地秩序。\n\n當然，由於前中共政府醜化、敵視自由民主的教育，我們在當地的工作也遇到了不少困難。為此，我軍臨時分派了更多的人手向當地人釋放善意，以期儘快推進臨時秩序的恢復，推進戰後救災進程。\n\n時隔百年，我們並不知道當時為民主而與專制者做鬥爭的自由先輩們心中所想，但我們可以肯定的是，當青天白日滿地紅旗高高飄揚在武漢市上空的時候，那些為民主、為自由而抗爭到底的前人在天之靈已經可以含笑九泉了。"
 CHI.TW.52.a: "自由民主之城再得其民主自由"

 CHI.TW.53.t: "黃埔精神起源"
 CHI.TW.53.d: "國軍在大亞洲戰爭中控制了廣州，這座別稱羊城的城市是黃埔軍校的所在地，國軍的建軍地，北伐的起始地。對於中國民國有著僅次於首都南京的特殊意義。大亞洲的硝煙落下後，中華民國對這種城市的控制終於穩固了下來。開始對戰爭中受損的城市進行重建。廣州自公元前214年的番禺城到21世紀的南方大都市，一直是中國重要的對外通商口岸，但在大亞洲戰爭中被戰火捲入險些被毀於一旦，連著名的廣州塔都被打出幾個大洞，顯得搖搖欲墜。來自臺灣的建築公司與軍隊工兵部隊在戰爭停止後，馬上開始緊鑼密鼓的修復這座古老而又現代的城市。\n\n[CHI.GetLeader]總統親自前往廣州黃埔區陸軍軍官學校舊址舉行了一場廣州光復儀式，再時隔近百年後國軍再次在黃埔的操場上舉行閱兵式，國軍士兵穿上自建軍以來到現在21世紀的的各式軍服，排列成整齊的隊列，帶著歷史上使用的裝備，舉行了意義的重大閱兵式。中華民國現政府高層都出席了本次閱兵式，無數大陸人，臺灣人，香港人，澳門人，海外華人齊聚一堂，觀看了這一意義重大的儀式。\n\n這場閱兵儀式被來自全世界的媒體直播，哪怕是在歐洲也有2%的收視率，在東亞更是達到了平均35%的收視率，臺灣當地則是來到了驚人的88%收視率。\n\n在閱兵式結束後，全體政府成員前往廣州附近的國父故鄉，中山市翠亨村，祭拜孫中山先生的在天之靈，告訴國父中華民國已回到大陸，政府全體必將為了中國的光復而奮鬥。"
 CHI.TW.53.a: "黃埔精神永不落"

 CHI.TW.54.t: "廢都不廢"
 CHI.TW.54.d: "上世紀九十年代初，大陸作家賈平凹曾以這座歷經千年滄桑的城市為背景，寫出來膾炙人口的小說——《廢都》。正如小說名一樣，長期以來，西安這座城市在大陸地區的影響力已遠不及千年以來它作為首都時那樣可以輻射全國，但作為西部地區數一數二的大都會，無論是政治、經濟還是軍事上來說，它的地位依然舉足輕重。\n\n今日下午，城牆內部殘餘守軍經由國軍西安所部領導勸降，正式改旗易幟、投誠國軍，並主動在完全恢復秩序之前作為臨時警備幫助國軍維持城內的臨時秩序。西安城內的古蹟古物也因之未受到損壞，遠在南京的國立中央博物院的學者們聞此發來賀電，對和平起義、投誠我軍、保護古蹟的守軍們表示祝賀和感謝。\n\n雖然國軍在西安大部取得了豐碩的戰果，但仍有頑固分子未響應和平起義的號召，心存僥倖，南逃進秦嶺山脈抑或在郊區農村中與國軍進行對抗。目前，國軍西安所部已派出轄下英勇神武的國軍健兒們對西安郊區、山區的殘餘抵抗分子展開清剿，相信不久之後西安將會徹底光復，重歸於民主光耀之下。\n\n就戰略意義而言，西安的光復說明了國軍已成功光復了傳統意義上的整個中原地區，也為國軍向西光復新疆打開了門戶。並且，西安作為前中共政府治下的一座軍工業重鎮，我國軍作戰的武器補給亦能得到及時補充，秦嶺之中更有前中共所佈置核武設施，就戰後格局而言，西安的光復意義頗大。\n\n西安的秩序正在得到恢復，相信在不久的將來，這片古老大地上的人們都會得到其本應該就有的自由與民主，並緊緊團結在青天白日滿地紅旗之下。"
 CHI.TW.54.a: "啥時候吃油潑面啊？"

 CHI.TW.55.t: "孔孟之鄉"
 CHI.TW.55.d: "濟南，孔孟之鄉山東的首府。在中共崩潰後，這片文教興盛之地卻成為多種不同宗教極端勢力的混戰場，佛教道教基督教甚至各種邪教的極端勢力在齊魯大地上拉攏信徒，互相攻伐。想必曲阜孔廟內的孔聖人看見此情此景也不免閉上雙眼，以免看見這片悲慘的大地。\n\n也因此國軍北上之時，除了真正的瘋狂信徒，山東百姓可以說是簞食壺漿歡迎我們的士兵到來。我們的敵人只有那些真正的宗教極端分子，這些宗教極端分子的戰鬥力很差，但是戰鬥意志極其堅決，在剿滅他們的過程中經常發生極端宗教分子戰鬥到最後一人或者攜帶炸彈背心偷襲我方士兵的情況。\n\n不過國軍最終還是進入了濟南這座山東的首府，並隨後進入了曲阜保護住了孔廟孔林這些中國文化遺產。在成體係的宗教武裝被擊潰後，國軍開始清繳逃入山地負隅頑抗的極端宗教武裝，但是在山東各地城市中仍然有些許多反社會的邪教地下教會。因此內政部宗教及禮制司和憲兵特勤隊和維安特勤隊聯合組成的宗教特別小組（特設的專門處理邪教的武裝警察部隊）也進駐了山東各城市，在山東各城市中尋找與剿滅邪教地下教會。"
 CHI.TW.55.a: "孔聖人也欣慰的笑了。"

 CHI.TW.56.t: "陽朔山水甲桂林"
 CHI.TW.56.d: "桂林山水甲天下，玉碧羅青意可參。若是沒有戰爭的摧殘，想必桂林一定是最適合士兵們安生養息的最佳地點，大自然總能撫平岩壁上被砲火摧殘的傷痕。當國軍坦克開進桂林城時，沿街擠滿了前來歡呼的當地民眾，他們大多衣不蔽體，這一點也沒有減少他們看到青天白日的熱情，有的難民甚至舉起臨時用油漆塗繪而成的青天白日旗，好不熱鬧。\n\n桂林的戰略價值極為重要，東接廣州、南至南寧，向西可進駐雲南、往北探就是長沙，拿下此處我軍就可以牢牢掌握光復戰爭的主導權，周邊那些缺乏一致指揮的軍閥難以對桂林守軍造成威脅，可由於桂林特殊的地形致使我方不得不投入大量部隊用於掃蕩。所幸當地的壯族自治區政府願意與中華民國達成和解，由那些熱情高漲的壯族部落協助國軍進行反游擊戰。\n\n我軍的快速推進致使當地軍閥在潰退前來不及摧毀鐵公路與航空設施，在這幾天被國軍先遣部隊完整接收，跑道長3000公尺的兩江國際機場經過簡單清理後便投入使用，大量C17與C130停泊在遠機位負責卸下物資與轉送戰俘，數支空軍中隊在機場上空24小時盤旋，以防其他方向的軍閥趁機偷襲。\n\n高等院校的相關資源與損失目前還在清點當中，老師與學生會被送到附近省份的安全區或台灣本島繼續教學，不過解放军陸軍特種作戰學院是個特例。\n\n國防部下令若是那些軍官教官有願意服從者，則可保留原職、俸祿，條件是必須協助培訓國軍的相關特戰技能，包含情報偵蒐河中高級狙擊手培訓，教授相關課程時也會有我軍政戰部人員在旁負責監督。\n\n目前已有127名軍官表示願意接受上述條件，至於那些寧死不屈者只能和其他戰俘一起關進臨時戰俘營中，等待被運輸機或鐵路轉送後方處置。"
 CHI.TW.56.a: "光復大道上的又一次勝利!"