 CHI_restoration_of_republic_super_quote: "「世界潮流，浩浩蕩蕩，順之則昌，逆之則亡。」\n- 孫中山"
 CHI_restoration_of_republic_super_quote_han: "「立足台灣、胸懷大陸、放眼世界、征服宇宙。」\n- 韓國瑜"
 CHI_restoration_of_republic_super_quote_chiang: "「當大家談論到台灣海峽的時候，想到的不再是波濤與呼嘯，而是和平與繁榮。」\n- 蔣萬安"
 CHI_restoration_of_republic_super_quote_ai: "「成功創造出有效的人工智慧，可能是我們文明史上最大的事件。不幸的是，它也可能是最後一次。」\n- 史蒂芬·霍金"
 CHI_restoration_of_republic_super_btn: "重返榮耀"
 CHI_restoration_of_republic_super_btn_han: "白日再次升起"
 CHI_restoration_of_republic_super_btn_chiang: "天下為公"
 CHI_restoration_of_republic_super_btn_ai: "一切皆為未來服務！"
 CHI_second_gaw_super_title: "第二次大亞洲戰爭"
 CHI_second_gaw_super_quote: "「當戰爭來臨時，要以崇高榮譽、無比尊嚴，勇敢走向戰場，含笑為國犧牲。」\n- 馮世寬"
 CHI_second_gaw_super_btn: "天無二日"
