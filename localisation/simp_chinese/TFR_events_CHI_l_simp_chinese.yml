l_simp_chinese:
 ROC.1.t: "紅、藍、白"
 ROC.1.d: "中華民國如今已走入第109個年頭，以外國人的角度來說這個國家資歷尚淺，這種印象在中共悄悄掌握「中國」繼承者稱號的近代逐漸成為主流，而作為中華民族正統繼承人的中華民國也面臨著史上最大的身分認同危機。 \n\n由蔡英文及其背後的民主進步黨主張本土意識，強調「台灣人」的身份在「中國人」之前----在大家是中華民國公民之前，大家首先是個台灣人。 此種意識形態在戒嚴中後期逐漸成為主流，近代民主化之後成長為一股新興的政治力量。 \n\n與之相對應的則是推派韓國瑜參選的中國國民黨，這個歷史悠久的政黨由中華民國國父孫中山一手創立，隨後由蔣介石帶領的國民政府先後打敗各地軍閥、法西斯日本的入侵後統一中國，然不幸的是在抗戰結束之日中國共產黨趁勢而起，遼西、徐蚌、 平津的戰略重挫逼迫當年的國民政府撤退遷台。 在台灣國民黨政府的政策從撤退前期的「反攻大陸」逐漸轉變為「深耕台灣」，主要以「中華民國人」自居----即便他們並不反對台灣人這份身分認同標簽，就算在民主化之後受到來自內外的壓力，國民黨仍可透過當年深入基層的各地農會與黨組織深深掌握當地選票。 \n\n藍與綠，外省人與本省人，中國人與台灣人，這塊土地上的人民承受過太多苦難，對於作秀般的選舉也感到厭倦。 這一次，是否會有些不同呢？ "
 ROC.1.a: "中華民國萬歲！"

 CHI.10.t: "石油危機波及台灣"
 CHI.10.d: "隨著油價飆升以及沙特阿拉伯內戰引發的經濟體系崩潰，國際能源與金融市場接連失序，沖擊迅速外溢，並對台灣造成沈重打擊。 全台證券交易所指數跌至歷史新低，多位頂級經濟學家警告，情勢仍在持續惡化，短期內難以止穩。 \n\n同時，紐約證券交易所崩盤與海外大規模經濟衰退疊加，引發連鎖反應，進一步壓縮台灣的出口、金融與制造業空間。 資金緊縮、訂單銳減，迫使數百家企業啟動裁員與業務收縮方案，就業市場隨之承壓。 \n\n過去半世紀支撐台灣高速成長的經濟引擎正明顯降速，資本信心動搖，產業擴張受阻，整體經濟逐步顯露出停滯的跡象。 "
 CHI.10.a: "得快點做準備！"

 CHI.1.t: "2020年大選"
 CHI.1.d: "民眾的目光再次聚焦於國家未來的方向，各派政治勢力摩拳擦掌、全力爭取支持。這不只是一次選舉，而是對現行政策與國家策略的公民檢驗。\n\n選民的選擇將直接影響國內改革步調、社會穩定以及對外政策的方向。政府必須同時應對民意、輿論與國際關注，在短期政治壓力與長期國家利益間找到平衡。"
 CHI.1.a: "民進黨繼續執政"
 CHI.1.b: "國民黨上台"

 CHI.2.t: "零號病患" 
 CHI.2.d: "客機平穩地降落在桃園機場，空姐溫柔的聲音通過廣播提醒旅客留在座位並講解入境檢疫規定，但楊淑惠一個字也聽不進去。 \n\n她的頭從幾個星期前就痛得不行，當時在武漢出差的淑惠只覺得這只是水土不服外加一點小感冒的癥狀罷了。可吃完隨身攜帶的感冒藥癥狀也沒有半點緩解，她靠在前排椅背試圖舒緩疼痛，從腳下背包里抽出最後一張衛生紙捂住嘴巴，咳完後將之塞進嘔吐袋中——里面裝著飛行期間累積起來的衛生紙。 \n\n下機之後她主動向地勤人員報備自己的健康狀況，身穿隔離裝的工作人員將她帶進臨時整理出來的隔離區內，里面的護士小心翼翼地將剛采集的檢體放入機器中等待結果。 \n\n緊湊的嗶嗶聲響起，即便淑惠的視線幾乎扭成一團，永遠都忘不了那個時候，在場每一位工作人員凝固的表情。"
 CHI.2.a: "天啊！"

 CHI.4.t: "亞細亞的孤兒"
 CHI.4.d: "自國共內戰失利後，中華民國政府於民國三十八年遷至台灣。 最初，這個政權仍能代表「中國」之名，然而在失去廣大領土之後，這份正統性也隨之動搖。\n\n1971年，中國共產黨建立的中華人民共和國取代中華民國，成為國際社會所承認的中國。自此，中華民國被迫退出世界舞台的中央，只能以台灣或中華台北之名，在國際秩序的邊緣艱難求存。\n\n在這樣的國際處境下，國內也歷經劇烈轉變。從戒嚴到民主，這個國家曾在威權的長夜中掙紮。前輩們以血與淚換來今日的自由與繁榮，卻也在無形之中承受了國體與國際地位進一步流失的代價。時至今日，已鮮有人能真心認為中華民國仍是「中國」，但正是在這樣的現實之中，這個國家學會了如何在強權的夾縫中呼吸，並勉力維持自身的存在。 \n然而，這份脆弱的平衡正面臨新的挑戰。中共軍機日覆一日越過海峽中線，逼近台灣本島; 突如其來的疫情動搖了全球供應鏈; 美國即將迎來大選，其國內局勢卻前所未有地動蕩不安。\n\n或許正如我們的對手所言——百年未有之大變局，正在展開。\n\n此刻，我們正站在命運的分水嶺。"
 CHI.4.a: "還顧望舊鄉，長路漫浩浩。"

 CHI.5.t: "禿子跟著月亮走，我們跟著禿子走"
 CHI.5.d: "隨著全國各地的投票所陸續完成開票，民眾屏息守在新聞台前。螢幕上各個候選人的得票數不斷跳動，這場戰鬥即將進入最後的清點階段。伴隨著蔡英文與韓國瑜排名的不斷交替，選民們的心也隨之起伏，每一次排名的變動都引發了其競選總部內排山倒海的歡呼。在這場鋼鐵般的碰撞中，唯有宋楚瑜的橘色陣營顯得無比邊緣，穩定地守著那毫無威脅的第三名。 歷經數小時的搏殺後，全台僅剩不到一萬張選票尚未統計。出乎意料地，各家新聞台上排在首位的名字赫然是屬於國民黨的韓國瑜，並以將近三萬票的優勢保持領先。隨後，現任總統蔡英文率先發表講話，壓抑的氛圍瀰漫在民進黨競選總部，無數支持者流著淚看著她承認敗選的事實。「韓流」來了——這股浪潮自高雄發起，一路衝入台北的總統府。 此時國民黨總部的氣氛已然達到最高點，隨著對手宣布敗選，韓國瑜正式站上了他的舞台： 「作為中華民國的總統當選人，我沒有一絲一毫的喜悅。我非常明白，安全與經濟不是選擇題，而是申論題。如今的中華民國已經到了最危難的時刻，我韓國瑜將克盡職守，不負國民所託。為了中華民國，不惜粉身碎骨！我會為了國家的安全衝在最前線，也會為了人民有錢、錢進台灣而奮鬥在最前線。 謝謝中華民國數百萬的選民給予我服務熱愛國家的機會。如果我這四年做不好，拜託不要讓我做滿四年，讓我直接滾蛋！」"
 CHI.5.a: "青天肇，白日升"

 CHI.6.t: "一瓶礦泉水，一碗滷肉飯"
 CHI.6.d: "今天的榮哥照慣例起的很早，下床簡單洗漱後便開始準備食材，燉一鍋肉臊、熬一整天的大骨湯對榮哥來說家常便飯。 他從他阿爸手上接過這間店已經30多年了，從小在台灣長大的榮哥對阿公阿爸口中的那些長江黃河什麼碗糕的都沒興趣，那些東西離他離得這麼遠也從來沒見過，跟他有什麼關系？\n中午短暫的休息時間他盯著墻上的大電視陷入沈思，總統大選又結束了，屏幕里光鮮亮麗的政治人物滿面春風，他自稱自己是「庶民總統」、滔滔不絕地講述他的政策、還說要讓「呆丸」發大財！\n榮哥不屑地咂了咂嘴，就在他拿起遙控器準備轉台的那一剎那，他在前台聽見了熟悉的聲音......\n\n「老板，來一碗滷肉飯。」一個有著油亮光頭、穿著競選背心以及洗了幾十年快要褪色的襯衫的中年男子走進店里，手上著一瓶喝到一半的礦泉水。 榮哥嚇了一跳，電視里的韓國瑜總統怎麼會就這樣一個人出現在他的店內？ 但還是接過他的菜單開始被菜，上完菜後韓國瑜讓他留下來，兩人促膝長談了很久，從教育聊到經濟、從當兵聊到孩子。\n\n「現在生意很難做了啦！」榮哥對著韓國瑜抱怨道。\n「嘿啊，挖當兵的時候一碗陽春面才十幾塊，現在去菜市場買菜不帶五百都不敢出門啰！」\n「每個總統都說要改變台灣，電視上那些圖啊什麼的都說台灣很好，經濟成長率很高，阿我怎麼越來越難過啊！」\n\n韓國瑜沒有說話，只是靜靜地挖起一口鹵肉飯送入口中。 在這個地方，沒有位階、沒有職權、沒有長幼之分，只有兩位孤獨的中年人一起分享著過往的人生。"
 CHI.6.a: "真正的庶民總統！"
 
 ROC.7.t: "釣魚臺列嶼石油開發請求"
 ROC.7.d: "台灣政府剛才向日本遞交外交照會，提議針對釣魚臺列嶼周邊海域的石油儲量進行共同開發，並申請相關資源的使用權。\n\n台灣政府背後的動機明確：在區域能源缺口擴大的壓力下，台灣急需穩定能源以維持高科技產業與民生運作。對日本而言，這不僅是經濟合作，更是對地緣政治底線與領土主權定位的考驗。\n\n接受請求將實質改善日台關系，但必將激化與中國的領土爭議；拒絕則可能疏遠兩國關系。"
 ROC.7.a: "考慮到區域穩定，我們必須拒絕。"
 ROC.7.b: "基於戰略互惠，同意共同開發。"
 
 ROC.8.t: "東京的拒絕信"
 ROC.8.d: "日本外務省回覆了我方關於尖閣諸島石油開發權的請求。可想而知，考慮到目前極覆雜的東亞形勢及中共對「領土主權」的要求，日本無法支持台灣在該海域進行任何形式的開發計劃。\n\n外交部對此表示遺憾，並告知我方尋求其他能源替代方案。"
 ROC.8.a: "可惜！"
 
 ROC.9.t: "東京的讚成信"
 ROC.9.d: "意料之中地，日本政府宣布同意給予台灣開發尖閣諸島周邊海域的石油資源。也就是說，台灣將獲得該海域部分原油的采掘權，並獲得日本提供的相關技術支持。\n\n盡管此舉引發了中共媒體的強烈譴責，但這不僅大大促進了日台關系，台灣的能源供給也得到了極大的保障。"
 ROC.9.a: "能源新篇章！"
 
 ROC.10.t: "南海石油共同開發請求"
 ROC.10.d: "台灣地區政府剛才向中國大陸遞交外交照會，提議針對南海周邊海域的石油儲量進行共同開發，並申請相關資源的使用權。\n\n台灣政府背後的動機明確：在區域能源缺口擴大的壓力下，台灣急需穩定能源以維持高科技產業與民生運作。對中國大陸而言，這不僅是經濟合作，更是對地緣政治底線與領土主權定位的考驗。\n\n接受請求將實質改善兩岸關系，但必將激化與周邊國家的領土爭議；拒絕則可能將兩岸關系進一步疏遠。"
 ROC.10.a: "台灣人？不熟。"
 ROC.10.b: "本是同根生..."
 
 ROC.11.t: "北京方面拒絕"
 ROC.11.d: "北京方面回覆了我方關於南海石油共同開發請求。可想而知，考慮到目前極覆雜的東亞形勢及中共對「領土主權」的要求，中國大陸政府無法支持台灣在該海域進行任何形式的開發計劃。\n\n外交部對此表示遺憾，並告知我方尋求其他能源替代方案。"
 ROC.11.a: "中國人？更不熟！"
 
 ROC.12.t: "北京方面同意"
 ROC.12.d: "意料之中地，中國大陸政府宣布同意給予台灣南海石油共同開發請求。也就是說，台灣政府將獲得該海域部分原油的采掘權，並獲得中國大陸提供的相關技術支持。\n\n盡管此舉引發了越南以及菲律賓等南海周邊國家媒體的強烈譴責，但這不僅大大促進了兩岸關系，台灣的能源供給也得到了極大的保障。"
 ROC.12.a: "相煎何太急"

 ROC.13.t: "一夜"
 ROC.13.d: "將入夏的夜空，總掛著一枕明淨的月亮，淡淡的月光穿過無垠，穿過深邃，鋪在大地上。地上人悠悠的思念即在這澄澈的月光中被披露的無影無蹤，揚起朦朧又輕盈的一片霧。一片遠遠的，籠在山上的霧。\n\n老夏頭咽下幾片止痛藥，小腿關節上的疼痛讓他幾十年如一日地輾轉反側。這幾天住在山上，老毛病犯得更勤了些。他歎了口氣，稍微收拾下，推開枯褐色的木門，迎面與月光相撞。\n\n四下一片明淨，物色如常，不過蒙上淡淡地月影。\n\n老夏頭抬頭看了看那一鉤月亮，抬起腳，悠悠地走進竹林深處。他跟著月光隨石板路在葉隙間遊動。春夏之交的晚上，不悶，不燥，偶來一陣清風，撩動竹葉簌簌作響，也拂動他衣上的青褶子和枯槁的髮絲。\n\n\n\n咚——咚——咚——\n\n悠遠的鐘聲蕩在竹林裡，縈繞在風中。這情景使人入聖，那些古代的名賢者一遇到這風，這月，這路，這竹，都不禁地想到自己，想到人，想到天下、大義、世界，從悠悠遠古而至眼前所感，無一不能有包括的。\n\n老夏頭心頭發緊，雖然不是什麼名賢者，但他這大半輩子和那些流於坊間市井的用於茶餘飯後解悶的故事並無什麼兩樣。\n\n悲慘的故事總有一個生命力頑強的主角——竹子不就是這樣嗎？默默無聞于生命的前大半段，而後一起沖天，再而成為一節又一節的堅韌，一片又一片的簌簌，定型，繁衍，破土而生。一片竹林就是一場人生。\n\n老夏頭坐在竹林最深處的石椅上靜靜吹風。這樣安靜的感覺讓他想起媽媽。人生這麼幾大恨，老夏頭心裡最剜不去的那一塊或許就是母親了。母親，母親，她的懷抱那樣的舒適，躺在那兒，一天的時間呐，從她髮絲間，從她輕拍親愛的孩子的背腑間，從呀呀學語的聲音間，慢慢逝去，在那麼幾個人的心裡——丈夫、母親的母親、朋友、親愛的孩子——刻下幾道抹不去的痕。老夏頭想起自己離開前母親臉上那幾道隱約可見的皺紋。\n\n他笑了。哽咽著顫抖。垂垂老矣，記憶卻如此清晰，好像列車由加速檔突然放慢，但推背感只在你瞥向記憶時猛然出現，讓人束手無措。一如那個犯錯後，在外不敢回家面對媽媽的小孩子。\n\n老夏頭站起身，他感覺身體輕盈，風變驟了許多。他想起來自己對兒子的囑託：一定要把自己葬在大陸。他深知自己回不去了，但人最能體現其為何是人的一點就是遺憾和貪婪。他太自私了，竟然要兒子完成自己的身後事。這太自私了。\n\n老夏頭的呼吸漸而舒緩，眼皮變得沉重，他躺倒在一片竹影間。月光傾瀉，在竹葉間躍動，天色很好。恍惚間他聽見母親的呼喊。\n\n那個犯錯的孩子要回家了，要回到母親的身邊了。"
 ROC.13.a: "世事無常"

 ROC.19.t: "浪蕩少年的反轉人生"
 ROC.19.d: "在今日國軍新一輪的人士異動中，中華民國陸軍六軍團副指揮官由孔乃德升任，並晉任為陸軍中將，創下了我國首位由志願役士兵攀登上中將職位的壯舉。\n\n自稱「浪蕩少年」的他在學生時期有過與哥哥同住一間宿舍、泡夜店、街頭鬥毆的荒唐歲月，在接到入伍服役的兵單後正式開啟人生轉折點。\n\n以義務役入伍的他過去因想轉服士官未能如願，後在民國81年（西元1992年）轉服志願役預官班晉升少尉。\n\n從軍期間他展現出了積極向上旺盛的好勝心，曾花了一整晚練習機槍分解，後就任我國裝甲586旅時因其身先士卒、體恤官兵的種種舉措深受好評。\n\n他的經歷給予了基層士兵信心，哪怕只是小兵最後也是能闖出一片天。"
 ROC.19.a: "我國需要更多這種人才"

 ROC.20.t: "達沃斯青年領袖交流營"
 ROC.20.d: "陳子瑄接過簡報筆，開始講解整份會報中的最後一個部分，面對台下來自歐美各國的政要與學術泰斗難免有些慌張，不過他們這組已經為此練習了好幾天，她有自信向全世界展現台灣青年最優秀的一面!\n報告結束，全場掌聲不斷。她緩緩放下簡報筆、退回他們組的隊列之中，所有人屏氣凝神等待著最後的評價環節。\n\n「首先，很感謝各位台灣青年願意來到世界經濟論壇，能夠看見這麼多優秀的青年是我的榮幸。」一位略帶滄桑的老人接過麥克風說，「容我介紹一下我自己，我叫做克勞斯·施瓦布。」\n\n「本人對各位報告中提出的『新世界願景』深感共鳴，特別是能看到各位對環保議題的重視。據我所知，台灣目前在環保議題上十分積極，但相比於歐美甚至中國還略有不足，特別是在住房與飲食上都偏向保守。請問各位有甚麼樣的想法能改設這一問題嗎?」\n\n「我們希望在未來能推動更多的社會住宅建立，.」子瑄接過話筒說，「並憑藉未來蓬勃發展的元宇宙技術，同時改善人們的飲食習慣，讓台灣能夠在未來能邁向更美好的世界，走向新世界.秩序。」\n\n子瑄說完之後，全場再次掌聲雷動，同時台下觀眾如雨後春筍般紛紛舉起手來想向他們提問......"
 ROC.20.a: "「我明白了，感謝您的回覆」"

 ROC.21.t: "川普宣布對台軍援"
 ROC.21.d: "在台海局勢持續緊張之際，美國總統唐納德·川普在一場記者會上宣布，將向台灣提供「規模空前的防衛性軍事援助方案」。該援助包括防空導彈、雷達系統、無人機及有限數量的反艦武器。川普表示：「台灣正在為自由而戰，美國不會袖手旁觀。」\n\n該聲明引發國際高度關注。相較於國會內部已的跨黨派聲援，陸外交部對此表示「強烈譴責」，並警告美方「不要玩火」。五角大廈則表示，美方將評估相關交付機制，但強調任何對台軍事支援都將基於防禦性質，並符合現行法律框架。\n\n隨後，美國貨船在高雄港停靠，陸軍58砲指部、空軍「戰術偵察機大隊」、嘉義第四聯隊、花蓮第五聯隊、海軍「第256戰隊」等部隊接收了海馬斯多管火箭系統（HIMARS）、SLAM-ER 增程型空對地飛彈、Q-9B 海上衛士無人機、MK-48 Mod6 AT 重型魚雷、魚叉岸防飛彈系統（HCDS）等諸多裝備，極大加強了我國的軍事實力，為海岸防禦加強了實力與信心。\n\n大陸國臺辦與外交部對此暴跳如雷，連日舉行記者會表示不滿與抗議，陸解放軍也多次進行海軍跨中線試探與軍機繞台，以施加壓力。我國軍隊也多次進行拒止行動，保衛台灣安全 對於美國此次以極快的速度交付本次軍購商品，我國外交部與國防部也對此表達了感謝，並希望來年還能再一次進行軍購"
 ROC.21.a: "民主兵工廠名不虛傳"

 ROC.22.t: "裴洛西訪台"
 ROC.22.d: "眾議院議長南希·裴洛西乘坐專機抵達台北，並在台北立法院發表演講。她在講話中強調美國支持台灣的民主制度，稱「台灣不孤單」，並呼籲深化美台關係。\n\n解放軍東部戰區隨後宣布，啟動「環台島實戰演訓」，多支海空兵力在台灣周邊展開大規模實彈演練，涵蓋聯合封鎖、突防打擊、區域拒止等多個科目。多枚導彈越過台灣本島上空，引發島內空防戒備升級。\n\n此舉在國際引發震動，各國反應不一，但國際社會普遍認為這意味著中美關係進一步惡化。"
 ROC.22.a: "為台美友誼乾杯!"

 taiwan.33.t: "第二波導彈襲擊"
 taiwan.33.d: "生死存亡的戰爭，再次降臨中華民國的土地。\n\n在第四次台海危機爆發僅數日之後，來自大陸的導彈首次直接打擊了我方關鍵基礎設施與城市。國防部正全力動員後備役、組織防御，然而第二輪導彈攻擊更為猛烈，摧毀了我方大部分行政與通信能力。\n\n然而，幸存的雷達站卻探測到更為駭人的景象：無數兩棲攻擊艦及其護衛艦正迅速逼近我沿岸，登陸戰一觸即發。這一刻已無疑義——第四次台海危機已然結束，台海戰爭正式爆發。\n\n盡管美軍缺席，但我們並非孤軍奮戰。太平洋防衛條約組織各國的幹預部隊已全面協防，正與我軍並肩作戰，於灘頭陣地嚴陣以待，誓死捍衛我領土主權。\n\n此刻，我們必須奮起抗爭、決不屈服於那頭紅色巨人。若此役不守，則中華民主之火，將永遠熄滅。"
 taiwan.33.a: "挺身而戰！"

 ROC.34.t: "日澳送來軍事援助"
 ROC.34.d: "東京方面通過內閣緊急決議，自衛隊調派多架C-2與C-130運輸機，自沖繩與九州基地起飛，連續數日空運防空系統組件、反艦飛彈備件、戰術通信平台與無人偵察設備。而日本海上自衛隊艦艇在周邊海域執行護航與情報支援任務，確保運輸航線安全。與此同時堪培拉隨後公布追加支援方案。澳大利亞國防軍啟動大規模後勤投送行動，C-17戰略運輸機經達爾文與關島轉場，將成批便攜式防空武器、反裝甲系統、野戰雷達、彈藥與工程器材運抵台灣南北機場。澳軍顧問與技術人員隨行，協助完成設備整合與操作訓練，並與台灣國防部建立聯合協調中心，加速物資分發至各作戰區。"
 ROC.34.a: "ありがとう"

 ROC.35.t: "日澳送來大量軍事援助"
 ROC.35.d: "東京方面通過內閣緊急決議，自衛隊調派大量C-2與C-130運輸機，自沖繩與九州基地起飛，連續數日空運防空系統組件、反艦飛彈備件、戰術通信平台與無人偵察設備。而日本海上自衛隊艦艇在周邊海域執行護航與情報支援任務，確保運輸航線安全。與此同時堪培拉隨後公布追加支援方案。澳大利亞國防軍啟動最大規模後勤投送行動，C-17戰略運輸機經達爾文與關島轉場，將成批便攜式防空武器、反裝甲系統、野戰雷達、彈藥與工程器材運抵台灣南北機場。澳軍顧問與技術人員隨行，協助完成設備整合與操作訓練，並與台灣國防部建立聯合協調中心，加速物資分發至各作戰區。"
 ROC.35.a: "ほんとにありがとうございます"

 ROC.36.t: "中華民國國慶日"
 ROC.36.d: "10月10日是中華民國的國慶日，用以紀念1911年武昌起義爆發以及隨後中華民國的成立。這一法定紀念日自民國初年確立以來，歷經時代變遷而延續至今。國慶象征著共和國體制的建立與憲政精神的傳承，也是全民共同回顧歷史的重要時刻。\n\n在這一天，台灣各地通常舉行升旗典禮與慶祝活動，總統府前廣場會舉辦國慶大會，總統發表談話，回顧國家發展並展望未來方向。視年度安排而定，政府可能舉行閱兵或大型展演，空中編隊飛越天際，夜間則有煙火與燈光表演點亮城市地標。若適逢連假期間，社會各界也會舉辦音樂會、體育賽事與文化展覽，使節慶氛圍更加濃厚。\n\n海外僑界與駐外機構同樣舉行慶祝酒會與紀念儀式，與友邦及各國代表共同見證這一時刻。盡管社會意見多元，歷史認知各有差異，但在國慶之日，國家的延續與制度的運作被集中呈現。作為紀念中華民國創立與發展的日子，這一節日仍然在當代社會中占有象征性的地位。"
 ROC.36.a: "中華民國萬歲！"

 ROC.37.t: "二二八事件紀念日"
 ROC.37.d: "自1947年，在戰後政權接收與社會秩序動蕩的背景下，一場由緝煙沖突引發的抗議迅速蔓延全島。隨後展開的清鄉與鎮壓行動，使無數平民、知識分子與地方菁英遭到逮捕、失蹤或殺害。那段時間留下的創傷，深刻影響了台灣社會的政治走向與世代記憶。\n\n二二八事件不僅是一段歷史，更是一場關於責任與人權的長期討論。隨著解嚴與民主化進程推進，檔案逐步開放，紀念碑與紀念館在各地建立，政府亦推動調查報告與賠償機制。社會輿論在這一日往往顯得格外敏感，有人強調歷史正義與轉型正義的重要性，也有人擔憂記憶的政治化會加深分歧。不同立場交織之下，這一天成為反思國家與公民關系的公共時刻。"
 ROC.37.a: "向死難者默哀"

 ROC.40.t: "冰釋前嫌"
 ROC.40.d: "戰火的紛飛的台灣，原本應身處地堡的民進黨黨首蔡英文公然現身台北，其伴行人員中甚至包括政治敵手韓國瑜，以及其他政黨領袖。會議室里氣氛凝重。長期在立法院針鋒相對的三黨代表，此刻卻圍繞同一份簡報低聲交談。\n\n韓國瑜以國民黨重要政治人物身份受邀出席。他在會上表示，政黨競爭可以繼續，但在抗戰議題上必須形成共同立場，並主動提出協助南部物資調度與民間動員網絡的整合。蔡英文回應稱，當前最重要的是穩定社會信心，任何跨黨派合作都會獲得行政體系全力支持。雙方隨後共同出席記者會，對外傳達一致訊息，強調其抗戰之決心。\n\n幾天後，韓國瑜親自協調地方企業捐贈發電機與醫療器材，民進黨中央則透過黨公職系統協助分配與登記。媒體捕捉到兩人在前線慰問部隊時短暫交談的畫面，此刻雙方沒有往日的激烈攻防言辭，只有對基層士氣的鼓勵。對於許多支持者而言，那一刻既象征著台灣政治的和解，也是對台灣最大的關心。\n\n戰事陰影尚未散去，立法院卻罕見地通過跨黨派決議，支持特別預算與後備改革法案。兩黨領袖在議場內握手的照片被廣泛轉載。在如此緊張歲月中，原本分歧深刻的兩大政黨在關鍵時刻選擇站在同一條防線上。"
 ROC.40.a: "此刻，我們皆是為了保家衛國"

 ROC.41.t: "菲律賓局勢失控"
 ROC.41.d: "過去數周內，菲律賓國內安全形勢急劇惡化。民族民主陣線在呂宋北部發動連續攻勢，占領多處鄉鎮與交通節點，並襲擊電力與通信設施，意圖削弱中央政府控制力。與此同時，摩洛伊斯蘭解放陣線於棉蘭老島擴大武裝行動，控制若幹城鎮與港口周邊區域，宣布進入戰時狀態。\n\n菲律賓政府軍已在馬尼拉周邊及中部要地實施戒嚴，調動陸軍主力進行分區清剿。然而受制於兵力分散與補給線遭破壞，前線推進受阻，部分駐軍被迫收縮防御。局勢進一步覆雜化之處在於海軍宣布維持中立，僅承擔海上巡邏與人道疏散任務，拒絕介入陸上沖突，導致沿海補給與兵力投送能力受限。\n\n當前菲律賓全國範圍內武裝沖突呈多點爆發態勢，交通體系大面積癱瘓，地方政府職能運作失序。若無法在短期內恢覆對關鍵區域的控制，沖突規模恐將進一步擴大。"
 ROC.41.a: "還能再亂一點嗎"

 ROC.42.t: "菲律賓全面內戰"
 ROC.42.d: "當前菲律賓全國局勢已由局部沖突演變為全面內戰。民族民主陣線在呂宋北部山區建立連續控制區，宣布成立菲律賓全國民主陣線，並對主要公路與能源設施實施系統性破壞。菲律賓政府軍則固守馬尼拉大都會區及若幹軍事基地，動員預備役力量，試圖恢覆交通線與行政秩序。\n\n棉蘭老島方面，摩洛伊斯蘭解放陣線全面接管數個省份的地方政權機構，設立獨立指揮體系，與菲律賓政府軍爆發激烈交火。多處機場與港口在爭奪中受損嚴重，補給體系趨於崩潰。菲律賓海軍宣布維持武裝中立，僅在主要航道執行封鎖與疏散行動，未對任何一方提供直接火力支援，使戰局呈現陸上分裂、海上對峙的覆雜格局。\n\n目前各方均宣稱自己為菲律賓唯一合法政府政府並將其餘勢力定性為叛亂分子對其繼續作戰。"
 ROC.42.a: "真是癲狂"

 ROC.43.t: "民族民主陣線統一菲律賓"
 ROC.43.d: "在長期武裝沖突後，民族民主陣線完成對呂宋、維薩亞與棉蘭老主要城市與交通樞紐的控制，其餘武裝勢力相繼瓦解或接受整編。民族民主陣線隨即在馬尼拉宣布成立\"菲律賓民主共和國\"，組建臨時中央委員會，接管全國行政與軍事體系。\n\n此前保持中立的海軍指揮層發布聯合聲明，承認新政權為菲律賓唯一合法政府，並宣布全體艦隊與海上力量納入共和國指揮體系，強調維護國家統一與海上通道安全。\n\n新成立的菲律賓民主共和國隨後發表外交公告，宣布加入\"東亞防御提倡協定\"，與區域成員國建立安全協作與情報共享機制。該決定標志著國家戰略方向的重大調整，未來軍事建設與對外政策將圍繞區域集體防務框架展開。"
 ROC.43.a: "菲律賓之春？"

 ROC.44.t: "政府軍統一菲律賓"
 ROC.44.d: "在長期武裝沖突後，菲律賓政府軍逐步收覆呂宋北部山區與棉蘭老主要城市，其餘武裝勢力相繼瓦解或接受整編。馬尼拉重新恢覆中央行政運作，總統府與國會宣布菲律賓共和國憲政秩序全面恢覆，全國進入戰後重建階段。\n\n此前保持中立的海軍指揮層發布聯合聲明，承認新政權為菲律賓唯一合法政府，並宣布全體艦隊與海上力量納入共和國指揮體系，強調維護國家統一與海上通道安全。\n\n新成立的菲律賓共和國隨後發表外交公告，宣布加入\"太平洋防御條約組織\"，與區域成員國建立安全協作與情報共享機制。該決定標志著國家戰略方向的重大調整，未來軍事建設與對外政策將圍繞區域集體防務框架展開。"
 ROC.44.a: "一如既往"

 ROC.45.t: "摩洛伊斯蘭解放陣線統一菲律賓"
 ROC.45.d: "在長期武裝沖突後，摩洛伊斯蘭解放陣線完成對棉蘭老、維薩亞及呂宋關鍵城市的軍事控制，其餘武裝勢力相繼瓦解或接受整編。其領導委員會在馬尼拉宣布成立\"菲律賓伊斯蘭國\"，廢止原有共和國憲政架構，建立以宗教法為核心的國家體制，並重組全國軍政體系。\n\n此前保持中立的海軍指揮層則聲明當前政府為非法政府\n\n新成立的菲律賓伊斯蘭國隨後發表外交公告，宣布執行極端宗教策略，據悉來自東亞防御提倡協定與太平洋防御條約組織的武器人員正秘密運往此前拒絕發聲的菲律賓海軍政府"
 ROC.45.a: "菲律賓之終"

 ROC.46.t: "海軍軍政府統一菲律賓"
 ROC.46.d: "在成功剿滅伊斯蘭極端武裝後，菲律賓海軍司令部收復馬尼拉及全國各主要島嶼，宣布正式恢復菲律賓共和國，並由海軍軍政府暫時接管過渡政務。\n\n隨後海軍軍政府發表外交聲明，宣布正式加入\"太平洋防御條約組織\"（PDTO），重申與日本及區域盟友的安全協作與海上通道防衛。"
 ROC.46.a: "秩序重歸太平洋"

 ROC.47.t: "海軍軍政府統一菲律賓"
 ROC.47.d: "在成功剿滅伊斯蘭極端武裝後，菲律賓海軍司令部收復馬尼拉及全國各主要島嶼，宣布正式恢復菲律賓共和國，並由海軍軍政府暫時接管過渡政務。\n\n隨後海軍軍政府發表外交聲明，宣布正式加入\"東亞防御提倡協定\"（EADI），確立與區域防務夥伴的安全合作關係。"
 ROC.47.a: "全新的戰略取向"

 ROC.55.t: "年菲律賓總統大選"
 ROC.55.d: ""
 ROC.55.a: "邦邦·馬科斯"
 ROC.55.b: "萊妮·羅布雷多"
 ROC.55.c: "曼尼·帕奎奧"

 ROC.77.t: "黑鷹直升機在烏來山區墜毀"
 ROC.77.d: "2020 年 1 月 2 日上午，中華民國空軍一架 UH-60M「黑鷹」直升機自新北市新店區直潭營區起飛，執行例行春節慰勉行程，原定前往宜蘭東澳嶺雷達站進行視導與勉勵官兵。機上共 13 人，包含時任參謀總長沈一鳴上將及多名高階將領與隨行人員\n\n直升機於飛行途中進入新北市烏來山區上空時，因天候不佳、能見度低，飛機在雷達上訊號消失。國防部隨即啟動緊急搜救機制，出動空中與地面搜救部隊展開搜尋。經數小時搜索，搜救人員於烏來桶後溪上遊山區發現失事殘骸。\n\n5名生還者則在搜救人員協助下送醫治療。後續調查指出，事故與當時山區天候惡劣、雲霧濃厚、飛行環境能見度不佳，以及飛行決策判斷等因素相關，並非機械故障所致。國軍隨後全面檢討高階軍官搭乘同一航空器的風險管理與飛安程序，強化相關規範。"
 ROC.77.a: "沈痛哀悼"
 ROC_77_tt: "§Y事故共造成 8 人罹難、5 人生還。罹難者包含：§!\n\n參謀總長 §Y沈一鳴§! 上將\n政戰局副局長 §Y於親文§! 少將\n情次室助次 §Y洪鴻鈞§! 少將\n作計室處長 §Y劉鎮富§! 少將\n參謀總長室參謀官 §Y黃聖航§! 中校\n空軍作計室參謀官 §Y韓正宏§! 中校\n空勤組員 §Y許鴻彬§! 上士\n空勤組員 §Y張志光§! 士官長§!"

 ROC.78.t: "中國暫停台灣鳳梨輸入"
 ROC.78.d: "2021 年 3 月，中國海關總署宣布自 3 月 1 日起暫停台灣鳳梨輸入，理由為多次檢出介殼蟲等有害生物。由於中國長期為台灣鳳梨最大外銷市場，此舉立即對鳳梨產業與農民生計造成衝擊，也迅速升高為政治與經貿議題。\n\n台灣政府隨即啟動因應措施，包含加強檢疫與品質管理、協助外銷市場轉移、啟動內銷促銷與加工收購機制。同時，民間企業、電商平台、餐飲業者與地方政府紛紛響應採購與行銷，社群媒體掀起「挺鳳梨」熱潮，大量民眾以實際購買行動支持農民，鳳梨入菜、鳳梨加工品與創意行銷在短時間內蔚為風潮。\n\n政府表示台灣鳳梨外銷市場將逐步分散至日本、香港、新加坡與中東等地，對單一市場依賴的問題也再次成為社會與政策討論焦點。"
 ROC.78.a: "這對它們沒好處!"

 ROC.79.t: "太魯閣號列車出軌事故"
 ROC.79.d: "2021年4月2日上午9時28分，位於台灣花蓮縣秀林鄉的台灣鐵路北迴線清水隧道北口，一列載有498人的TEMU1000型列車在行逕隧道前，因撞擊滑落邊坡侵入路線的工程車造成出軌，列車因慣性持續往前滑行撞進隧道內，車廂嚴重損毀，造成49人罹難和309人輕重傷\n\n儘管中華民國相關部門在事故發生後第一時間就發起救援及搶修工作，但是由於狹長的隧道與滑坡災害使得救援工作異常困難，造成49人罹難和309人輕重傷害的嚴重後果\n\n"
 ROC.79.a: "徹查事故原因，避免悲劇重演。"

 ROC.80.t: "花蓮 7.2 強震"
 ROC.80.d: "2024 年 4 月 3 日淩晨，台灣花蓮縣發生 芮氏規模 7.2 的強烈地震，震央位於花蓮近海，震源深度約 20 公里。此次地震是近年東台灣地區最嚴重的天然災害之一，對花蓮及鄰近縣市造成重大破壞。\n\n地震發生後，建築物倒塌、道路裂縫、橋樑受損，並引發多起土石流與山崩，導致交通中斷、供電中斷與水電設施損壞。初步統計，共造成 數十人死亡、數百人受傷，多處民宅與公共設施嚴重損毀，居民緊急疏散。"
 ROC.80.a: "向罹難者家屬表達哀悼"

 ROC.81.t: "颱風「丹娜絲」登陸嘉義"
 ROC.81.d: "2025 年 7 月 6 日，颱風 「丹娜絲」由南海北上，於下午登陸嘉義縣布袋鎮，造成台灣中南部地區出現 豪雨、強風與山洪暴發。颱風來勢強勁，最大風速達每秒 45 公尺，降雨量在部分山區累積超過 500 毫米，帶來大規模水患風險。颱風登陸後，中南部多地發生嚴重淹水，沿海地區出現風災與海水倒灌。嘉義、台南與雲林地區交通癱瘓，高速公路與省道多處中斷。初步統計，颱風造成至少 2 人死亡、數十人受傷，部分農作物及民房遭受損毀，民眾緊急撤離至避難所。\n\n在花蓮、台東等東部山區，由於連日豪雨與地形陡峭，部分河川如馬太鞍溪、秀林溪等 發生山崩與土石流，形成多處堰塞湖。部分堰塞湖水位快速上升，水壩潰堤風險極高。地方政府與水利單位立即展開疏散與搶險，強制疏散附近居民，防止次生災害造成重大傷亡。\n\n堰塞湖事件導致道路中斷，部分山區村落與農田被淹沒或受損，民生供水與電力一度中斷。中央與地方政府協調空勤、消防與工務單位，派遣挖掘機與搶險設備進行堰塞湖排水作業，並設置臨時安全通道。"
 ROC.81.a: "派遣救援部隊!"

 ROC.82.t: "清明"
 ROC.82.d: "四月的雨絲絲點點，郁郁蔥蔥地籠成一片蒙蒙的煙。\n\n老夏頭少年時見慣了這雨，那時候，他仔細地去看那些弄影的青柳枝間隙時，還能見到細密的銀針穿過去，縫在蒼郁的地上，不像如今模糊。老夏頭踩在著松軟的春泥里，細密的雨絲穿過那些弄影的青柳枝，也穿過他的身子，把他縫在地上，弄得他身上癢絲絲的。他沒帶傘，這樣的雨沒必要帶傘，一如他年少時在那片白雲鄉中自由的時光。\n\n今天清明節，他正去拜會幾個經久不見的老友。幾個小丘此起彼伏，幾條小路彎彎繞繞，放在曾經，輕鞭快馬，回眼望去，淺淺的草痕沒不過他的足跡，只留下一串響在四面里歡暢的笑聲。現在他正一步一步，踏踏實實地踩在這樣松軟的泥土上，相較曾經，他的腳步更沈穩了，也更能感受到這土地是何等的堅實——竟足以托起一副幹枯的軀體，一個垂老下墜的心。"
 ROC.82.a: "物是人非事事休"

 ROC.83.t: "緣丘而上"
 ROC.83.d: "朦朧的視野里出現幾個漆綠的點，漸而是團，最後是柱。那些是柳樹，它們立在老夏頭遠遠的視野里，柳絲輕撫，春風得意。柳下是更多的，凹凸不平的小土包，像許多倒著的大鬥，前面樹著幾方纏著苔痕的碑。\n\n老夏頭的腳步快了些，丘面並不陂陀，老夏頭很順利地下去了，點散在野的柳樹也好像聚攏了一些。他提了酒，還有鹵牛肉，他小時候作佃，只見東家吃過。東家的嘴巴一張一合，一盤鹵牛肉就幹凈了大半，隨之而來的是酒的臭味和一陣陣歡聲笑語。他還記得那時東家心情好，給他賞了幾片肉，最後他才知道，那不是鹵牛肉，但往後的日子里他一直把那幾片肉當鹵牛肉。\n\n他立在那些靜靜地立在雨中，腳底下舒張的生命力蔓延到到他的頭頂去。這滋味很令人懷念。這是年少的滋味。有溫熱從他臉上劃過。他想家了。"
 ROC.83.a: "半晌"

 ROC.84.t: "欲語淚先流"
 ROC.84.d: "老夏頭顫巍巍地從口袋里掏出幾個白凈的小瓷盞，一一放在自己眼前，貼著那些小土包，好像立了一堵透明的墻，墻外只留他孤身一人，墻里是眾人的沈默；又像一條路，從記憶深處延伸到這些小土包里，橫在老夏頭身子前面。他斟酒的動作很慢，卻很穩。他想起來還在軍隊的日子，那些抽中敢死簽的大頭兵，有些很豪氣，有些哆哆嗦嗦，結果一碗酒幹盡，都叫嚷著要和敵人拼個命，好像死這件事，在酒面前不值一提。\n\n他徑自喝了一盞，辛、辣，而後是沖鼻子，他忍著咽下去，眼淚都憋了出來。他一向不喝酒，也不明白這東西是為何有如此大的魔力，但他仿著記憶里那些穿著軍裝的灰色的人影，一盞接著一盞，直到眼前天花亂墜，頭腦發脹發昏才停下來。\n\n他端起那些斟滿的酒盞，又搖搖晃晃地起身，一盞接著一盞地澆在那些小土包邊上。雨絲跌在盞中，蕩起淡淡的漣漪。做完這一切，他跪下去，重重磕了幾個頭，聲音顫抖，幾個不成音節的字從他嘴里蹦出來："
 ROC.84.a: "「弟兄們……小弟無能……還沒替你們回大陸……替你們回家……」"

 ROC.85.t: "相見歡"
 ROC.85.d: "「……來了？」\n\n「……來了。」\n\n病房里蒼白的墻面覆住無力遠望的視線，外面的聲音也被這墻塗上了馬賽克，模糊不清——靜極了。\n\n老夏頭抽出那把病床旁的凳子坐下去，動作很輕，只牽動幾縷和風惹得衣角騷動。老夏頭聽到心跳和沈重的呼吸聲，但不知是自己還是床上人的。他展眼和床上人對視，卻發現他的眼睛幾乎瞇成一條縫。印象里，他的眼睛不是這樣的。\n\n「…你眼睛怎麼了？」\n\n「我看不清你的樣子了，人老了。」\n\n床上人的聲音沈重，喉頭似乎被什麼堵住了，咬字時的發音連帶著牙齒的顫動聲。老夏頭握住了床上人搭在白被上的手。他的手很涼，還粗糙，大小不一的繭子錯落在寬厚的手上。手掌很厚實，老夏頭得用兩只手才能緊緊握住。\n\n老夏頭喉頭哽咽，眼眶里忽得溫熱起來，但他控制住了，只讓淚水在心里劃出傷痕。\n\n「你說這人，怎麼說有事，他就有事了？我前幾天走台北時你精神頭還足，怎麼這一回宜蘭，就成這模樣了…」\n\n"
 ROC.85.a: "十年生死兩茫茫……"

 ROC.86.t: "……不思量"
 ROC.86.d: "他的聲音顫抖起來。老張的另一只手搭過去，按在老夏頭手上。他搖了搖頭，似乎並不認可老夏頭的悲傷。\n\n「人老了就是這樣，身子弱，骨頭脆，就算萬千當心也會有這麼一遭，不過有些人來得晚，有些人來得早罷了，這是小事。」\n\n「我活了這麼大，仗，大大小小打了幾百場，人，不三不四殺了幾十個，死，我不怕，人總有一死…」\n\n老張眼睛瞥到別處，不去看老夏頭。\n\n「只是，我沒死到家里，沒死到大陸，沒再見我娘一面，沒給她和我老爹盡孝，這真是我最大的遺憾…」\n\n老張聲音漸漸弱下去，隱隱抽泣。他慢慢轉過頭看向老夏頭，眼皮跳動，眼睛晃動。他正打量著老夏頭。\n\n「…就這幾天的事情了…老夏，我恐怕回不去了…」\n\n老張的聲音有些顫抖，他的手緊緊按在老夏頭的手上，額上擠出深深的溝壑，呼吸聲愈來愈沈重。\n\n「但我不想埋在這里，我不想埋在台灣，老夏，這里不是我家，等我死後，我想求你把我的骨灰帶回家里去，埋在那里，不要立碑，我沒臉見後輩們……」"
 ROC.86.a: "「更沒臉見我爹娘在天之靈…」"

 ROC.87.t: "自難忘"
 ROC.87.d: "老張雙眼眼角扯起來，嘴角下垂，嗚嗚地哭出來，好像一陣迅疾的風瘋狂地吹打沙漠里一棵幹枯到樹。\n\n「老夏…我求你…兄弟就這一個願望…」\n\n老夏頭咬住嘴唇，舌頭觸到幾絲腥味。他重重點頭，握緊了老張的手，喉頭緊縮，話到嘴邊卻說不出來，只能沈默地看著老張。\n\n「這就好…這就好…」\n\n老張慢慢抽開自己的手，臉上溢出幸福的笑，嘴里嘟囔著什麼，聲音越來越小，老夏聽不清楚，只能緊緊握住他的手。過去一陣，病房里漸漸安靜下來，和他剛進來時沒有兩樣。\n\n他聽見心跳聲。他知道，這心跳聲只能是自己的了。"
 ROC.87.a: "老張咽氣了"

 CHI.TW.5.t: "政治禁令"
 CHI.TW.5.d: "戰火甫起，島嶼迅速進入全面動員狀態。隨著飛彈威脅與登陸風險同時升高，政府高層開始關注另一條看不見的戰線——內部的政治穩定與安全風險。\n\n情報單位在戰前即已警告，極端意識形態組織可能在戰時環境中被激化，甚至成為滲透、煽動與破壞的潛在節點。無論是鼓吹極端民族主義與威權統治的法西斯主義團體，還是與對岸政權存在意識形態連結的共產主義組織，都被視為可能影響戰時團結與國家安全的不穩定因素。\n\n即日起，暫時查禁所有具有法西斯主義與共產主義性質之政黨與政治組織活動。"
 CHI.TW.5.a: "...掃清叛徒"
 
 CHI.11.t: "台灣人口首次負成長"
 CHI.11.d: "隨著內政部戶政司敲下最後一聲定音錘，2020年的統計數據揭示了一個殘酷的現實：台灣正式步入了人口負成長時代。在過去的一年裡，島內的新生兒數量僅有16.5萬人，創下歷史新低，而死亡人數卻高達17.3萬人。這個被媒體稱為「生不如死」的自然增加死亡交叉，加上新冠肺炎疫情導致邊境管制、跨國人口流動受阻的社會減少，共同造成了台灣總人口的首次衰退。少子化與高齡化的雙重夾擊，正化為烏雲籠罩在寶島上空。這不僅僅是數據的更叠，更是一場動搖國本的長遠危機——未來，我們的工廠將缺乏勞工，我們的軍隊將缺乏士兵。政府必須立刻採取行動，否則國力的衰退將不可逆轉。"
 CHI.11.a: "這是我們必須面對的國安危機……"

 CHI.3.t: "太平洋之殤"
 CHI.3.d: "曾長期維系太平洋秩序的強權，如今陷入自身的內戰與分裂。美國的港口封鎖、軍事調動與政治混亂，使原本穩定的海上航道與經貿網絡瞬間失去依靠。這場遠在彼岸的沖突，卻直接動搖了我們賴以生存的國際環境。金融市場劇烈震蕩，出口與供應鏈遭到切斷，區域安全出現前所未有的真空。太平洋不再是和平與繁榮的象征，它成為了動蕩與不確定的源頭。"
 CHI.3.a: "舊有的秩序，已然焚毀"

 CHI.7.t: "深夜的總統府"
 CHI.7.d: "［關於美國陷入完全混亂的報告］\n\n［關於美國本土武裝反政府動亂的報告］\n\n［關於中國解放軍不正常行動的報告］\n\n隨著一份份報告送到總統的辦公桌上，蔡英文此刻眼前的世界彷彿已經崩塌。“這不可能，美國就這麼垮了?”\n\n但是事實已經如美國本土四處升起的烈焰般明了，台灣失去了美國的保護，今後台灣必將獨立前行，美國崩潰帶來的經濟危機相比對岸共軍的虎視眈眈似乎已經不是什麼要緊的事情。多起共軍不正常行動報告已經指明，經受了70年和平的海峽兩岸，又將在空中飛越導彈和飛機……蔡英文在短暫的驚慌過後，起身扶好眼鏡，她明白，今後的台灣，比任何時刻都需要她的領導。"
 CHI.7.a: "台灣必須自己站穩腳步"

 CHI.8.t: "韓總統的電視演講"
 CHI.8.d: "外匯市場的劇烈波動已無法掩飾。銀行間清算幾近停滯，美元資產價格在短時間內大幅崩跌，企業與民眾同時陷入不安與觀望。這場源自太平洋彼岸的內戰，正以前所未有的速度衝擊我國經濟命脈。 總統府臨時召開國安與財經高層會議後，決定由韓國瑜總統親自向全國發表電視談話。 鏡頭前，這位「庶民總統」神情凝重，語氣卻異常平穩。 \n\n「各位國人同胞，這不是一般的經濟波動，而是一場全球秩序的改變。我們手中的外匯、我們依賴的市場、我們熟悉的世界，都正在快速消失。」\n\n「但請各位放心，政府已經啟動緊急機制，確保金融體系穩定、民生供應無虞。這是一場考驗，但也是一次讓臺灣重新站穩腳跟的機會。」"
 CHI.8.a: "「我們一定會撐過去。」"

 CHI.9.t: "受害者、加害者"
 CHI.9.d: "今天是一年一度的有罪判決撤銷儀式，促進轉型正義委員會會舉辦這類相關的赦免儀式和記者會，一方面提醒國民過去的歷史，另一方面卻也是在不停揭開受害者的瘡疤。\n\n藍國本進場後在志工的攙扶下入座，佈滿皺紋的雙手疊在身前。他的父親只不過是抱怨了幾句，就被國民黨政府迫害入獄，一連拷打好幾天都沒放出來，為了賄賂警察母親跟能借錢的親戚朋友都聯絡過了，卻怎麼都湊不夠，最後不得已之下藍國書只能被迫答應成為政府線人，負責監視那些學校裡那些「說錯話」的同學。\n\n他跟著朋友進入一間又一間地下圖書室，幫助政府一個接著一個抓走那些朝氣有活力的同學，桌子上擺滿那些印有鮮紅書皮的大部頭，《資本論》、《共產黨宣言》、《國家與革命》.......他們說這些書籍沾滿著工人階級鬥爭時的鮮血，但對他來說，卻是由同窗好友的熱血與生命澆鑄而成。\n\n蔡英文總統一遍遍念過赦免者的名字，藍國本直到解嚴後才知道他父親早在他去求情那晚就已經被活活打死，他所做的一切都只是在助紂為虐。國本時常在夢裡聽見好幾種稚嫩但悠遠的聲音，質問他為什麼要告發他們?為什麼要送他們去死?!\n\n可藍國本什麼都說不出來，他哽咽，他靜靜地坐在床邊、身下的冰冷鐵椅上灼燒著他的靈魂，直到所有人散去，他才顫顫巍巍地扶著志工起身，緩緩走出會場。"
 CHI.9.a: "這不是對父親罪刑的赦免，而是又一次對他的審判。"

 CHI.101.t: "兒子"
 CHI.101.d: "睜開沉重的眼皮，斑駁的壁紙有氣無力地貼合著水泥牆，被撕開那一角油漆脫落、霉斑橫行，睿明按著枕頭翻身到另一側，空蕩蕩的床位上只剩下一顆灰色的枕頭，他緊緊地閉上眼、大口喘著粗氣，強撐起身體後一把推開門衝出房間，又活過了一天。\n\n睿明打開瓦斯，可爐子卻怎麼也點不起來。「對喔......」前幾天才嘗試過用煤氣自殺，結果一不小心被鄰居發現，害的他只能在熱心阿姨的協助下「尋找」異味來源並關掉瓦斯。他從櫥櫃裡翻出幾年前剛買的泡麵，泡了兩碗放在桌上。他坐在這一側，眼神空洞地望著另一側的空位，內心抱著一股僥倖，覺得兒子還會像往常一樣躺在客廳沙發上滑手機，瑞明端著兩碗泡麵慢慢走向客廳。毫不意外，這裡只有他一個人。\n\n慢慢的，睿明坐了下來，泡麵的蒸氣消散的很快，他想坐在客廳裡等兒子回來，說不定他只是先去上課了而已，不是嗎?他放學以後肯定就會見到面的，一定會.......\n\n昏黃的陽光在泡麵碗裡閃爍著，睿明驚醒，自己怎麼昏睡過去?要是沒去接兒子他肯定又會翻白眼的!他把兩碗已經泡的軟爛的面條吃得乾乾淨淨，隨手在兒子的訃告上滿滿的正字記號旁記上一筆，以免忘記自己還欠兒子一碗泡面。他帶著訃告和剛吃完的泡麵碗一瘸一拐的走上屋頂，抱著最後一絲暮光墜入黑暗"
 CHI.101.a: "死亡，才是責任的尾聲。"

 CHI.102.t: "清理門戶"
 CHI.102.d: "在國安局深處，連建築圖紙都找不到的昏暗房間內，蘇幹員帶著幾名弟兄圍著一張簡陋的鐵製露營桌，桌上散著的幾十張份夾著大頭照的制式文件夾，厚厚幾疊文件幾乎疊成一座小山，這些是他們十幾年追蹤親共人士的調查結果，退役將官、青年台商甚至一部份的陸籍配偶，中共自80年代以來嘗試透過各種方式滲透進台灣各界，或明或暗地對社會大眾發動認知作戰，引導輿論。\n\n過去礙於兩岸密切的民間往來，國安局擔心動作太大會對社會造成太多不可控的影響。但今時不同往日，台灣成功擊退解放軍，是時候將矛頭轉向內部了!蘇幹員點上一隻菸，各地的霹靂小組正循著他們給予的情報抓捕那些通敵者，催淚瓦斯與橡膠子彈會確保他們會在第一時間失去反抗能力、盾牌與步槍匯處裡那些不願投降的頑固份子......\n\n蘇幹員緩緩吐出一口菸，沒想到自己居然能活到現在，活到能親手清掃那些叛徒的時候。他的視線望著深灰色的水泥牆，相比於前線奮勇殺敵的士兵，他面對的敵人更加隱蔽、也更善於隱藏自己，不過，只要能保護中華民國........"
 CHI.102.a: "他願意用此生去保護它"

 CHI.103.t: "偃旗息鼓"
 CHI.103.d: "當硝煙散去，太太們七嘴八舌地和商販殺價、老太太繞著公園健走.....若不是有殘骸相伴，還以為這一切只不過是一場夢。\n\n紅色惡龍已經被趕回了巢穴，但這片土地都已不再是過去的模樣。港口仍殘留著戰鬥的痕跡，城市邊緣可見未完全修復的防禦工事，交通節點承受過載運作後的疲態逐漸浮現。從前線到後方，從工廠到家庭，整個社會都在長時間動員與壓力之下留下深刻傷痕。\n\n人們開始回到日常，卻發現「日常」本身已經改變。\n\n有些人沒有回來、有些產業無法立即恢復、有些信任仍停留在戰時的裂痕之中。然而，戰爭的結束同時也意味著一個新的開始。國家必須從全面動員的狀態中逐步轉型，重新分配資源、重建基礎設施、安置受影響的人口，並思考未來的安全與發展方向。\n\n這將不是一段迅速完成的過程。\n\n在戰火餘燼之上，我們將決定這個國家的下一個形態——\n\n是回到過去，還是走向一個截然不同的未來。"
 CHI.103.a: "總統，接下來...該做什麼?"
 CHI_unlock_reconstruction_tt: "將解鎖§Y戰後重建國策§!"

 CHI.104.t: "四年一瞬"
 CHI.104.d: "四年，它既可以很精采也可以很平淡，四年能讓天真爛漫的大學生玩遍全世界、四年也能讓整個社會陷入空轉，什麼都沒改變。對台灣來說，它陪伴著台灣人民跨過一個又一個困難，後者也展現出了堅強的韌性，無論面臨天災人禍，台灣，都撐過來了。\n\n自解嚴以來島內社會風氣巨變，人們在數十年的發展中也習慣了以四年為一個單位的社會變化，台灣人習以為常的選舉狂歡總會準時出場，候選人、統獨議題、網路論戰總能給大眾帶來驚喜，待狂歡散盡，又是一個平淡的四年。\n\n這種平靜能持續一輩子說不定也是一種幸運吧.....只可惜，解放軍的軍事行動把福爾摩沙硬生生變成殘酷的絞肉機，鮮血與淚水澆灌著嘉南平原的稻田。人們還在撫平戰爭帶來的創傷。\n\n但，未來不曾等待過任何人，下一任總統選舉默默拉開帷幕，不過這一次，沒有大聲公、沒有空戰，只有台灣人民的迷茫，與對未來最真切的渴望。"
 CHI.104.a: "下好離手"

 CHI.105.t: "牽手"
 CHI.105.d: "愛琪從大人那邊接過一個純白色的袋子，一手牽著她的「好朋友」走到那個最熟悉的角落。坐好、撕開包裝，裡面裝著大大小小的東西，上面寫的文字她也看不懂，但應該也是食物，至少大人們是這麼跟她說的。 「這個給你。」她笨拙地把餅乾的一角掰下來，放到她的「朋友」面前，熊熊佳琪最近都不怎麼愛說話了，平常也都不吃東西，愛琪這次又多掰了幾塊給她，還是胖胖的佳琪才可愛。她遠遠望著家的方向----不是現在住的帳篷新家，是舊的家。有幾次她想回舊家找爸爸嬤嬤，但周圍的幾個叔叔都不讓她進去，說是有什麼.....未爆彈?她不知道那是甚麼意思，下次回學校的時候再去問老師好了。 「拔拔媽媽現在在哪裡呢.....」那些叔叔都不知道，只是讓她回操場跟其他大人待在一起。愛琪吃下最後一口餅乾，這個小角落只有牆壁跟石頭，在這裡有點孤單，但很安全。 「啊~!原來你跑到這裡嗎?」愛琪抬頭，一個穿著藍色背心的金髮姊姊出現在她面前，「你還餓不餓?」愛琪剛想搖頭，她的肚子不爭氣地咕咕叫了起來，姊姊露出微笑，像老師一樣可愛。從身後「變」出一個小圓麵包塞進她的手心裡....."
 CHI.105.a: "「下次就不能一個人再亂跑囉~」"

 CHI.106.t: "東部重建"
 CHI.106.d: "刺眼的陽光照亮整座車廂，陳子豪反射性地舉起手遮當陽光，可無論怎麼動他的手就是舉不起來，他環顧四週，小小的車廂活像個沙丁魚罐頭，大家緊緊貼在一起，這種人員密度大概也只有北捷的尖峰時段能與之相比。\n\n戰爭過後台灣百廢待興，像子豪這種人被政府指派到各地修繕基礎設施，高壓電線、地下水管、縱貫鐵路.......到處南北奔波，試圖重新建立起南北部的連結。莒光號緩緩煞停，月台的燈光時斷時續，子豪順著人流走上月台，南迴鐵路最近才搶修成功投入使用，成為目前聯通東西部的唯一一條交通線。\n\n「逼!」的一聲，工頭吹響口哨召集所有人到車站外集合，子豪他們是第一批重建花東的工程隊，他們將優先投入那些最危險也是最重要的的區域，為後續的支援打下堅實基礎。\n\n陳子豪深吸一口氣，擦掉額頭上的汗珠，跟著其他人一起，拾起鐵鍬鏟起地上的水泥碎塊......."
 CHI.106.a: "千里之行，始於足下"

 CHI.107.t: "去往何方"
 CHI.107.d: "在台中某家重新開業的熱炒店裡，白天時揮灑汗水重建家園的工人們圍著一張折疊桌享受著他們夜間的放縱。呲的一聲，易拉罐啤酒拉環被壓下，清爽的氣泡從罐口冒出。咕嚕咕嚕，金黃色的小麥飲品滑入喉頭，冰涼的快感沁入全身。「哈！感覺又活過來啦！」其中一名工人發表出了彷彿嬰兒誕生般的喜悅，若不是為了維持自己的男子氣概，他甚至可能會落下熱淚。國家的重建正穩扎穩打的推動著，人們所有的思緒都用在讓家園恢復成本來的面貌——甚至更好！\n\n工人們盡情縱飲，暢想著家園全新的面貌。\n\n突然，電視播報的一則新聞吸引了他們的注意力。\n\n「隨著台灣的重建逐漸完成，在野黨的壓力之下，[CHI.Getleader]總統同意恢復總統大選。目前，各個政黨正進行黨內選舉推出候選人，在民意重新洗牌的現在，究竟會由哪個政黨執政？台灣又會迎向什麼樣的未來呢？敬請期待後續報導。」\n\n新聞播畢，工人們七嘴八舌起來。台海戰爭團結了全台上下，外部因素再也不會影響台灣的選舉進程，但人們再也不能用傳統的二分法「誰怎麼保護台灣」來投票了，選民支持佔比被全部打亂，工人們看著電視上的新聞陷入迷惘......"
 CHI.107.a: "對啊，接下來該怎麼選才好..."

 CHI.108.t: "高雄港區損害評估與重建報告"
 CHI.108.d: "總統閣下您好，目前中南部之交通節點的損壞清點作業已經初步完成，高雄港港區及其周邊商業區在共軍的數輪導彈和砲火下嚴重損毀，平民的安全保障與安置問題已經得到初步解決；海岸邊也殘留著為數眾多的共軍武備，其中大多在共軍撤退時一併炸毀無法修復，但仍有不少武器被遺留在港區附近的灘頭陣地：包含一艘728型氣墊登陸艇、三艘726型氣墊登陸艇、十輛ZLT-05式兩棲裝甲突擊車、各式火砲兩百組、輕重機槍與步槍若干挺和數千發子彈，其中大部分皆由左營軍港之駐紮部隊接收並轉運至隱蔽倉庫內等待後續安排。\n\n以下是高雄港的損壞評估報告綱要：\n\n一、洲際二期物流倉儲區與散雜貨碼頭的損壞情況相當嚴峻，戰爭期間是國軍與共軍在此短兵相接不過幾次，猛烈的導彈打擊跟氣墊艇上的火力支援便朝此處投射近百枚火箭彈，地面設施基本沒有修復之可能，建議將其完全拆除。\n\n二、第二港口內的第七、第六貨櫃中心和周遭的港區與工業設施均遭受到不同程度的導彈轟襲損毀，但在調查大林發電廠的損失情況後，我方發現內部冷卻系統與燃氣輪機出現明顯的人為破壞的痕跡。目前我方整積極配合國安局調查相關情況，廠區負責人已經向我們提交人員執勤名單與各區域的監視器影像，相關問題與細則請翻閱第三十一頁。\n\n三、當前可用之作業碼頭以不足二十座，27、28液貨碼頭被航空炸彈與導彈直接命中，大量殘骸仍在清理，清理過程中工程隊還意外被一枚未爆彈炸傷，造成四死二十一傷的悲劇，導致此區域清理工作極為困難；新濱1、2號碼頭在工兵的搶修下尚能維持基本運轉，但目前只能停泊一部分較小型的軍艦，其餘包括第七艦隊的大型船隻只能暫時停泊在S1~S5號碼頭，具體名單請參考第十二頁。\n\n以上是我方總結出當前高雄港損壞後簡易的初步報告與重點整理，高雄港目前急需資金與人力投入以期恢復正常運轉，具體的重建方案以及所需要的資源以附件形式放在本報告的最後一部分，望總統儘快給予回覆……"
 CHI.108.a: "「還真是嚴重吶...」..."

 CHI.109.t: "桃園機場重建事宜"
 CHI.109.d: "阿偉擦了擦頭上的汗，他是一位普通的建築工人。在戰爭中桃園機場被試圖奪取機場的解放軍空降兵和直升機以及之後的飛彈徹底摧毀，在戰爭結束之後，重建這座臺灣最大的國際機場被作為第一要務來實行，軍隊的工兵部隊用最快的速度重新推平了跑道。建立了臨時塔臺，回復了最基本的運行。\n\n在這之後，無數像阿偉這樣的建築工人和志願者來到了這片廢墟上，他們清理被炸毀廢墟，拖出被埋在瓦礫底下的雙方士兵的遺骸，回收還有價值的可回收物。在清理完成後，他們開始挖掘地基，政府決定趁著現在週邊四處都是廢墟將這座臺灣最重要的機場在重建的機場上進行擴大與優化，使得內部動線和布局更加科學與舒適。建築工人們將一車一車的混凝土倒入基坑，一點一點的重新建造了這座曾經臺灣最大最繁華人流量最多的機場，而且建造的更好。\n\n「開飯了！！！」遠處傳來志工的聲音，在現在的重建現場上，有許多志工在幫助工人們的工作，指揮交通，醫療急救，後勤補給等都離不開他們的貢獻。阿偉走過去志工阿姨拿起一份便當交給了阿偉，紅燒肉便當，今天還不錯，阿偉坐在椅子上，配著烏龍茶吃下了便當，隨後再一次投入到重建中，投入到臺灣的復興中。"
 CHI.109.a: "對啊，接下來該怎麼選才好..."

 CHI.110.t: "謀定航向"
 CHI.110.d: "在重建家園的工作告一段落後，人們回想起來自己理應實行的基本權利——投票權，戰爭重新刷新台灣人對政治的觀點，自己確實的一票深刻影響著國家的未來。在台灣政壇中，基本由國民黨與民進黨分庭抗禮，國民黨主張維持與海峽對岸的聯繫以便未來的某時反攻大陸讓青天白日滿地紅再度飄蕩在中國大陸上空，民進黨主張讓政權偏安於這座西太平洋的小島上維持屬於台灣人的國家，許多原本未敢設想的未來在太約取得優勢的現在如雨後春筍般冒了出來，在下一個一月來臨時，人們將得知社會意識的最大公約數並指名將來要去往的方向。國民黨？民進黨？亦或是第三種選項？"
 CHI.110.a: "希望一切順利"

 CHI.111.t: "中華民國的未來"
 CHI.111.d: "在坐滿所有座位的教室裡，台上的教授正口沫橫飛的提醒同學期中考的注意事項，比方說哪些是重點、哪裡可能會考等等，照理來說談到考試台下總會有幾隻小貓抬起頭舉起手機拍下考試內容。但今早，所有同學都很默契地低著頭看著自己的手機，黃中羽算是其中之一，下課之後的中羽飛也似衝到高鐵站，站裡也擠滿了準備返鄉投票的選民，返鄉之途相當坎坷。\n\n說起老家跟老父親，四年級的黃中羽只剩下一些模糊的影像，辱罵、逃家、打工……當年的他也是在這車間通道北上，路上所有家裡打來的電話全都掛斷、父親的臉書跟LINE全部封鎖。當年下定決心離家做得如此決絕，時代卻又開了個玩笑，他完全可以拒絕投票，待著宿舍裡又睡過一天，但一回想起這幾年台灣和他那些已經犧牲的同學們，又怎能安心入睡?\n\n下了車、出了站台，父親就在閘機前等他。沒有簡訊、沒有電話，彷彿是已經知道他一定會回來般，爸爸像一尊雕像般矗立在那，一動不動。\n\n「甲爸沒?」父親以略帶沙啞的嗓音問到。雖然才過了四年，但世界卻一點情面也不留，當年的硬骨頭在戰爭的摧殘下也搖搖欲墜。戰場的經歷給中羽留下難以磨滅的傷痕，何況是一個年近六十的老頭子呢?他沒有回應爸爸，後者則是領著他到車站附近的麵館吃飯，餐廳裡滿滿都是那些剛下了長途巴士的大爺大媽，可餐廳裡卻只有電視機播報投票注意事項的聲音，大家都在等待決定中華民國的未來那一刻，悶熱的空氣加劇了這種窒息感……\n\n到底投給誰，才是正確的選擇呢?"
 CHI.111.a: "要選就選韓總統！"

 CHI.121.t: "民心之所向"
 CHI.121.d: "正當某些候選人擺出一副菁英面孔、站在電視機前演講的時候，韓國瑜總統下班後早就到他平常買菜的菜市場報到了。路過的三姑六姨見到他都會熱情地喊一聲「韓總」，攤販裝好菜之後總是多遞一把蔥給韓總，買完菜後順道去最喜歡的小吃攤帶三碗滷肉飯回家和家人享用。\n\n與民眾的零距離接觸是韓國瑜堅持的獨特政治哲學，他讓台灣人知道政治不只是電視和網路上的相聲表演，也不是冷漠無情的報表和經濟數據，而是腳踏實地的與大家生活在一起，同時讓民眾知道當台灣人民有難時，韓總絕對不會臨陣脫逃!最艱難的時刻挺身而出!\n\n同甘共苦共患難，就是韓國瑜堅持的理想主義!"
 CHI.121.a: "韓導！凍蒜！韓導！凍蒜！"

 CHI.130.t: "如期舉行大選"
 CHI.130.d: "又到了四年一度的投票日，可這一次，似乎真的和過去有所不同。往日那種候選人的掃街拜票和造勢活動已不復見，人們圍坐在收音機旁聽著今年的選舉須知，拄著拐杖的退伍老兵跟戰友們在榮民之家盯著大堂的收音機、下了班的爸爸拉著剛放學的女兒打開電視、課堂裡大學生全都注視著手機裡的直播串流。\n\n張登凱就是其中之一，一直以來他都對台灣的政治環境斥之以鼻，不過是一群丑角在每四年的固定時間登台唱戲，時間到了演員下台散場，大夥嗑完瓜子散完場當作無事發生。選民跟政治人物對自家社會總是這樣，這也是身為一個資工系學生難以理解也相當鄙夷的現象，反正只要遠離政治，好好過自己的日子就行。但自從經歷過台海戰爭後，張登凱感覺一切都變了，他們家因為先天的罕見疾病而沒有被徵召，但一家三口還是很努力的幫助其他人，清理殘骸、安置傷患、分發食品，張登凱原以為自己會對他們冷眼相待，但穿著淺藍色穿梭在廢墟中，看著別人的家人對他不停道謝，張登凱的內心微微鬆動了些。\n\n當看見總統不畏砲火來到救助營視察時張登凱十分詫異，那些只存在於電視機和螢幕上的形象就這樣活生生地站在他面前，雖然總統對他們也只是說了幾句勉勵的話，但這是他第一次感覺到政治離他這麼近，也那麼的真實。\n\n有這種感覺的不只他一個，平時上課時還有不少同學會專心聽課，但最近沒有一個人願意抬起頭看一眼老師跟黑板，教授自己上課時也心不在焉，大家都在盯著各家新聞媒體轉發的選舉懶人包。下課時偶爾也能聽到有人討論政治，不像是過去那種為了各自立場的爭吵，而是為中華民國的未來感到深深的擔憂。\n\n明天一整天，人們都將放下手邊的工作，在小學教室、在體育館、在臨時搭建起來的帳篷裡接過選票，蓋上印章、投入票匭，所有人心裡都清楚，自己手中的一票將真正決定社會的未來。"
 CHI.130.a: "中華民國的未來..."

 CHI.141.t: "來是偶然，當選是必然!"
 CHI.141.d: "2020的總統大選，韓國瑜超乎全場預料成功當選了中華民國總統，很多人對於他的能力、信用表示質疑，甚至有的人認為這是中華民國的自由民主離毀滅最為接近的一次，但台海戰爭打響了所有人的臉頰，韓國瑜沒有背叛國家，沒有將這塊土地拱手送給獨裁專制的共產黨政權。無論他之前的想法如何，他帶領台灣打贏台海戰爭，他帶領人民生存了下來。而現在，這個民族英雄表明他有競選第二任總統職位的意願時，人們已經知道自己手中的選票該在哪里蓋印章了。最後韓國瑜以歷史最高票摘得總統寶座，他的競爭對手們——尤其是民進黨推出的賴清德得知他參選後幾乎失去競爭的動力，儘管心有不甘，仍是給予了鼓掌及祝福。\n\n未來是迷茫的，但只要韓國瑜站在政治舞台上，人民就知道自己應該去往何方。"
 CHI.141.a: "禿子跟著月亮走，我們跟著禿子走！"
 P2HKY_unlock_tt: "將解鎖§B韓國瑜§!政治國策與§B國民黨§!經濟與軍事國策"

 CHI.142.t: "在沙烏地阿拉伯的勝利!"
 CHI.142.d: ""
 CHI.142.a: "或許我們能從中獲取利益"
 
 CHI.BF.11.t: "回家"
 CHI.BF.11.d: "海風徐徐吹過警衛室，門上的鈴鐺叮噹作響，海浪也配合著風的節奏拍打上岸。黃興丁靠在有些落漆的鐵欄杆上，右手習慣性地貼上嘴唇做出抽菸的動作，金門的海岸線比起澎湖的還要更豐富一些，夜晚時廈門熙熙攘攘的天際線總是令他心身嚮往。爺爺和老爸總會在他小時候聊起在廈門捕魚的日子，也會跟他描述老家旁邊的青山綠水，當年國民黨遷台為了補充兵源就把爺爺抓去當兵，爸爸也繼承爺爺的衣缽，報名參軍。\n\n「就算回不去也沒關係，至少還能看看……」別人抽中金馬獎都是愁眉苦臉，只有老爸欣喜若狂，可惜他沒有撐到小三通開通的那一刻……。黃興丁換了個姿勢背靠欄杆，看向家----在金門租的小房子----的方向，爺爺和爸爸的骨灰就放在那裏，雖然爸爸總對他說不回去沒關係，但黃興丁總覺得自己虧欠他們太多，但他也不知道自己以後還有沒有機會帶著父輩，重新踏上那個既熟悉又陌生的故鄉。\n\n夕陽西下，跟來交接的哨兵換班，黃興丁背著步槍沿著小路走回營區，在台海戰爭後金門島滿目瘡痍，山壁上的彈孔清晰可見，遠處還有導彈襲擊時留下來的彈坑。黃興丁繞過這些地方走上觀光步道，走到那塊題著「毋忘在莒」大石碑前面，他對蔣介石沒甚麼好感，但後者在幾十年的長河中也逐漸變成一個符號，和鄉愁匯流，帶著老兵們的遺憾和不甘奔向遠方。\n\n他從頭盔內襯裡拿出那張的相片，泛黃的表面絲毫遮掩不了父親自信的面龐，當時的他深信中華民國有天一定能反攻大陸重返故鄉，到時候回家可得在村里好好炫耀一番才是!但就現在台灣疲憊不堪的軍力來說，他真的有機會帶著父親的遺志回家嗎?就算回去了，真的能像想像中那麼意氣風發的解放大陸同胞嗎?"
 CHI.BF.11.a: "算了，先做好眼前的事再說吧..."

